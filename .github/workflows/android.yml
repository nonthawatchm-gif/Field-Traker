name: Build Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: node build.js
      - run: npx cap sync android
      # Two apps: prod (the field app) and beta ("Agras ทดสอบ", installs alongside)
      - run: chmod +x gradlew && ./gradlew assembleProdDebug assembleBetaDebug
        working-directory: app/android
      - name: Name the APKs and check each carries the right variant.js
        working-directory: app/android/app/build/outputs/apk
        run: |
          cp prod/debug/app-prod-debug.apk ../../../../../app-prod.apk
          cp beta/debug/app-beta-debug.apk ../../../../../app-test.apk
          cd ../../../../..
          unzip -p app-prod.apk assets/public/variant.js | tee /dev/stderr | grep -q "'prod'"
          unzip -p app-test.apk assets/public/variant.js | tee /dev/stderr | grep -q "'test'"
      - uses: actions/upload-artifact@v4
        with:
          name: AgrasFieldTracker-debug-apks
          path: |
            app/app-prod.apk
            app/app-test.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            app/app-prod.apk
            app/app-test.apk
      # Keep only the three newest build-N releases; delete older ones and their tags
      - name: Delete old builds
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' \
            | grep -E '^build-[0-9]+$' | sort -t- -k2 -nr | tail -n +4 \
            | while read -r tag; do
                echo "deleting $tag"
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
