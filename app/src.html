            playTone([880, 880]);
            // key-event autosave: out-of-bounds is exactly the moment an
            // operator might set the phone down mid-mission to sort out why
            try {
              saveActiveSession(buildSessionSnapshot({
                field, sim, station: stationRef.current, phase: phaseRef.current, opMode: opModeRef.current,
                swath: swathRef.current, tankCapacity: tankCapacityRef.current, rateLRai: rateLRaiRef.current,
                tankBaselineArea: tankBaselineAreaRef.current, imgData: imgDataRef.current, originLatLng: originLatLngRef.current
              }));
            } catch (e) { /* best-effort */ }
          }
        }
      } else if (oobRef.current) { oobRef.current = false; setOob(false); }

      // hands-free refill lifecycle — proximity-driven, no taps required
      if (ph === 'running') {
        const om = opModeRef.current;
        const dStation = dist(sim.pos, stationRef.current);
        if (om === 'spray' && dStation <= REFILL_RADIUS) {
          sim.breakpoint = { ...sim.pos };
          opModeRef.current = 'refilling'; setOpMode('refilling');
          refillDeadlineRef.current = t + REFILL_DWELL_MS;
          // tank refills the instant the operator reaches the station — no
          // manual "Refilled Full Tank" tap required; the dwell below is just
          // a brief visual pause at the tank before auto-walking back.
          tankBaselineAreaRef.current = (sim.sprayedCells + sim.overlapCells) * CELL * CELL;
          lowLiquidWarnedRef.current = false;
        } else if (om === 'toStation' && dStation <= REFILL_RADIUS) {
          opModeRef.current = 'refilling'; setOpMode('refilling');
          refillDeadlineRef.current = t + REFILL_DWELL_MS;
          tankBaselineAreaRef.current = (sim.sprayedCells + sim.overlapCells) * CELL * CELL;
          lowLiquidWarnedRef.current = false;
        } else if (om === 'refilling') {
          if (dStation > REFILL_RADIUS) { opModeRef.current = 'toBreakpoint'; setOpMode('toBreakpoint'); }
          else if (sm === 'sim' && !manualPathRef.current && t >= refillDeadlineRef.current) {
            driveTo(sim.breakpoint);
          }
        } else if (om === 'toBreakpoint') {
          const dBp = sim.breakpoint ? dist(sim.pos, sim.breakpoint) : Infinity;
          if (dBp <= BREAKPOINT_RADIUS) {
            opModeRef.current = 'spray'; setOpMode('spray');
            sim.epoch += 1; sim.breakpoint = null;
            setResumeFlash(true); playTone([1180]);
            setTimeout(() => setResumeFlash(false), 2200);
          } else if (sm === 'sim' && !manualPathRef.current) {
            driveTo(sim.breakpoint || sim.pos);
          }
        }
      }

      // persistent-coverage bug fix: upload whatever changed this frame — from
      // ANY source (sim advance() or a live GPS fix) — so the on-screen mosaic
      // never silently falls behind the authoritative pixel buffer. Chunked to
      // the touched cell range so cost tracks new spray, not total field size.
      if (dirtyRef.current && gridCanvasRef.current && imgDataRef.current) {
        flushGridDirty(gridCanvasRef.current, imgDataRef.current, dirtyRef.current);
        dirtyRef.current = null;
      }
      frameCountRef.current++;
      if (frameCountRef.current % 180 === 0 && gridCanvasRef.current && imgDataRef.current) {
        flushGridFull(gridCanvasRef.current, imgDataRef.current);
      }

      if (t - lastTickT >= 200) { lastTickT = t; setTick((n) => n + 1); }

      const cv = canvasRef.current;
      if (cv) {
        let navLine = null;
        const om = opModeRef.current;
        if (ph === 'running' && om === 'toStation') navLine = { from: sim.pos, to: stationRef.current, color: 'rgba(46,230,199,.85)' };
        else if (ph === 'running' && om === 'refilling') navLine = { from: stationRef.current, to: sim.breakpoint, color: 'rgba(255,182,72,.85)' };
        else if (ph === 'running' && om === 'toBreakpoint') navLine = { from: sim.pos, to: sim.breakpoint, color: 'rgba(255,182,72,.85)' };

        const vv = viewRef.current, lv = gpsLiveRef.current;
        const sig = (ph === 'ready' || ph === 'boundary') && !satelliteOnRef.current
          ? [ph, cv.width, cv.height, vv.s, vv.ox, vv.oy, vv.angle, draftRef.current.length, lv.lat, lv.lng, oobRef.current, field.poly.length, field.poly[0] && field.poly[0].x, stationRef.current.x, stationRef.current.y, sim.pos.x, sim.pos.y, sim.fixes.length, field.area, field.gpsAnchored].join('|')
          : null;
        if (sig !== null && sig === lastSigRef.current) { raf = requestAnimationFrame(step); return; }
        lastSigRef.current = sig || '';
        drawScene(cv.getContext('2d'), cv.width, cv.height, viewRef.current, field, sim, gridCanvasRef.current, stationRef.current, {
          plotting: ph === 'boundary', drafting: draftRef.current,
          live: ph === 'boundary' && sm === 'gps' && gpsLiveRef.current.lat != null ? gpsLiveRef.current : null,
          static: ph === 'ready' || ph === 'boundary',
          oob: oobRef.current, navLine, hideStation: ph === 'boundary',
          accuracyRadius: sm === 'gps' && missionActive ? gpsLiveRef.current.accuracy : null,
          satellite: satelliteOnRef.current && unprojectRef.current
            ? { unproject: unprojectRef.current, tileCache: tileCacheRef.current, cacheStore: mapCacheRef.current, zoomCeilingRef }
            : null
        });

        if (ph === 'station') {
          const pt = stationDraftRef.current || stationRef.current;
          const v = viewRef.current, ctx = cv.getContext('2d');
          ctx.save(); ctx.strokeStyle = 'rgba(46,230,199,.6)'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
          ctx.beginPath(); ctx.arc(X_(v, pt.x), Y_(v, pt.y), 13 + 3 * Math.sin(t / 220), 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [paintCell]);

  const toFieldCoords = (clientX, clientY) => {
    const r = wrapRef.current.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const px = (clientX - r.left) * dpr, py = (clientY - r.top) * dpr;
    const v = viewRef.current;
    return { x: (px - v.ox) / v.s, y: (py - v.oy) / v.s };
  };
  const onMapTap = (e) => {
    const pt = e.touches ? e.touches[0] : e;
    if (phase === 'boundary') setDraft((d) => [...d, toFieldCoords(pt.clientX, pt.clientY)]);
    else if (phase === 'station') setStationDraft(toFieldCoords(pt.clientX, pt.clientY));
  };

  /* Satellite-assisted boundary plotting: a drag pans the camera (panRef —
   * field-local metre centre + view scale), a plain tap does nothing (points
   * only go in via "Mark Corner" / "Add Point at Crosshair" in this mode) —
   * kept as a *separate* gesture path from the existing tap-to-place flow
   * above so ordinary Sim/GPS plotting behaves exactly as it always has. */
  const MAX_ZOOM_S = 2200;   // view-scale ceiling — screen-px per field-metre at full digital zoom (sub-metre crop rows)
  const MIN_ZOOM_S = 0.3;

  const zoomMap = (dir) => {
    if (!panRef.current || maxZoomLock) return;
    const factor = dir > 0 ? 1.3 : 1 / 1.3;
    panRef.current = { ...panRef.current, s: Math.max(MIN_ZOOM_S, Math.min(MAX_ZOOM_S, panRef.current.s * factor)) };
    // (tile-fetch zoom is no longer tracked separately here — drawSatelliteTiles
    // derives it fresh from panRef/viewRef's own scale every frame, so it can
    // never drift out of sync with whatever gesture just changed that scale)
  };
  const toggleMaxZoomLock = () => {
    setMaxZoomLock((locked) => {
      if (!locked && panRef.current) { panRef.current = { ...panRef.current, s: MAX_ZOOM_S }; }
      return !locked;
    });
  };
  const centerOnMyLocation = () => {
    const live = gpsLiveRef.current;
    if (live.lat == null) return;
    const s = panRef.current ? panRef.current.s : viewRef.current.s;
    panRef.current = { x: live.x, y: live.y, s };
  };
  const addPointAtCrosshair = () => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const r = wrap.getBoundingClientRect();
    setDraft((d) => [...d, toFieldCoords(r.left + r.width / 2, r.top + r.height / 2)]);
  };

  /* Satellite-assisted map gestures — one finger drags to pan, two fingers
   * pinch to zoom (real two-pointer distance math, anchored to the pinch's
   * screen midpoint so the ground under your fingers stays put), and a
   * quick double-tap zooms in one step. All of it lives on top of the same
   * panRef {x,y,s} camera state the +/- buttons and Center-on-Me use, so
   * every input method drives one consistent camera. */
  // Manual pan/zoom is available on ANY phase that shows the satellite
  // basemap now, not just while plotting a boundary — pinch to zoom, one
  // finger to drag, double-tap to step in. onMapTap only ever does anything
  // on 'boundary'/'station' anyway, so falling through to it elsewhere is
  // already a safe no-op.
  const onWrapPointerDown = (e) => {
    if (!(PANNABLE_PHASES[phase] && satelliteOn && panRef.current)) { onMapTap(e); return; }
    try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* unsupported — gestures still work */ }
    activePointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (activePointersRef.current.size === 2 && !maxZoomLock) {
      dragRef.current = null;
      const pts = [...activePointersRef.current.values()];
      const dist2 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const midClientX = (pts[0].x + pts[1].x) / 2, midClientY = (pts[0].y + pts[1].y) / 2;
      const centerField = toFieldCoords(midClientX, midClientY);
      pinchRef.current = { startDist: Math.max(1, dist2), startS: panRef.current.s, centerField };
      return;
    }
    if (activePointersRef.current.size === 1) {
      const now = performance.now();
      const last = lastTapRef.current;
      const isDoubleTap = now - last.t < 320 && Math.hypot(e.clientX - (last.x || 0), e.clientY - (last.y || 0)) < 30;
      lastTapRef.current = { t: now, x: e.clientX, y: e.clientY };
      if (isDoubleTap) { zoomMap(1); lastTapRef.current = { t: 0 }; return; }
      dragRef.current = { startClientX: e.clientX, startClientY: e.clientY, startCenter: { x: panRef.current.x, y: panRef.current.y }, s: panRef.current.s, moved: false };
    }
  };
  const onWrapPointerMove = (e) => {
    if (activePointersRef.current.has(e.pointerId)) activePointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pinchRef.current && activePointersRef.current.size >= 2) {
      const pts = [...activePointersRef.current.values()].slice(0, 2);
      const dist2 = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const scaleFactor = dist2 / pinchRef.current.startDist;
      const targetS = Math.max(MIN_ZOOM_S, Math.min(MAX_ZOOM_S, pinchRef.current.startS * scaleFactor));
      if (!maxZoomLock) panRef.current = { x: pinchRef.current.centerField.x, y: pinchRef.current.centerField.y, s: targetS };
      return;
    }
    const d = dragRef.current;
    if (!d) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const dx = (e.clientX - d.startClientX) * dpr, dy = (e.clientY - d.startClientY) * dpr;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) d.moved = true;
    panRef.current = { x: d.startCenter.x - dx / d.s, y: d.startCenter.y - dy / d.s, s: d.s };
  };
  const onWrapPointerUp = (e) => {
    activePointersRef.current.delete(e.pointerId);
    if (activePointersRef.current.size < 2) pinchRef.current = null;
    if (activePointersRef.current.size === 0) dragRef.current = null;
  };

  // Lazily hand the camera to the user the first time satellite mode is
  // switched on (seeded from whatever the auto-fit view already showed) —
  // and hand it back (auto-fit resumes) once toggled off. Covers every
  // PANNABLE_PHASES screen now, not just plotting — but ready/running/
  // paused's auto-fit view can be ROTATED (computeFitView's v.angle), so
  // the screen-center-to-field-coords seed has to undo that rotation first
  // (the inverse of drawScene's ctx.rotate(-v.angle)); boundary/station
  // views never carry an angle, so this is a no-op there, same as before.
  useEffect(() => {
    if (!satelliteOn) { panRef.current = null; setMaxZoomLock(false); return; }
    // wait a beat so the auto-fit view for the new phase exists before seeding the camera from it
    const tid = setTimeout(() => {
    if (PANNABLE_PHASES[phase] && !panRef.current) {
      const c = canvasRef.current, v = viewRef.current;
      if (c && v.s > 0) {
        let sx = c.width / 2, sy = c.height / 2 + (phase === 'boundary' ? 0 : freeDyRef.current);
        if (v.angle) {
          const cosA = Math.cos(v.angle), sinA = Math.sin(v.angle);
          const dx = sx - v.ox, dy = sy - v.oy;
          sx = v.ox + dx * cosA - dy * sinA;
          sy = v.oy + dx * sinA + dy * cosA;
        }
        panRef.current = { x: (sx - v.ox) / v.s, y: (sy - v.oy) / v.s, s: v.s };
      }
    }
    }, 150);
    return () => clearTimeout(tid);
  }, [satelliteOn, phase]);

  /** Convert the active field's local-metre bbox (padded so panning near an
   *  edge still has imagery) into the tile x/y range needed at one zoom
   *  level — the same Web Mercator math drawSatelliteTiles uses, run once
   *  up front instead of per-frame. */
  const fieldTileRange = (field, z) => {
    const bx = field.bbox, pad = 0.35;
    const padX = bx.w * pad, padY = bx.h * pad;
    const corners = [
      unprojectRef.current(bx.minX - padX, bx.minY - padY),
      unprojectRef.current(bx.minX - padX, bx.maxY + padY),
      unprojectRef.current(bx.maxX + padX, bx.minY - padY),
      unprojectRef.current(bx.maxX + padX, bx.maxY + padY),
    ];
    const worldPts = corners.map((c) => lonLatToWorldPx(c.lng, c.lat, z));
    const n = Math.pow(2, z);
    const txs = worldPts.map((p) => Math.floor(p.x / TILE_SIZE));
    const tys = worldPts.map((p) => Math.floor(p.y / TILE_SIZE));
    return {
      tx0: Math.max(0, Math.min(...txs)), tx1: Math.min(n - 1, Math.max(...txs)),
      ty0: Math.max(0, Math.min(...tys)), ty1: Math.min(n - 1, Math.max(...tys)),
    };
  };

  /** "Download Field Map for Offline Use" — pre-fetches every tile the
   *  field could need at the current zoom plus the deep-zoom band, storing
   *  each in Cache Storage so drawSatelliteTiles finds a hit with zero
   *  network once the operator is out in the field. Capped at
   *  MAX_NATIVE_ZOOM — a tile Esri doesn't have at that depth simply fails
   *  this fetch (caught below, one missing tile doesn't fail the batch);
   *  the LIVE map still shows something there — it just won't be the
   *  sharpest step once that field's own zoomCeilingRef ratchets down from
   *  the same missing-tile signal, since only Esri responses persist to
   *  Cache Storage. Bounded concurrency (6 in flight) so a few hundred tiles don't open a few
   *  hundred sockets. */
  const mapDownloadInFlightRef = useRef(false); // guards against a manual tap and an automatic post-save prefetch racing each other
  const downloadFieldMapOffline = async () => {
    if (!unprojectRef.current) return;
    if (!mapCacheRef.current) { setDownloadState({ done: 0, total: 0, error: 'Offline storage is not available on this browser/connection.' }); return; }
    if (mapDownloadInFlightRef.current) return;
    mapDownloadInFlightRef.current = true;
    try {
      downloadAbortRef.current = false;
      const field = fieldRef.current;
      // Same derivation drawSatelliteTiles uses — the current on-screen scale,
      // converted to its matching integer zoom — rather than a separately
      // tracked ref that pinch-zooming never updated (see zoomForScale).
      const originNow = unprojectRef.current(0, 0);
      const curScale = panRef.current ? panRef.current.s : viewRef.current.s;
      const curZoom = Math.max(MIN_MAP_ZOOM, Math.min(MAX_NATIVE_ZOOM, Math.round(zoomForScale(curScale, originNow.lat))));
      const zooms = [...new Set([curZoom, 17, 18, MAX_NATIVE_ZOOM])].filter((z) => z >= MIN_MAP_ZOOM && z <= MAX_NATIVE_ZOOM);
      const jobs = [];
      zooms.forEach((z) => {
        const r = fieldTileRange(field, z);
        for (let ty = r.ty0; ty <= r.ty1; ty++) for (let tx = r.tx0; tx <= r.tx1; tx++) jobs.push({ z, tx, ty });
      });
      setDownloadState({ done: 0, total: jobs.length });
      let done = 0, idx = 0;
      const worker = async () => {
        while (idx < jobs.length) {
          if (downloadAbortRef.current) return;
          const job = jobs[idx++];
          try { await fetchTileBlob(esriTileUrl(job.z, job.tx, job.ty), mapCacheRef.current); } catch (e) { /* one missing tile doesn't fail the download */ }
          done++;
          setDownloadState({ done, total: jobs.length });
        }
      };
      await Promise.all(Array.from({ length: 6 }, worker));
      if (!downloadAbortRef.current) refreshCacheInfo();
    } finally {
      mapDownloadInFlightRef.current = false;
    }
  };
  const cancelDownload = () => { downloadAbortRef.current = true; setDownloadState(null); };

  /** Fire-and-forget background prefetch — called the moment a field is
   *  saved (closing the boundary, and saving it into the Field Library) so
   *  the operator never has to remember to open Offline Map and tap
   *  Download themselves. Silently does nothing when there's no real-world
   *  geo-anchor yet (a field plotted in Sim mode with no GPS fix taken) or
   *  offline storage isn't supported — the manual Offline Map panel is
   *  still there to explain why and to retry later. Never overlaps a
   *  download already in flight (including one the operator started by
   *  hand — mapDownloadInFlightRef covers both), and never surfaces an
   *  error UI on its own — that's only shown when the operator opens the
   *  panel themselves. */
  const autoDownloadFieldMap = () => {
    if (!('caches' in window) || !unprojectRef.current || !mapCacheRef.current) return;
    if (mapDownloadInFlightRef.current) return;
    downloadFieldMapOffline();
  };

  /** Best-effort cache size readout — iterates every stored tile response
   *  and sums its blob size. Cheap enough for a few hundred field tiles;
   *  only ever called on demand (after a download, or a manual refresh tap). */
  const refreshCacheInfo = async () => {
    if (!mapCacheRef.current) { setCacheInfo(null); return; }
    try {
      const keys = await mapCacheRef.current.keys();
      let bytes = 0;
      for (const req of keys) {
        const res = await mapCacheRef.current.match(req);
        if (res) { const blob = await res.blob(); bytes += blob.size; }
      }
      setCacheInfo({ tiles: keys.length, bytes });
    } catch (e) { setCacheInfo(null); }
  };
  const clearMapCache = async () => {
    if (!mapCacheRef.current) return;
    try {
      const keys = await mapCacheRef.current.keys();
      await Promise.all(keys.map((k) => mapCacheRef.current.delete(k)));
      tileCacheRef.current.clear();
      setCacheInfo({ tiles: 0, bytes: 0 });
    } catch (e) { /* best-effort */ }
  };

  const startPlotting = () => { clearActiveSession(); panRef.current = null; setDraft([]); setConfirmCloseField(false); setPhase('boundary'); };
  const undoPoint = () => { setConfirmCloseField(false); setDraft((d) => d.slice(0, -1)); };
  const closeBoundary = () => {
    if (draft.length < 3) return;
    setConfirmCloseField(false);
    panRef.current = null;
    resetField(draft, swath);
  };
  const cancelPlotting = () => { setConfirmCloseField(false); if (fieldRef.current.gpsAnchored || srcMode === 'sim') { setDraft([]); setPhase('ready'); } };
  const markCorner = () => { const live = gpsLiveRef.current; if (live.lat != null) setDraft((d) => [...d, { x: live.x, y: live.y }]); };

  const startStationSetup = () => { prevPhaseRef.current = phase; setStationDraft({ ...stationRef.current }); setPhase('station'); };
  const confirmStation = () => { if (stationDraft) stationRef.current = stationDraft; setPhase(prevPhaseRef.current); };
  const cancelStationSetup = () => setPhase(prevPhaseRef.current);
  const useMyLocationForStation = () => { const live = gpsLiveRef.current; if (live.lat != null) setStationDraft({ x: live.x, y: live.y }); };

  /** Session persistence — reusable snapshot writer, called from the 5s
   *  autosave tick, from key events (tank empty, out-of-bounds, app close),
   *  and from the explicit "Save & Pause" dock button. Reads everything off
   *  refs, so it's always safe to call regardless of which render defined it. */
  const saveSessionNow = () => {
    try {
      saveActiveSession(buildSessionSnapshot({
        field: fieldRef.current, sim: simRef.current, station: stationRef.current,
        phase: phaseRef.current, opMode: opModeRef.current, swath: swathRef.current,
        tankCapacity: tankCapacityRef.current, rateLRai: rateLRaiRef.current,
        tankBaselineArea: tankBaselineAreaRef.current, imgData: imgDataRef.current,
        originLatLng: originLatLngRef.current,
      }));
    } catch (e) { /* best-effort — autosave never blocks spraying */ }
  };

  /** Restore a saved session record — see the ordering note above initGrid:
   *  sim.lastPass must be the decoded array BEFORE initGrid runs (it reads
   *  simRef.current.lastPass to seed field.__ctx), and the decoded pixel
   *  buffer is written into imgDataRef.current.data AFTER initGrid (which
   *  allocates a fresh, empty one) — then flushed to the visible canvas. */
  const applySessionSnapshot = (saved) => {
    const field = buildField(saved.poly, saved.gpsAnchored, saved.swath);
    const sim = makeSim(field, saved.swath);
    try { sim.lastPass = new Int32Array(b64ToU8(saved.lastPass).buffer); } catch (e) { /* keep fresh lastPass */ }
    try { if (saved.passes) sim.passes = b64ToU8(saved.passes); } catch (e) { /* keep fresh passes */ }
    try { if (saved.missed) sim.missed = b64ToU8(saved.missed); } catch (e) { /* keep fresh missed flags */ }
    sim.pos = saved.simPos || sim.pos;
    sim.heading = saved.simHeading || 0;
    sim.breakpoint = saved.breakpoint || null;
    sim.distance = saved.distance || 0;
    sim.elapsed = saved.elapsed || 0;
    sim.sprayedCells = saved.sprayedCells || 0;
    sim.overlapCells = saved.overlapCells || 0;
    sim.epoch = saved.epoch || 0;
    sim.wp = saved.wp || 1;
    sim.track = [{ ...sim.pos }]; sim.fixes = [{ ...sim.pos }];

    simRef.current = sim;
    fieldRef.current = field;
    initGrid(field); // reads simRef.current.lastPass — must run after the assignment above

    try {
      const pixelBytes = b64ToU8(saved.pixels);
      if (imgDataRef.current && imgDataRef.current.data.length === pixelBytes.length) {
        imgDataRef.current.data.set(pixelBytes);
        flushGridFull(gridCanvasRef.current, imgDataRef.current);
      }
    } catch (e) { /* pixel restore failed — geometry/telemetry still resume correctly */ }

    stationRef.current = saved.station || stationRef.current;
    if (saved.originLat != null) {
      projectorRef.current = makeProjector(saved.originLat, saved.originLng);
      unprojectRef.current = makeUnprojector(saved.originLat, saved.originLng);
      originLatLngRef.current = { lat: saved.originLat, lng: saved.originLng };
    }
    manualPathRef.current = null; setExcursionActive(false); clearAlerts();
    opModeRef.current = saved.opMode || 'spray'; setOpMode(saved.opMode || 'spray');
    swathRef.current = saved.swath; setSwath(saved.swath);
    tankCapacityRef.current = saved.tankCapacity; setTankCapacity(saved.tankCapacity);
    rateLRaiRef.current = saved.rateLRai; setRateLRai(saved.rateLRai);
    tankBaselineAreaRef.current = saved.tankBaselineArea || 0;
    lowLiquidWarnedRef.current = false;
    restoredRef.current = true;
    // always resume into PAUSED — the operator walks back to the breakpoint
    // (per the spec's own resume workflow) and explicitly taps Resume/Play
    setPhase('paused');
    setTick((n) => n + 1);
  };

  const tankEmpty = () => {
    if (opMode !== 'spray' || phase !== 'running') return;
    const sim = simRef.current;
    const dStation = dist(sim.pos, stationRef.current);
    sim.breakpoint = { ...sim.pos };
    if (dStation <= REFILL_RADIUS) {
      opModeRef.current = 'refilling'; setOpMode('refilling'); refillDeadlineRef.current = performance.now() + REFILL_DWELL_MS;
      tankBaselineAreaRef.current = (sim.sprayedCells + sim.overlapCells) * CELL * CELL;
      lowLiquidWarnedRef.current = false;
    } else {
      opModeRef.current = 'toStation'; setOpMode('toStation');
      if (srcMode === 'sim') driveTo(stationRef.current);
    }
    saveSessionNow(); // key-event autosave — operator may set the phone down here to walk to the tank
  };

  /** Quick "Refilled Full Tank" action — re-baselines the tank-level math
   *  against the mission's cumulative spray-pass area right now, instantly
   *  snapping the live gauge back to 100% without touching the mission-wide
   *  totals (distance, elapsed time, overall litres) used in the summary. */
  const refillTank = () => {
    const s = simRef.current;
    tankBaselineAreaRef.current = (s.sprayedCells + s.overlapCells) * CELL * CELL;
    lowLiquidWarnedRef.current = false;
    setTick((n) => n + 1);
  };

  /** Tank-tile tap handler (Spec §3D "user taps Refill"). While actively
   *  spraying, tapping this is the Refill TRIGGER itself — same
   *  breakpoint + nav-line + refilling flow as a "Tank Empty" tap, not a
   *  silent instant top-off. Once already en route to/at the station,
   *  the tap instead confirms the tank is full (refillTank's original job). */
  const onTankTileRefill = () => {
    if (opMode === 'spray') tankEmpty();
    else refillTank();
  };

  const simulateExcursion = () => {
    if (manualPathRef.current || phase !== 'running' || opMode !== 'spray') return;
    const sim = simRef.current, poly = fieldRef.current.poly;
    const edge = nearestEdgePoint(sim.pos, poly);
    const outside = { x: edge.proj.x + edge.nx * 4.5, y: edge.proj.y + edge.ny * 4.5 };
    const start = { ...sim.pos };
    setExcursionActive(true);
    manualPathRef.current = {
      legs: [{ to: edge.proj, dur: 900 }, { to: outside, dur: 1000 }, { to: outside, dur: 1500 }, { to: edge.proj, dur: 1000 }, { to: start, dur: 900 }],
      idx: 0, t0: performance.now(), from: { ...sim.pos }, onDone: () => setExcursionActive(false)
    };
  };

  const finishMission = () => { manualPathRef.current = null; clearAlerts(); resetOpMode(); clearActiveSession(); setPhase('done'); };

  /** Snapshot the finished mission — coverage thumbnail, physical-quantity
   *  summary, and compliance record (PPE/user/weather, Spec §5) — into the
   *  persisted mission log, then start fresh. */
  const saveMission = () => {
    const s = simRef.current, f = fieldRef.current;
    const areaSprayedNow = s.sprayedCells * CELL * CELL;
    const raiNow = toRai(areaSprayedNow);
    const raiDecNow = areaSprayedNow / 1600;
    const overlapRateNow = s.sprayedCells > 0 ? (s.overlapCells / s.sprayedCells) * 100 : 0;
    // total liquid used across the whole mission (every refill included) —
    // counts overlapped cells too, since a re-pass over already-sprayed
    // ground genuinely uses chemical a second time.
    const totalPassAreaNow = (s.sprayedCells + s.overlapCells) * CELL * CELL;
    const litresNow = (totalPassAreaNow / 1600) * rateLRai;
    let missedCellsNow = 0;
    for (let mi = 0; mi < s.missed.length; mi++) missedCellsNow += s.missed[mi];
    const missedRaiNow = (missedCellsNow * CELL * CELL) / 1600;
    const overlapRaiNow = (s.overlapCells * CELL * CELL) / 1600;
    const overlapWastedLitresNow = overlapRaiNow * rateLRai;

    let thumb = null;
    try {
      const off = document.createElement('canvas');
      off.width = 480; off.height = 300;
      const v = computeView(off.width, off.height, f.bbox, 4);
      drawScene(off.getContext('2d'), off.width, off.height, v, f, s, gridCanvasRef.current, stationRef.current, { static: true });
      thumb = off.toDataURL('image/png');
    } catch (e) { /* canvas export unavailable — record is kept without a thumbnail */ }

    const record = {
      id: Date.now(), ts: Date.now(),
      areaSprayed: areaSprayedNow, rai: raiNow.rai, ngan: raiNow.ngan, wa: raiNow.wa, raiDec: raiDecNow,
      distance: s.distance, elapsed: s.elapsed, overlapRate: overlapRateNow,
      overlapRai: overlapRaiNow, overlapWastedLitres: overlapWastedLitresNow,
      missedRai: missedRaiNow,
      litres: litresNow, rateLRai, tankCapacity, swath, fieldRai: f.area / 1600, thumb,
      // Compliance log (Spec §5): PPE checklist state, operator, weather.
      checklist: { ppe: checklist.ppe, mixedRate: checklist.mixedRate, nozzle: checklist.nozzle, wind: checklist.wind, checkedAt: checklist.checkedAt },
      operator: checklist.operator || '', weather: checklist.weather || '',
      // Live wind/rain reading from Open-Meteo at the time this mission was
      // saved, if one was fetched — a source-verified figure alongside the
      // operator's own manual weather note, not a replacement for it.
      weatherApi: sprayWeather ? {
        windKmh: sprayWeather.windKmh, gustKmh: sprayWeather.gustKmh,
        rainNowMm: sprayWeather.rainNowMm, rainSoonProb: sprayWeather.rainSoonProb,
        fetchedAt: sprayWeather.fetchedAt,
      } : null,
    };
    setMissions((prev) => {
      const next = [record, ...prev].slice(0, HISTORY_CAP);
      saveHistory(next);
      return next;
    });
    touchFieldLastSprayed(activeFieldId); // stamp the saved field's "last sprayed" date, if this mission ran against one
    // Wind is a point-in-time reading, so it (and the weather note) reset
    // for the NEXT mission even though PPE/mix-rate/nozzle keep their
    // 4-hour memory — same rule the checklist load already applies.
    setChecklistField('wind', false); setChecklistField('weather', '');
    resetSim(swath);
  };

  /** "Touch-up Missed Spots" (Spec §4D Catch-Up Mode) — starts a NEW mission
   *  on the SAME field, but seeds the fresh sim's coverage grid with the
   *  just-finished mission's per-cell state (passes + missed flags) instead
   *  of a blank one, so the red missed-spot hatch (and existing sprayed/
   *  overlapped ground) carries straight over. Only meaningful right after
   *  finishing — simRef.current here is still the mission that just ended. */
  const startTouchUp = () => {
    const field = fieldRef.current;
    const prev = simRef.current;
    const fresh = makeSim(field, swath);
    fresh.lastPass.set(prev.lastPass);
    fresh.passes.set(prev.passes);
    fresh.missed.set(prev.missed);
    fresh.sprayedCells = prev.sprayedCells;
    fresh.overlapCells = prev.overlapCells;
    simRef.current = fresh;
    initGrid(field);
    const img = imgDataRef.current;
    if (img) {
      for (let idx = 0; idx < field.GW * field.GH; idx++) {
        const i = idx % field.GW, j = Math.floor(idx / field.GW);
        if (fresh.passes[idx] > 0) paintCell(i, j, fresh.passes[idx]);
        else if (fresh.missed[idx]) paintCell(i, j, -1);
      }
      flushGridFull(gridCanvasRef.current, imgDataRef.current);
    }
    field.__ctx.lastPass = fresh.lastPass;
    manualPathRef.current = null; setExcursionActive(false); resetOpMode(); clearAlerts();
    tankBaselineAreaRef.current = 0; lowLiquidWarnedRef.current = false;
    setChecklistField('wind', false); setChecklistField('weather', '');
    setPhase('running');
  };

  const clearHistory = () => {
    if (!confirmClear) { setConfirmClear(true); setTimeout(() => setConfirmClear(false), 4000); return; }
    setMissions([]); saveHistory([]); setConfirmClear(false); setSelectedMissionId(null);
  };

  const exportHistoryCSV = () => {
    try {
      const blob = new Blob([missionsToCSV(missions)], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'agras-mission-history.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { /* download blocked by the host sandbox — data still lives in history */ }
  };

  const sim = simRef.current, field = fieldRef.current;
  const areaSprayed = sim.sprayedCells * CELL * CELL;
  const coveragePct = Math.min(100, (areaSprayed / field.area) * 100) || 0;
  const overlapRate = sim.sprayedCells > 0 ? (sim.overlapCells / sim.sprayedCells) * 100 : 0;
  const speedMs = sim.elapsed > 2 ? sim.distance / sim.elapsed : 0;      // lifetime average — mission summary only
  // ---- Live Speed-Based Flow Rate & Pace Engine -----------------------
  // liveSpeedMs is an EMA sampled every frame (see the main loop) so the
  // widget reacts to the operator's actual current pace, not a lifetime
  // average — a stall or a burst of speed shows up within ~1 second.
  const liveSpeedMs = speedEmaRef.current;
  const liveSpeedKmh = liveSpeedMs * 3.6;
  const paceZone = liveSpeedKmh < 0.3 ? 'stopped' : liveSpeedKmh < 2.5 ? 'slow' : liveSpeedKmh > 3.5 ? 'fast' : 'ideal';
  const paceLabel = { stopped: 'STOPPED', slow: 'TOO SLOW · OVER SPRAYING', fast: 'TOO FAST · UNDER SPRAYING', ideal: 'IDEAL PACE' }[paceZone];
  const paceColor = { stopped: '#7C8C8C', slow: '#4EA8FF', fast: '#FF5252', ideal: '#34C76F' }[paceZone];
  // flow rate = ground area covered per minute (swath x speed) x solution
  // per square metre (rateLRai / 1600 rai-in-sqm) — the actual L/min a pump
  // set to the target application rate needs to deliver at THIS pace.
  const flowLMin = swath * liveSpeedMs * (rateLRai / 1600) * 60;
  const rai = toRai(areaSprayed);
  const raiDec = areaSprayed / 1600;
  // Mission Summary "physical quantity" metrics (Spec §4D): convert the
  // overlap and missed-spot COUNTS into Rai and a wasted-litres figure
  // instead of leaving them as bare percentages.
  let missedCellsCount = 0;
  for (let mi = 0; mi < sim.missed.length; mi++) missedCellsCount += sim.missed[mi];
  const missedRai = (missedCellsCount * CELL * CELL) / 1600;
  const overlapRai = (sim.overlapCells * CELL * CELL) / 1600;
  const overlapWastedLitres = overlapRai * rateLRai;
  // the saved-library entry (if any) backing the field currently loaded —
  // drives the prominent Field Selector card on the pre-mission setup screen
  const activeFieldEntry = activeFieldId ? fieldLibrary.find((f) => f.id === activeFieldId) : null;
  // whole-mission liquid total (every refill included) — counts overlap
  // passes as real re-application, same basis the live tank gauge uses below
  const totalPassArea = (sim.sprayedCells + sim.overlapCells) * CELL * CELL;
  const litres = (totalPassArea / 1600) * rateLRai;
  const running = phase === 'running';
  const dStation = dist(sim.pos, stationRef.current);
  const dBreakpoint = sim.breakpoint ? dist(sim.pos, sim.breakpoint) : null;
  // Spec §4C: direction back to the boundary for the Auto-Pause banner arrow.
  const oobArrowDeg = oob ? bearingTo(sim.pos, nearestEdgePoint(sim.pos, field.poly).proj) : 0;
  const gpsQuality = gpsInfo ? (gpsInfo.accuracy <= 5 ? 'STRONG' : gpsInfo.accuracy <= 15 ? 'FAIR' : 'WEAK') : null;
  const gpsColor = gpsQuality === 'STRONG' ? '#34C76F' : gpsQuality === 'FAIR' ? '#FFB648' : '#FF5252';
  const gpsColorClass = gpsQuality === 'STRONG' ? 'text-[#34C76F]' : gpsQuality === 'FAIR' ? 'text-[#FFB648]' : 'text-[#FF5252]';

  // ---- Navigation-Style HUD (opt-in) ----------------------------------
  // Direction banner target follows whatever the operator is actually
  // walking toward right now — the next route waypoint while spraying, the
  // station while heading in to refill, the breakpoint while walking back
  // out — same targets the nav-line on the map already points at.
  const navTarget =
    opMode === 'toStation' ? stationRef.current :
    opMode === 'toBreakpoint' ? (sim.breakpoint || sim.pos) :
    opMode === 'refilling' ? null :
    (sim.route && sim.route[Math.min(sim.wp, sim.route.length - 1)]) || sim.pos;
  const navBearingDeg = navTarget ? bearingTo(sim.pos, navTarget) : 0;
  const navDirWord = navTarget ? compassWord(navBearingDeg) : null;
  // Distance/ETA use the remaining route length while spraying (the
  // boustrophedon passes still to walk), or straight-line distance while
  // running an errand to/from the station — whichever matches navTarget.
  const navDistanceM = opMode === 'spray' ? routeRemainingDistance(sim) : (navTarget ? dist(sim.pos, navTarget) : 0);
  const navEffSpeedMs = liveSpeedMs > 0.15 ? liveSpeedMs : (sim.elapsed > 5 ? sim.distance / sim.elapsed : 0);
  const navEtaSec = navEffSpeedMs > 0 ? navDistanceM / navEffSpeedMs : null;
  const navEtaLabel = navEtaSec == null ? '—' : navEtaSec < 60 ? '<1 min' : `${Math.round(navEtaSec / 60)} min`;
  const navDistLabel = navDistanceM >= 1000 ? `${(navDistanceM / 1000).toFixed(1)} km` : `${Math.round(navDistanceM)} m`;
  const navArrivalLabel = navEtaSec == null ? '--:--' : (() => {
    const d = new Date(Date.now() + navEtaSec * 1000);
    return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  })();

  // ---- Tank & Liquid Volume Tracker -----------------------------------
  // Litres used *since the last refill* (not the mission-wide total above) —
  // this is what the live gauge draws down from tankCapacity.
  const litresSinceRefill = ((totalPassArea - tankBaselineAreaRef.current) / 1600) * rateLRai;
  const tankLevel = Math.max(0, Math.min(tankCapacity, tankCapacity - litresSinceRefill));
  const tankPct = tankCapacity > 0 ? (tankLevel / tankCapacity) * 100 : 0;
  const remainingRaiTank = rateLRai > 0 ? tankLevel / rateLRai : 0;
  const tankLow = tankPct <= 10;
  const tankColor = tankLow ? '#FF5252' : tankPct <= 25 ? '#FFB648' : '#2EE6C7';
  const tankTextClass = tankLow ? 'text-[#FF5252]' : tankPct <= 25 ? 'text-[#FFB648]' : 'text-[#2EE6C7]';

  // Auto-pause: tank hits 0 mid-spray → same breakpoint/refill-station flow
  // as a manual "TANK EMPTY" tap, with no operator input needed.
  useEffect(() => {
    if (phase === 'running' && opMode === 'spray' && tankCapacity > 0 && tankLevel <= 0) tankEmpty();
  }, [phase, opMode, tankLevel <= 0]);

  // One-shot low-liquid tone as the gauge crosses into the red zone; re-arms
  // once the tank is topped back up above it (refill, or a fresh mission).
  useEffect(() => {
    if (phase !== 'running') return;
    if (tankLow && tankPct > 0 && !lowLiquidWarnedRef.current) { lowLiquidWarnedRef.current = true; playTone([660, 440]); }
    else if (!tankLow) lowLiquidWarnedRef.current = false;
  }, [phase, tankLow, tankPct > 0]);

  const statusLabel = oob ? 'SPRAY OFF / OUT OF FIELD' : (
    phase === 'boundary' ? 'PLOT BOUNDARY' :
    phase === 'station' ? 'SET REFILL STATION' :
    phase === 'ready' ? 'READY' :
    phase === 'done' ? 'COMPLETE' :
    phase === 'paused' ? 'PAUSED' :
    { spray: 'SPRAYING', toStation: 'HEAD TO REFILL STATION', refilling: 'AT REFILL STATION', toBreakpoint: 'RETURN TO BREAKPOINT' }[opMode]
  );
  const guidanceCopy = {
    toStation: { title: 'HEAD TO REFILL STATION', tone: 'cyan' },
    refilling: { title: 'REFILLING…', sub: 'AT REFILL STATION - TANK FILLING...', tone: 'amber' },
    toBreakpoint: { title: 'RETURN TO BREAKPOINT', tone: 'amber' }
  }[opMode];

  // Which single hint panel — GPS acquisition, boundary help, station help —
  // occupies the top zone's one hint slot this render. They're mutually
  // exclusive by construction now (one slot, not three independently
  // absolutely-positioned siblings that used to be able to land on the
  // exact same pixels), so there's nothing left for them to collide with.
  const topHint =
    srcMode === 'gps' && gpsStatus !== 'active' ? 'gps' :
    phase === 'boundary' ? 'boundary' :
    phase === 'station' ? 'station' : null;

  return (
    <div
      className="fixed inset-0 bg-[#0A0E10] text-[#D3DEDC] font-sans select-none overflow-hidden"
      style={{
        paddingTop: 'env(safe-area-inset-top)',
        paddingBottom: 'env(safe-area-inset-bottom)',
        paddingLeft: 'env(safe-area-inset-left)',
        paddingRight: 'env(safe-area-inset-right)',
      }}
    >
      {oob && <div className="oob-border absolute inset-0 z-30 pointer-events-none" />}
      {resumeFlash && <div className="green-flash absolute inset-0 z-30 pointer-events-none" />}

      {/* Map viewport — full-bleed background layer. Everything else below is
          one flex column stacked ON TOP of it (z-10), never positioned by
          guessed pixel offsets, so no HUD element can land on the same
          coordinates as another regardless of screen height or content. */}
      <div ref={wrapRef} className="absolute inset-0"
        onPointerDown={onWrapPointerDown} onPointerMove={onWrapPointerMove} onPointerUp={onWrapPointerUp} onPointerCancel={onWrapPointerUp}>
        {/* image-rendering here guards the canvas's own backing-bitmap-to-CSS-pixel
            scaling (relevant if a resize ever lands between a devicePixelRatio
            backing-store resize and its matching CSS size, or on browsers that
            re-touch canvas compositing on zoom/pan) — belt-and-braces alongside
            the retina-resolution backing store set in the fit() resize handler
            and the high-quality smoothing set in drawSatelliteTiles, which is
            where the actual tile sharpness is decided. Two declarations (old
            webkit value, then the standard one) so whichever the browser
            understands wins — a plain inline style object can't hold both, so
            this is a real <style> rule instead. */}
        <style>{'.agras-map-canvas{image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;}'}</style>
        <canvas ref={canvasRef} className="absolute inset-0 touch-none agras-map-canvas" />
        {phase === 'boundary' && satelliteOn && (
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
            <Crosshair size={36} strokeWidth={1.5} className="text-[#2EE6C7]" style={{ filter: 'drop-shadow(0 0 4px rgba(0,0,0,.85))' }} />
          </div>
        )}
      </div>

      {/* overflow-y-auto here is the fallback for phones where the READY
          screen's stacked content (field selector, spray settings summary,
          pre-flight checklist, START SPRAYING, field setup + tools rows)
          simply doesn't fit in one viewport — without it, everything past
          the bottom edge (e.g. the "Resume saved session" tool row) renders
          off-screen with no way to reach it, since the outermost wrapper is
          overflow-hidden. The flexible middle zone below keeps its own
          nested overflow-y-auto for the telemetry-tiles-only scroll case
          (running/paused); this one is the whole-column safety net. */}
      <div className="absolute inset-0 z-10 flex flex-col pointer-events-none overflow-y-auto">

        {/* ---------- TOP SAFE ZONE ---------- */}
        <div className="flex flex-col gap-2 p-3 shrink-0" style={{ paddingTop: 'max(12px, env(safe-area-inset-top))' }}>

          {/* Navigation-Style HUD (opt-in, Spray Settings) — a Google
              Maps-style direction banner naming which way the operator is
              currently walking (next swath leg / to the station / back to
              the breakpoint). Suppressed during an active OOB alert or the
              resume flash — those already carry their own directional
              guidance and take priority. */}
          {navHud && running && !oob && !resumeFlash && (
            <div className="pointer-events-auto rounded-2xl bg-[#0B4A44] text-white px-4 py-3.5 flex items-center gap-3 shadow-[0_8px_24px_rgba(11,74,68,.5)]">
              {opMode === 'refilling' ? (
                <>
                  <Fuel size={24} strokeWidth={2.4} className="shrink-0" />
                  <p className="font-display font-extrabold text-lg tracking-wide truncate">Refilling at station</p>
                </>
              ) : (
                <>
                  <NavArrowUp size={26} strokeWidth={2.6} className="shrink-0" style={{ transform: `rotate(${navBearingDeg}deg)` }} />
                  <p className="font-display font-extrabold text-lg tracking-wide truncate">Head {navDirWord}</p>
                </>
              )}
            </div>
          )}

          {/* Emergency alerts — dedicated slot, highest z-index, always the
              first thing in the column so it can never be obscured by (or
              obscure) the status row or telemetry below it. */}
          {(oob || resumeFlash) && (
            <div className="z-40 flex justify-center pointer-events-none">
              {oob ? (
                // Spec §4C: a full-width ORANGE banner (not red — red is
                // reserved for the tank/critical-alert palette elsewhere),
                // plus an arrow pointing back toward the nearest boundary
                // point so the operator knows which way to walk.
                <div className="pointer-events-auto w-full max-w-[420px] rounded-xl bg-[#FFB648] text-[#3A2400] px-4 py-3 flex items-center gap-2.5 shadow-[0_8px_28px_rgba(255,182,72,.5)]">
                  <Navigation size={22} strokeWidth={2.4} className="shrink-0" style={{ transform: `rotate(${oobArrowDeg}deg)` }} />
                  <div className="leading-tight min-w-0">
                    <p className="font-display font-extrabold text-sm tracking-wide">OUT OF BOUNDS — PAUSED</p>
                    <p className="text-xs opacity-90 mt-0.5">Spraying auto-cut off — walk back inside to resume</p>
                  </div>
                </div>
              ) : (
                <div className="pointer-events-auto w-full max-w-[420px] rounded-xl bg-[#34C76F] text-[#052112] px-4 py-3 flex items-center gap-2.5 shadow-[0_8px_28px_rgba(52,199,111,.5)]">
                  <CheckCircle2 size={22} strokeWidth={2.4} className="shrink-0" />
                  <p className="font-display font-extrabold text-sm tracking-wide">BREAKPOINT REACHED - SPRAYING RESUMED</p>
                </div>
              )}
            </div>
          )}

          {/* Status pill + Mode/GPS/Tank control group — one flex row, gap-2,
              each side capped with min-w-0 + truncate so long field names or
              GPS numbers never wrap onto (or push into) the other side. */}
          <div className="flex items-start justify-between gap-2">
            <Glass data-hud className="pointer-events-auto px-3 py-2 flex items-center gap-2 min-w-0 flex-1 max-w-[54%]" onClick={secretDevTap}>
              <Radar size={15} className={'shrink-0 ' + (oob ? 'text-[#FF5252]' : running ? 'text-[#2EE6C7]' : 'text-[#7C8C8C]')} />
              <div className="leading-tight min-w-0">
                <p className={'font-display text-xs font-bold tracking-[.01em] truncate ' + (oob ? 'text-[#FF5252]' : '')}>{statusLabel}</p>
                <p className="text-[9px] text-[#7C8C8C] font-mono truncate">field {(field.area / 1600).toFixed(2)} rai · swath {swath.toFixed(1)}m</p>
              </div>
            </Glass>

            <Glass data-hud className="pointer-events-auto px-2.5 py-2 flex flex-col gap-1.5 w-[176px] shrink-0 overflow-hidden">
              {devMode && <Toggle2 value={srcMode} onChange={setSrcMode} options={[{ v: 'sim', label: 'SIM' }, { v: 'gps', label: 'GPS' }]} />}
{devMode && srcMode === 'sim' && (
                <>
                  <div className="flex items-center justify-between gap-2">
                    <Switch on={autoWalk} onChange={setAutoWalk} label="AUTO-WALK" />
                    <div className="flex gap-1">
                      {[1, 20, 60].map((s) => (
                        <button key={s} onClick={() => setMult(s)}
                          className={'font-mono text-[10px] min-w-[26px] min-h-[30px] px-0.5 rounded ' + (mult === s ? 'bg-[#2EE6C7] text-[#06231D] font-bold' : 'text-[#7C8C8C]')}>{s}×</button>
                      ))}
                    </div>
                  </div>
                  {phase === 'running' && (
                    <button onClick={simulateExcursion} disabled={excursionActive || opMode !== 'spray'}
                      className="w-full min-h-[30px] flex items-center justify-center gap-1 text-[9px] font-mono tracking-wide text-[#FFB648] border border-[#2A363A] rounded py-1 disabled:opacity-40">
                      <AlertTriangle size={11} className="shrink-0" /> <span className="truncate">{excursionActive ? 'DEMO RUNNING…' : 'TEST OUT-OF-BOUNDS'}</span>
                    </button>
                  )}
                </>
              )}
              {srcMode === 'gps' && (
                <button onClick={() => setGpsCardOpen((v) => !v)} className="flex items-center justify-between gap-1.5 min-w-0 w-full">
                  <span className="text-[9px] font-mono text-[#7C8C8C] truncate">
                    {gpsStatus === 'active' && gpsInfo ? `±${gpsInfo.accuracy.toFixed(1)}m` : gpsStatus === 'requesting' ? 'locating…' : gpsStatus}
                  </span>
                  <span className="flex items-center gap-1 shrink-0">
                    {gpsQuality && <span className="text-[8.5px] font-mono font-bold px-1.5 py-0.5 rounded" style={{ color: gpsColor, border: `1px solid ${gpsColor}55` }}>{gpsQuality}</span>}
                    <ChevronDown size={11} className={'text-[#7C8C8C] transition-transform ' + (gpsCardOpen ? 'rotate-180' : '')} />
                  </span>
                </button>
              )}

              {/* Ready-phase station access moved into the consolidated
                  "Field setup" menu below (less clutter up here) — kept as a
                  quick one-tap action only while a mission is actually live,

              {(phase === 'running' || phase === 'paused') && (
                <button onClick={startStationSetup} className="w-full min-h-[30px] flex items-center justify-center gap-1 text-[9px] font-mono tracking-wide text-[#2EE6C7] border border-[#2A363A] rounded py-1">
                  <Droplet size={11} /> SET STATION
                </button>
              )}
            </Glass>
          </div>

          {/* Expandable raw-telemetry card — its own row, in-flow, so it
