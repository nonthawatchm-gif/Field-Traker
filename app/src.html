              covering anything (same non-overlap pattern as the rest of the
              top zone). */}
          {srcMode === 'gps' && gpsCardOpen && (
            <Glass className="pointer-events-auto px-3.5 py-3">
              <div className="grid grid-cols-3 gap-x-2 gap-y-2.5">
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#7C8C8C]">LAT</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate">{gpsInfo ? gpsInfo.lat.toFixed(6) : '—'}</p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#7C8C8C]">LNG</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate">{gpsInfo ? gpsInfo.lng.toFixed(6) : '—'}</p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#7C8C8C]">ACCURACY</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate" style={{ color: gpsColor }}>{gpsInfo ? `±${gpsInfo.accuracy.toFixed(1)}m` : '—'}</p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#7C8C8C]">SPEED</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate">{gpsExtraRef.current.speed != null ? `${(gpsExtraRef.current.speed * 3.6).toFixed(1)} km/h` : '—'}</p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#7C8C8C]">HEADING</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate flex items-center gap-1">
                    <Compass size={11} className="text-[#2EE6C7] shrink-0" style={{ transform: gpsExtraRef.current.heading != null ? `rotate(${gpsExtraRef.current.heading}deg)` : undefined }} />
                    {gpsExtraRef.current.heading != null ? `${gpsExtraRef.current.heading.toFixed(0)}°` : '—'}
                  </p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#7C8C8C]">ALTITUDE</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate">{gpsExtraRef.current.altitude != null ? `${gpsExtraRef.current.altitude.toFixed(0)} m` : '—'}</p>
                </div>
              </div>
            </Glass>
          )}

          {/* One hint slot — GPS acquisition, boundary help, or station help.
              Being in-flow here (not a sibling independently pinned to the
              same top offset as the telemetry tiles) is what makes it
              physically impossible for this to overlap the tiles below: its
              own height simply pushes them down instead of covering them. */}
          {topHint === 'gps' && (
            <Glass className="pointer-events-auto px-3.5 py-3 border-[#FFB648]/40">
              <p className="font-display text-sm font-bold tracking-wide text-[#FFB648]">
                {{ requesting: 'REQUESTING GPS ACCESS…', denied: 'LOCATION PERMISSION DENIED', unavailable: 'GPS UNAVAILABLE', insecure: 'HTTPS REQUIRED FOR GPS', idle: 'STARTING GPS…' }[gpsStatus]}
              </p>
              <p className="text-xs text-[#9AABAA] mt-1 leading-snug">
                {gpsStatus === 'requesting' && 'Allow location access when your browser prompts you.'}
                {gpsStatus === 'denied' && 'This page’s location permission is set to Block. Open the site settings (the icon next to the address bar) and set Location to Allow — the browser remembers that choice for this page, so you won’t be asked again.'}
                {gpsStatus === 'unavailable' && 'This device or browser can’t report a location right now.'}
                {gpsStatus === 'insecure' && 'Open this page over https:// (or localhost) — browsers block GPS on insecure origins.'}
              </p>
              <div className="mt-2 flex items-center gap-4">
                {gpsStatus === 'denied' && <button onClick={() => setGpsRetryTick((n) => n + 1)} className="min-h-[30px] text-xs font-mono text-[#FFB648] underline">Try Again</button>}
              </div>
            </Glass>
          )}
          {topHint === 'boundary' && (
            <Glass className="pointer-events-auto px-3.5 py-3">
              <p className="font-display text-sm font-bold tracking-wide text-[#2EE6C7]">MAP THE PERIMETER</p>
              <p className="text-xs text-[#9AABAA] mt-1 leading-snug">
                {satelliteOn
                  ? 'Drag the map so the crosshair sits on each corner, then tap Add at Crosshair.'
                  : srcMode === 'gps'
                  ? 'Walk the real edges and tap Mark Corner at each one, or tap the map.'
                  : 'Tap the field edges in order, ' + Math.max(0, 3 - draft.length) + ' more to close.'}
              </p>
              <p className="font-mono text-[10px] text-[#7C8C8C] mt-1.5">{draft.length} point{draft.length === 1 ? '' : 's'} plotted{srcMode === 'gps' && !fieldRef.current.gpsAnchored ? ' · map a real boundary to continue' : ''}</p>
            </Glass>
          )}
          {topHint === 'station' && (
            <Glass className="pointer-events-auto px-3.5 py-3 border-[#2EE6C7]/40">
              <p className="font-display text-sm font-bold tracking-wide text-[#2EE6C7]">SET REFILL STATION</p>
              <p className="text-xs text-[#9AABAA] mt-1 leading-snug">Tap where the mix tank sits{srcMode === 'gps' ? ', or use your current position.' : '.'}</p>
            </Glass>
          )}
        </div>

        {/* ---------- FLEXIBLE MIDDLE ZONE — telemetry tiles ----------
            flex-1 absorbs whatever vertical space is left between the top
            zone and everything pinned below, on ANY screen height. min-h-0 +
            overflow-y-auto means that on a genuinely cramped screen this
            column scrolls internally rather than ever pushing the bottom
            dock off-screen or sliding under it. */}
        <div className="flex-1 min-h-0 flex items-start justify-between gap-2 px-3 py-2 overflow-y-auto">
          {/* Spec §4C "Dim all numbers" while Auto-Paused out-of-bounds. */}
          <div className={'flex flex-col gap-2 pointer-events-none transition-opacity ' + (oob ? 'opacity-35' : 'opacity-100')}>
            {(phase === 'running' || phase === 'paused') && (
              <>
                <Tile icon={TimerIcon} label="Time" value={fmtTime(sim.elapsed)} />
                <Tile icon={Footprints} label="Distance" value={sim.distance.toFixed(0)} unit="m" />
                <PaceTile kmh={liveSpeedKmh} label={paceLabel} color={paceColor} flowLMin={flowLMin} />
              </>
            )}
          </div>
          <div className={'flex flex-col gap-2 items-end pointer-events-none transition-opacity ' + (oob ? 'opacity-35' : 'opacity-100')}>
            {(phase === 'running' || phase === 'paused') && (
              <>
                <TankTile level={tankLevel} pct={tankPct} color={tankColor} textClass={tankTextClass}
                  remainingRai={remainingRaiTank} onRefill={onTankTileRefill} low={tankLow} />
                <Tile icon={Crosshair} label="Coverage" value={coveragePct.toFixed(0)} unit="%" accent="text-[#34C76F]" />
                <Tile icon={Layers} label="Overlap" value={overlapRate.toFixed(0)} unit="%" accent={overlapRate > 15 ? 'text-[#FFB648]' : undefined} />
                {srcMode === 'gps' && gpsInfo && <Tile icon={Satellite} label="GPS" value={gpsInfo.lat.toFixed(4)} unit={gpsInfo.lng.toFixed(4)} accent={gpsColorClass} />}
              </>
            )}
            {/* Satellite toggle: available on every screen that shows the map
                (not just while plotting a boundary), so a field that already
                has a real-world anchor (a saved origin, or a GPS fix taken
                any time this session) shows its satellite basemap on the
                Ready screen exactly like it does while drawing the plot.
                Pan/zoom/lock sub-controls stay boundary-only — they're wired
                to the boundary-specific drag/pinch handlers — Ready and
                Running just show the auto-fit view, imagery included. */}
            {(phase === 'boundary' || phase === 'ready' || phase === 'running' || phase === 'paused') && (
              <div className="flex flex-col gap-2.5 pointer-events-auto">
                <MapCtrlBtn icon={Satellite} active={satelliteOn} onClick={() => setSatelliteOn((v) => !v)}
                  disabled={!unprojectRef.current} title={unprojectRef.current ? 'Toggle satellite imagery' : 'Switch to GPS mode once to set this field\'s map location'} />
                {phase === 'boundary' && satelliteOn && (
                  <>
                    <MapCtrlBtn icon={ZoomIn} onClick={() => zoomMap(1)} title="Zoom in" />
                    <MapCtrlBtn icon={ZoomOut} onClick={() => zoomMap(-1)} title="Zoom out" />
                    <MapCtrlBtn icon={LocateFixed} onClick={centerOnMyLocation} disabled={gpsStatus !== 'active'} title="Center on my location" />
                    <MapCtrlBtn icon={followMe ? Move : Compass} active={!followMe} onClick={() => setFollowMe((v) => !v)}
                      title={followMe ? 'Following — tap for Free Pan' : 'Free Pan — tap to Follow Me'} />
                    <MapCtrlBtn icon={Lock} active={maxZoomLock} onClick={toggleMaxZoomLock}
                      title={maxZoomLock ? `Locked at max zoom (z${MAX_MAP_ZOOM}) — tap to unlock` : `Lock at max zoom (z${MAX_MAP_ZOOM})`} />
                  </>
                )}
              </div>
            )}
          </div>
        </div>

        {/* ---------- GUIDANCE CARD — its own row, own space ----------
            A separate flex row from the area/legend row below means the two
            can never fight for the same vertical band the way two
            independently-guessed bottom offsets (104px vs 178px) used to. */}
        {phase === 'running' && guidanceCopy && (
          <div className="shrink-0 px-3 pb-2 flex justify-center">
            <div className="pointer-events-auto w-full max-w-[380px]">
              <Glass className={'overflow-hidden ' + (guidanceCopy.tone === 'cyan' ? 'border-[#2EE6C7]/40' : 'border-[#FFB648]/40')}>
                <div className="px-4 pt-3 pb-2.5 flex items-center gap-3">
                  <div className={'shrink-0 w-10 h-10 rounded-full flex items-center justify-center ' + (guidanceCopy.tone === 'cyan' ? 'bg-[#2EE6C7]/15' : 'bg-[#FFB648]/15')}>
                    <Navigation size={20} className={guidanceCopy.tone === 'cyan' ? 'text-[#2EE6C7]' : 'text-[#FFB648]'}
                      style={{ transform: `rotate(${opMode === 'toStation' ? bearingTo(sim.pos, stationRef.current) : bearingTo(sim.pos, sim.breakpoint || sim.pos)}deg)` }} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className={'font-display text-sm font-bold tracking-wide truncate ' + (guidanceCopy.tone === 'cyan' ? 'text-[#2EE6C7]' : 'text-[#FFB648]')}>{guidanceCopy.title}</p>
                    {guidanceCopy.sub && <p className="text-xs text-[#9AABAA] mt-0.5 truncate">{guidanceCopy.sub}</p>}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-px bg-[#2A363A]">
                  <div className="px-3.5 py-2 bg-[#131A1D] min-w-0">
                    <p className="text-[8.5px] tracking-[.12em] font-mono text-[#7C8C8C]">TO STATION</p>
                    <p className="font-mono tnum text-base font-bold text-[#2EE6C7] mt-0.5 truncate">{dStation.toFixed(1)} m</p>
                  </div>
                  <div className="px-3.5 py-2 bg-[#131A1D] min-w-0">
                    <p className="text-[8.5px] tracking-[.12em] font-mono text-[#7C8C8C]">TO BREAKPOINT</p>
                    <p className="font-mono tnum text-base font-bold text-[#FFB648] mt-0.5 truncate">{dBreakpoint != null ? dBreakpoint.toFixed(1) + ' m' : '—'}</p>
                  </div>
                </div>
                {opMode === 'refilling' && (
                  <button onClick={refillTank}
                    className="w-full min-h-[48px] flex items-center justify-center gap-1.5 text-sm font-display font-bold tracking-wide text-[#06231D] bg-[#2EE6C7] py-2.5">
                    <Droplet size={14} strokeWidth={2.5} /> REFILLED FULL TANK
                  </button>
                )}
              </Glass>
            </div>
          </div>
        )}

        {/* ---------- BOTTOM INFO ROW — area sprayed + legend ----------
            Its own row too: guaranteed above the dock, guaranteed below the
            guidance card, by document order rather than by coordinates. */}
        {(phase === 'running' || phase === 'paused') && (
          <div className="shrink-0 px-3 pb-2 flex items-end justify-between gap-2">
            <div className="pointer-events-auto min-w-0">
              <Glass className="px-3.5 py-2.5 max-w-[220px]">
                <p className="text-[9px] tracking-[.14em] uppercase font-mono text-[#7C8C8C] truncate">Area sprayed</p>
                <div className="flex items-baseline gap-1.5 mt-0.5 min-w-0">
                  <span className="font-mono tnum text-xl font-bold text-[#D3DEDC] leading-none shrink-0">{areaSprayed.toFixed(0)}</span>
                  <span className="text-[11px] text-[#7C8C8C] truncate">m² of {field.area.toFixed(0)}</span>
                </div>
                <p className="font-mono tnum text-[11px] text-[#34C76F] mt-1 truncate">{rai.rai}-{rai.ngan}-{rai.wa} rai <span className="text-[#7C8C8C]">· {litres.toFixed(1)} L</span></p>
              </Glass>
            </div>
            <div className="pointer-events-auto shrink-0">
              <Glass className="px-3 py-2.5 flex flex-col gap-1.5">
                {[['#3A464B', 'Unsprayed'], ['#34C76F', 'Sprayed'], ['#FFB648', 'Overlapped']].map(([c, l]) => (
                  <div key={l} className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-[2px] shrink-0" style={{ background: c }} />
                    <span className="text-[9.5px] text-[#9AABAA] whitespace-nowrap">{l}</span>
                  </div>
                ))}
              </Glass>
            </div>
          </div>
        )}

        {/* ---------- NAVIGATION-STYLE HUD — ETA bar (opt-in) ----------
            Google Maps' bottom card, restyled for coverage spraying: time
            + distance remaining on the current leg (route while spraying,
            straight-line while running to/from the station), and the clock
            time spraying would finish at this pace. Sits right above the
            dock, its own row so it never overlaps the Save & Pause/Finish
            buttons below it. */}
        {navHud && (running || phase === 'paused') && (
          <div className="shrink-0 pointer-events-auto px-3 pb-2">
            <div className="rounded-2xl bg-[#F4F7F6] text-[#0A0E10] px-4 pt-2 pb-3 shadow-[0_8px_24px_rgba(0,0,0,.35)]">
              <div className="w-9 h-1 rounded-full bg-[#C7D0CE] mx-auto mb-2" />
              <p className="text-center font-display text-2xl font-extrabold tracking-tight">{navEtaLabel}</p>
              <p className="text-center text-[12px] text-[#5C6C6C] mt-0.5 font-mono">{navDistLabel} · ETA {navArrivalLabel}</p>
            </div>
          </div>
        )}

        {/* ---------- BOTTOM DOCK — fixed safe-area strip, always last ----------
            Not flex-1, so it always renders at its natural height and is
            never squeezed or overlapped by anything above it. */}
        <div data-dock className="shrink-0 pointer-events-auto p-3" style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
          {phase === 'boundary' && (
            <Dock>
              <DockBtn icon={X} label="CANCEL" tone="ghost" onClick={cancelPlotting} disabled={srcMode === 'gps' && !fieldRef.current.gpsAnchored} />
              {srcMode === 'gps' && !satelliteOn && <DockBtn icon={LocateFixed} label="MARK CORNER" tone="teal" onClick={markCorner} disabled={gpsStatus !== 'active'} />}
              {satelliteOn && <DockBtn icon={Crosshair} label="ADD AT CROSSHAIR" tone="teal" onClick={addPointAtCrosshair} />}
              <DockBtn icon={Undo2} label="UNDO" tone="ghost" onClick={undoPoint} disabled={!draft.length} />
              <DockBtn icon={confirmCloseField ? AlertTriangle : CheckCircle2} label={confirmCloseField ? 'TAP TO CONFIRM' : 'CLOSE FIELD'} tone={confirmCloseField ? 'amber' : 'teal'} big disabled={draft.length < 3} onClick={closeBoundary} />
            </Dock>
          )}
          {phase === 'station' && (
            <Dock>
              <DockBtn icon={X} label="CANCEL" tone="ghost" onClick={cancelStationSetup} />
              {srcMode === 'gps' && <DockBtn icon={LocateFixed} label="MY LOCATION" tone="teal" onClick={useMyLocationForStation} disabled={gpsStatus !== 'active'} />}
              <DockBtn icon={CheckCircle2} label="CONFIRM STATION" tone="teal" big onClick={confirmStation} />
            </Dock>
          )}
          {phase === 'ready' && (
            <div className="flex flex-col gap-2">
              {/* Prominent Field Selector — the primary way to pick/switch fields from
                  the pre-mission setup screen, per the "extremely prominent, tap to
                  switch" requirement. Shows the active saved field, or invites picking
                  one, and always opens the same full library modal below. */}
              <button onClick={() => setShowFieldLibrary(true)}
                className="w-full text-left rounded-xl border border-[#2EE6C7]/40 bg-gradient-to-br from-[#12302B] to-[#0F2320] px-3.5 py-3 flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-[#2EE6C7]/15 border border-[#2EE6C7]/30 flex items-center justify-center shrink-0">
                  <MapPinned size={18} className="text-[#2EE6C7]" />
                </div>
                <div className="min-w-0 flex-1">
                  <p className="text-[9.5px] tracking-[.14em] uppercase font-mono text-[#2EE6C7]/80 font-bold">Field selector</p>
                  {activeFieldEntry ? (
                    <>
                      <p className="font-display text-[15px] font-bold text-[#EAF3F1] truncate">{activeFieldEntry.name}</p>
                      <p className="text-[10px] font-mono text-[#9AABAA] truncate">
                        {(() => { const r = toRai(activeFieldEntry.areaSqm != null ? activeFieldEntry.areaSqm : activeFieldEntry.areaRai * 1600); return `${r.rai}-${r.ngan}-${r.wa} rai`; })()}
                        {' · '}{activeFieldEntry.lastSprayedTs ? `sprayed ${fmtDate(activeFieldEntry.lastSprayedTs)}` : `created ${fmtDate(activeFieldEntry.ts)}`}
                      </p>
                    </>
                  ) : (
                    <>
                      <p className="font-display text-[15px] font-bold text-[#EAF3F1] truncate">
                        {fieldLibrary.length > 0 ? 'Tap to choose a saved field' : 'No saved fields yet'}
                      </p>
                      <p className="text-[10px] font-mono text-[#9AABAA] truncate">
                        {fieldLibrary.length > 0 ? `${fieldLibrary.length} field${fieldLibrary.length === 1 ? '' : 's'} in library` : 'Plot a field, then tap SAVE below'}
                      </p>
                    </>
                  )}
                </div>
                <ChevronDown size={16} className="text-[#2EE6C7]/70 -rotate-90 shrink-0" />
              </button>
              {/* Spray settings — collapsed into one summary row (was two always-
                  expanded panels: a Tank/Rate stepper block and a separate swath-
                  width row). Everything here is remembered device-to-device via
                  loadLastSettings/saveLastSettings, so a returning operator who
                  sprays the same setup every day never has to open this at all —
                  the values shown are already right, and START is one tap below. */}
              <button onClick={() => setShowSpraySettings(true)}
                className="w-full flex items-center justify-between gap-2 text-[10px] font-mono bg-[#131A1D]/92 border border-[#2A363A] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate text-[#9AABAA]">
                  <Fuel size={13} className="text-[#2EE6C7] shrink-0" />
                  <span className="truncate text-[#D3DEDC] font-bold">{tankCapacity}L tank · {rateLRai} L/rai · {swath.toFixed(1)}m swath</span>
                </span>
                <span className="text-[#2EE6C7] shrink-0 flex items-center gap-1 font-bold"><Pencil size={11} /> EDIT</span>
              </button>

              {/* Pre-flight checklist (Spec §4B) — strictly NON-BLOCKING:
                  START SPRAYING below is always enabled regardless of these.
                  Collapsed to one summary row by default (tap to expand) —
                  the full 4-toggle + 2-input panel was the single biggest
                  chunk of the Ready screen, most of the time already
                  checked from a prior session (4h memory) and not something
                  the operator needs staring at on every single launch. */}
              {(() => {
                const items = [
                  ['ppe', 'PPE worn'],
                  ['mixedRate', 'Mix rate confirmed'],
                  ['nozzle', 'Nozzle checked'],
                  ['wind', 'Wind checked'],
                ];
                const checkedCount = items.filter(([k]) => checklist[k]).length;
                const uncheckedCount = items.length - checkedCount;
                const wx = sprayWeather;
                const wxRisk = !!(wx && (wx.windWarning || wx.rainNowWarning || wx.rainSoonWarning));
                const applyWeatherReading = () => {
                  if (!wx) return;
                  const parts = [];
                  if (wx.windKmh != null) parts.push(`Wind ${Math.round(wx.windKmh)} km/h`);
                  if (wx.rainSoonProb != null) parts.push(`Rain ${Math.round(wx.rainSoonProb)}%`);
                  setChecklist((c) => {
                    const next = { ...c, wind: true, weather: parts.join(', ') };
                    saveChecklist(next);
                    return next;
                  });
                };
                return (
                  <div className="rounded-xl border border-[#2A363A] bg-[#131A1D]/92">
                    <button onClick={() => setChecklistExpanded((v) => !v)}
                      className="w-full flex items-center justify-between gap-2 px-3.5 py-3 min-h-[44px]">
                      <span className="flex items-center gap-2 min-w-0">
                        <span className="text-[9.5px] tracking-[.14em] uppercase font-mono text-[#5C6C6C] shrink-0">Pre-flight checklist</span>
                        <span className={'text-[10px] font-mono shrink-0 ' + (uncheckedCount > 0 ? 'text-[#7C8C8C]' : 'text-[#34C76F]')}>{checkedCount}/{items.length} checked</span>
                        {wxRisk && <AlertTriangle size={12} className="text-[#E6B22E] shrink-0" />}
                      </span>
                      <ChevronDown size={13} className={'text-[#7C8C8C] shrink-0 transition-transform ' + (checklistExpanded ? 'rotate-180' : '')} />
                    </button>
                    {checklistExpanded && (
                      <div className="px-3.5 pb-3.5">
                        <div className="grid grid-cols-2 gap-1.5">
                          {items.map(([k, label]) => (
                            <button key={k} onClick={() => toggleChecklistItem(k)}
                              className={'flex items-center gap-1.5 min-h-[40px] px-2.5 rounded-lg border text-[11px] font-mono text-left ' + (checklist[k] ? 'border-[#2EE6C7]/50 bg-[#2EE6C7]/10 text-[#2EE6C7]' : 'border-[#2A363A] text-[#7C8C8C]')}>
                              {checklist[k] ? <Check size={13} className="shrink-0" /> : <span className="w-[13px] h-[13px] rounded-[3px] border border-current shrink-0" />}
                              <span className="truncate">{label}</span>
                            </button>
                          ))}
                        </div>

                        {/* Live wind/rain (Open-Meteo) — a convenience layer on top of the
                            Wind-checked toggle above, never a gate on its own. Only shows
                            once the field has a real-world GPS anchor; SIM-only fields with
                            no anchor fall back to the manual toggle + text input exactly as
                            before. */}
                        {sprayWeatherStatus === 'loading' && (
                          <div className="mt-1.5 flex items-center gap-1.5 text-[10px] font-mono text-[#7C8C8C] px-0.5">
                            <Wind size={12} className="shrink-0 animate-pulse" /> Checking live wind/rain…
                          </div>
                        )}
                        {sprayWeatherStatus === 'error' && (
                          <div className="mt-1.5 flex items-center gap-1.5 text-[10px] font-mono text-[#5C6C6C] px-0.5">
                            <CloudRain size={12} className="shrink-0" /> Live wind/rain unavailable — check manually
                          </div>
                        )}
                        {sprayWeatherStatus === 'ok' && wx && (
                          <button onClick={applyWeatherReading}
                            className={'mt-1.5 w-full flex items-center gap-2 px-2.5 py-2 rounded-lg border text-left '
                              + (wxRisk ? 'border-[#E6B22E]/50 bg-[#E6B22E]/10' : 'border-[#2A363A] bg-[#0A0E10]')}>
                            <Wind size={14} className={'shrink-0 ' + (wx.windWarning ? 'text-[#E6B22E]' : 'text-[#9AABAA]')} />
                            <span className={'text-[11px] font-mono shrink-0 ' + (wx.windWarning ? 'text-[#E6B22E]' : 'text-[#D3DEDC]')}>
                              {wx.windKmh != null ? `${Math.round(wx.windKmh)} km/h` : '—'}
                              {wx.gustKmh != null && wx.gustKmh > (wx.windKmh || 0) + 5 ? ` (gust ${Math.round(wx.gustKmh)})` : ''}
                            </span>
                            <CloudRain size={14} className={'shrink-0 ' + ((wx.rainNowWarning || wx.rainSoonWarning) ? 'text-[#E6B22E]' : 'text-[#9AABAA]')} />
                            <span className={'text-[11px] font-mono flex-1 min-w-0 truncate ' + ((wx.rainNowWarning || wx.rainSoonWarning) ? 'text-[#E6B22E]' : 'text-[#D3DEDC]')}>
                              {wx.rainNowWarning ? 'Raining now' : (wx.rainSoonProb != null ? `${Math.round(wx.rainSoonProb)}% next 3h` : '—')}
                            </span>
                            <span className="text-[9px] font-mono text-[#5C6C6C] shrink-0">TAP TO USE</span>
                          </button>
                        )}

                        <div className="grid grid-cols-2 gap-1.5 mt-1.5">
                          <input value={checklist.operator} onChange={(e) => setChecklistField('operator', e.target.value)}
                            placeholder="Operator name" maxLength={40}
                            className="min-h-[36px] px-2.5 rounded-lg bg-[#0A0E10] border border-[#2A363A] text-[11px] font-mono text-[#D3DEDC] placeholder:text-[#5C6C6C]" />
                          <input value={checklist.weather} onChange={(e) => setChecklistField('weather', e.target.value)}
                            placeholder="Weather (e.g. calm, 28°C)" maxLength={40}
                            className="min-h-[36px] px-2.5 rounded-lg bg-[#0A0E10] border border-[#2A363A] text-[11px] font-mono text-[#D3DEDC] placeholder:text-[#5C6C6C]" />
                        </div>
                      </div>
                    )}
                  </div>
                );
              })()}

              {/* Primary action — its own row now, not sharing a Dock with the
                  setup buttons below, so it's the one unmissable thing to tap
                  once a field and settings are in place. START SPRAYING is
                  ALWAYS enabled — the checklist above never gates it. */}
              <Dock>
                <DockBtn icon={Play} label="START SPRAYING" tone="green" big onClick={() => setPhase('running')} />
              </Dock>

              {/* Field setup + Tools — each used to be a labelled section
                  with its own row(s) of always-visible buttons; both are
                  now one summary row that opens a small sheet, so the Ready
                  screen's default state shows far less at once. */}
              <button onClick={() => setShowFieldSetupMenu(true)}
                className="flex items-center justify-between gap-2 text-[10px] font-mono bg-[#131A1D]/92 border border-[#2A363A] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate">
                  <MapPinned size={13} className="text-[#2EE6C7] shrink-0" />
                  <span className="truncate text-[#9AABAA]">Field setup</span>
                </span>
                <span className="text-[#5C6C6C] shrink-0 text-[9.5px] font-mono">Plot · Station · Save</span>
              </button>
              <button onClick={() => setShowToolsMenu(true)}
                className="flex items-center justify-between gap-2 text-[10px] font-mono bg-[#131A1D]/92 border border-[#2A363A] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate">
                  <Layers size={13} className="text-[#2EE6C7] shrink-0" />
                  <span className="truncate text-[#9AABAA]">Tools</span>
                </span>
                <span className="text-[#5C6C6C] shrink-0 flex items-center gap-1.5 text-[9.5px] font-mono">
                  {cacheInfo && cacheInfo.tiles > 0 && <Wifi size={11} className="text-[#34C76F]" />}
                  {missions.length > 0 && <span>{missions.length} mission{missions.length === 1 ? '' : 's'}</span>}
                </span>
              </button>
            </div>
          )}
          {(phase === 'running' || phase === 'paused') && (
            <Dock>
              <DockBtn icon={Fuel} label="TANK EMPTY" tone="amber" onClick={tankEmpty} disabled={opMode !== 'spray' || !!manualPathRef.current} />
              <DockBtn icon={running ? Save : Play} label={running ? 'SAVE & PAUSE' : 'RESUME'} tone="teal"
                onClick={() => { if (running) saveSessionNow(); setPhase(running ? 'paused' : 'running'); }} />
              {/* Spec §4A Rule 3: End Mission must NOT be reachable from the
                  live running screen — only once the operator has already
                  paused, to prevent an accidental mid-spray termination. */}
              {phase === 'paused' && <DockBtn icon={Square} label="FINISH" tone="red" onClick={finishMission} />}
            </Dock>
          )}
        </div>
      </div>

      {phase === 'done' && (
        <div className="absolute inset-0 z-20 bg-[#0A0E10]/80 flex items-center justify-center p-4">
          <div className="w-full max-w-[380px] rounded-2xl bg-[#131A1D] border border-[#2A363A] overflow-hidden max-h-[92vh] overflow-y-auto">
            <div className="flex items-start justify-between px-4 pt-4 pb-2">
              <div>
                <p className="font-display text-[16px] font-bold tracking-wide">MISSION SUMMARY</p>
                <p className="text-[10.5px] text-[#7C8C8C]">Spray mission complete</p>
              </div>
              <button onClick={() => setPhase('paused')} className="text-[#7C8C8C] p-1"><X size={18} /></button>
            </div>
            <div className="px-4 pb-2">
              <div className="h-[160px] rounded-xl overflow-hidden bg-[#0A0E10] border border-[#2A363A]">
                <MiniMap field={field} sim={sim} gridCanvas={gridCanvasRef.current} station={stationRef.current} />
              </div>
            </div>
            <dl className="grid grid-cols-2 gap-px bg-[#2A363A] mt-2">
              {[
                ['ELAPSED', fmtTime(sim.elapsed), `pace ${speedMs.toFixed(2)} m/s`],
                ['DISTANCE', `${sim.distance.toFixed(0)} m`, `swath ${swath.toFixed(1)} m`],
                ['AREA SPRAYED', `${rai.rai}-${rai.ngan}-${rai.wa} rai`, `${raiDec.toFixed(2)} rai · ${areaSprayed.toFixed(0)} m²`],
                // Spec §4D "Metrics Rule": physical quantities, not bare percentages.
                ['OVERLAPPED', `${overlapRai.toFixed(2)} rai`, `≈ ${overlapWastedLitres.toFixed(1)} L wasted · ${overlapRate.toFixed(0)}%`],
                ['MISSED SPOTS', `${missedRai.toFixed(2)} rai`, missedCellsCount > 0 ? 'flagged red on the map — touch up below' : 'none flagged'],
                ['LIQUID USED', `${litres.toFixed(1)} L`, `${rateLRai} L/rai · ${tankCapacity}L tank`]
              ].map(([label, val, sub]) => (
                <div key={label} className="bg-[#131A1D] p-3">
                  <dt className="text-[9px] tracking-[.12em] font-mono text-[#7C8C8C]">{label}</dt>
                  <dd className="font-mono tnum text-[16px] font-bold mt-1 leading-snug">{val}</dd>
                  <p className="text-[9.5px] text-[#7C8C8C] mt-1">{sub}</p>
                </div>
              ))}
            </dl>
            <div className="p-3 flex flex-col gap-2.5">
              {missedCellsCount > 0 && (
                <DockBtn icon={Crosshair} label="TOUCH-UP MISSED SPOTS" tone="amber" big onClick={startTouchUp} />
              )}
              <div className="grid grid-cols-2 gap-2.5">
                <DockBtn icon={RotateCcw} label="START NEW" tone="ghost" onClick={() => resetSim(swath)} />
                <DockBtn icon={Save} label="SAVE SESSION" tone="teal" onClick={saveMission} />
              </div>
            </div>
          </div>
        </div>
      )}

      {showHistory && (() => {
        const selected = missions.find((m) => m.id === selectedMissionId) || null;
        const totalRai = missions.reduce((a, m) => a + m.raiDec, 0);
        const totalDist = missions.reduce((a, m) => a + m.distance, 0);
        return (
          <div className="absolute inset-0 z-20 bg-[#0A0E10] flex flex-col">
            <div className="shrink-0 flex items-center justify-between px-4 py-3.5 border-b border-[#2A363A]"
                 style={{ paddingTop: 'max(14px, env(safe-area-inset-top))' }}>
              <div className="flex items-center gap-2.5 min-w-0">
                {selected ? (
                  <button onClick={() => setSelectedMissionId(null)} className="text-[#2EE6C7] p-1 -ml-1"><ChevronLeft size={20} /></button>
                ) : <History size={17} className="text-[#2EE6C7]" />}
                <div className="min-w-0">
                  <p className="font-display text-[15px] font-bold tracking-wide truncate">{selected ? fmtDate(selected.ts) : 'MISSION HISTORY'}</p>
                  {!selected && <p className="text-[9.5px] text-[#7C8C8C] font-mono">Mission history · {missions.length} logged · {totalRai.toFixed(2)} rai all-time</p>}
                </div>
              </div>
              <button onClick={() => { setShowHistory(false); setSelectedMissionId(null); setConfirmClear(false); }} className="text-[#7C8C8C] p-1 shrink-0"><X size={20} /></button>
            </div>

            <div className="flex-1 overflow-y-auto px-4 py-3">
              {!selected && missions.length === 0 && (
                <div className="h-full flex flex-col items-center justify-center text-center gap-2 pb-16">
                  <History size={28} className="text-[#3A464B]" />
                  <p className="text-[12.5px] text-[#7C8C8C]">No missions saved yet.</p>
                  <p className="text-[10.5px] text-[#5C6C6C] max-w-[220px]">Finish a spraying run and tap Save Session to log it here.</p>
                </div>
              )}

              {!selected && missions.length > 0 && (
                <div className="flex flex-col gap-2.5">
                  {missions.map((m) => (
                    <button key={m.id} onClick={() => setSelectedMissionId(m.id)}
                      className="flex gap-3 items-stretch bg-[#131A1D] border border-[#2A363A] rounded-xl overflow-hidden text-left">
                      <div className="w-[104px] shrink-0 bg-[#0A0E10]">
                        {m.thumb ? <img src={m.thumb} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center"><MapPinned size={16} className="text-[#3A464B]" /></div>}
                      </div>
                      <div className="flex-1 min-w-0 py-2.5 pr-3 flex flex-col justify-between">
                        <div>
                          <p className="font-mono text-[10px] text-[#7C8C8C]">{fmtDate(m.ts)}</p>
                          <p className="font-mono tnum text-[15px] font-bold text-[#34C76F] mt-0.5">{m.rai}-{m.ngan}-{m.wa} rai</p>
                        </div>
                        <div className="flex items-center gap-3 text-[9.5px] font-mono text-[#9AABAA] mt-1">
                          <span>{m.distance.toFixed(0)} m</span>
                          <span>{fmtTime(m.elapsed)}</span>
                          <span className={m.overlapRate > 15 ? 'text-[#FFB648]' : ''}>{m.overlapRate.toFixed(0)}% overlap</span>
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {selected && (
                <div className="flex flex-col gap-3">
                  <div className="h-[190px] rounded-xl overflow-hidden bg-[#0A0E10] border border-[#2A363A]">
                    {selected.thumb ? <img src={selected.thumb} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-[#3A464B] text-[11px]">No coverage image saved</div>}
                  </div>
                  <dl className="grid grid-cols-2 gap-px bg-[#2A363A] rounded-xl overflow-hidden">
                    {[
                      ['ELAPSED', fmtTime(selected.elapsed), `field ${selected.fieldRai.toFixed(2)} rai`],
                      ['DISTANCE', `${selected.distance.toFixed(0)} m`, `swath ${selected.swath.toFixed(1)} m`],
                      ['AREA SPRAYED', `${selected.rai}-${selected.ngan}-${selected.wa} rai`, `${selected.raiDec.toFixed(2)} rai · ${selected.areaSprayed.toFixed(0)} m²`],
                      ['OVERLAPPED', `${(selected.overlapRai ?? 0).toFixed(2)} rai`, `≈ ${(selected.overlapWastedLitres ?? 0).toFixed(1)} L wasted`],
                      ['MISSED SPOTS', `${(selected.missedRai ?? 0).toFixed(2)} rai`, `${selected.litres.toFixed(1)} L used total`]
                    ].map(([label, val, sub]) => (
                      <div key={label} className="bg-[#131A1D] p-3">
                        <dt className="text-[9px] tracking-[.12em] font-mono text-[#7C8C8C]">{label}</dt>
                        <dd className="font-mono tnum text-[16px] font-bold mt-1 leading-snug">{val}</dd>
                        <p className="text-[9.5px] text-[#7C8C8C] mt-1">{sub}</p>
                      </div>
                    ))}
                  </dl>
                  {/* Compliance log (Spec §5: PPE, user, weather). Older
                      history entries saved before this existed simply have
                      no checklist object, so the section is skipped rather
                      than showing false "unchecked" state. */}
                  {selected.checklist && (
                    <div className="rounded-xl border border-[#2A363A] bg-[#131A1D] p-3">
                      <p className="text-[9px] tracking-[.12em] font-mono text-[#7C8C8C] mb-2">COMPLIANCE LOG</p>
                      <div className="flex flex-wrap gap-1.5 mb-2">
                        {[['ppe', 'PPE'], ['mixedRate', 'Mix rate'], ['nozzle', 'Nozzle'], ['wind', 'Wind']].map(([k, label]) => (
                          <span key={k} className={'text-[10px] font-mono px-2 py-1 rounded-full border ' + (selected.checklist[k] ? 'border-[#2EE6C7]/50 text-[#2EE6C7]' : 'border-[#2A363A] text-[#5C6C6C]')}>
                            {selected.checklist[k] ? '✓ ' : '— '}{label}
                          </span>
                        ))}
                      </div>
                      <p className="text-[10.5px] font-mono text-[#9AABAA]">
                        Operator: {selected.operator ? selected.operator : '—'} · Weather: {selected.weather ? selected.weather : '—'}
                      </p>
                      {selected.weatherApi && (
                        <p className="text-[10.5px] font-mono text-[#5C6C6C] mt-1">
                          Live reading: {selected.weatherApi.windKmh != null ? `${Math.round(selected.weatherApi.windKmh)} km/h wind` : 'wind —'}
                          {selected.weatherApi.rainSoonProb != null ? `, ${Math.round(selected.weatherApi.rainSoonProb)}% rain (3h)` : ''}
                          {' '}(Open-Meteo)
                        </p>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>

            {!selected && missions.length > 0 && (
              <div className="shrink-0 p-3 border-t border-[#2A363A] flex flex-col gap-2" style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
                <p className="text-center text-[9.5px] font-mono text-[#5C6C6C]">{totalDist.toFixed(0)} m walked all-time</p>
                <div className="grid grid-cols-2 gap-2.5">
                  <DockBtn icon={Download} label="EXPORT CSV" tone="ghost" onClick={exportHistoryCSV} />
                  <DockBtn icon={Trash2} label={confirmClear ? 'TAP TO CONFIRM' : 'CLEAR HISTORY'} tone={confirmClear ? 'red' : 'dim'} onClick={clearHistory} />
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {/* Field Selector Modal — the Field Library, a full-screen list of
          named saved boundaries+stations, distinct from Mission History. */}
      {showFieldLibrary && (
        <div className="absolute inset-0 z-20 bg-[#0A0E10] flex flex-col">
          <div className="shrink-0 flex items-center justify-between px-4 py-3.5 border-b border-[#2A363A]"
               style={{ paddingTop: 'max(14px, env(safe-area-inset-top))' }}>
            <div className="flex items-center gap-2.5 min-w-0">
              <MapPinned size={17} className="text-[#2EE6C7] shrink-0" />
              <div className="min-w-0">
                <p className="font-display text-[15px] font-bold tracking-wide truncate">FIELD LIBRARY</p>
                <p className="text-[9.5px] text-[#7C8C8C] font-mono">Saved field library · {fieldLibrary.length} saved</p>
              </div>
            </div>
            <button onClick={() => { setShowFieldLibrary(false); setConfirmDeleteFieldId(null); }} className="text-[#7C8C8C] p-1 shrink-0"><X size={20} /></button>
          </div>
          <div className="flex-1 overflow-y-auto px-4 py-3">
            {fieldLibrary.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center gap-2 text-center px-6">
                <MapPinned size={28} className="text-[#3A464B]" />
                <p className="text-sm text-[#9AABAA]">No fields saved yet</p>
                <p className="text-xs text-[#5C6C6C]">Plot or load a field, then tap SAVE from the ready screen to keep it here.</p>
              </div>
            ) : (
              <div className="flex flex-col gap-2">
                {fieldLibrary.map((f) => {
                  const r = toRai(f.areaSqm != null ? f.areaSqm : f.areaRai * 1600);
                  const isActive = f.id === activeFieldId;
                  const isRenaming = renamingFieldId === f.id;
                  return (
                    <div key={f.id} className={'rounded-xl bg-[#131A1D] border p-3 flex flex-col gap-2 ' + (isActive ? 'border-[#2EE6C7]' : 'border-[#2A363A]')}>
                      <div className="flex items-center gap-2.5">
                        {isRenaming ? (
                          <div className="flex-1 min-w-0 flex items-center gap-1.5">
                            <input autoFocus value={renameDraft} onChange={(e) => setRenameDraft(e.target.value)}
                              onKeyDown={(e) => { if (e.key === 'Enter') renameFieldInLibrary(f.id, renameDraft); if (e.key === 'Escape') setRenamingFieldId(null); }}
                              className="flex-1 min-w-0 min-h-[38px] px-2.5 rounded-lg bg-[#0A0E10] border border-[#2EE6C7] text-[#D3DEDC] text-sm font-sans outline-none" />
                            <button onClick={() => renameFieldInLibrary(f.id, renameDraft)} className="shrink-0 min-h-[38px] px-2.5 rounded-lg bg-[#2EE6C7] text-[#06231D] flex items-center justify-center"><Check size={15} /></button>
                          </div>
                        ) : (
                          <button onClick={() => { loadFieldFromLibrary(f); setShowFieldLibrary(false); }} className="flex-1 min-w-0 text-left">
                            <span className="flex items-center gap-1.5">
                              {isActive && <Star size={11} className="text-[#2EE6C7] fill-[#2EE6C7] shrink-0" />}
                              <p className="font-display text-sm font-bold truncate">{f.name}</p>
                            </span>
                            <p className="text-[10px] font-mono text-[#7C8C8C] mt-0.5 truncate">
                              {r.rai}-{r.ngan}-{r.wa} rai · {f.lastSprayedTs ? `sprayed ${fmtDate(f.lastSprayedTs)}` : `created ${fmtDate(f.ts)}`}{f.gpsAnchored ? ' · GPS-anchored' : ''}
                            </p>
                          </button>
                        )}
                        {!isRenaming && (
                          <button onClick={() => { setRenamingFieldId(f.id); setRenameDraft(f.name); }}
                            className="shrink-0 min-h-[38px] px-2.5 rounded-lg flex items-center justify-center text-[#7C8C8C]">
                            <Pencil size={14} />
                          </button>
                        )}
                        <button onClick={() => (confirmDeleteFieldId === f.id ? deleteFieldFromLibrary(f.id) : setConfirmDeleteFieldId(f.id))}
                          className={'shrink-0 min-h-[38px] px-2.5 rounded-lg flex items-center justify-center ' + (confirmDeleteFieldId === f.id ? 'bg-[#FF5252] text-[#2B0808]' : 'text-[#7C8C8C]')}>
                          {confirmDeleteFieldId === f.id ? <span className="text-[9px] font-mono font-bold px-0.5">CONFIRM</span> : <Trash2 size={15} />}
                        </button>
                      </div>
                      {!isRenaming && (
                        <button onClick={() => { loadFieldFromLibrary(f); setShowFieldLibrary(false); }}
                          disabled={isActive}
                          className={'min-h-[36px] rounded-lg text-[9.5px] font-mono font-bold tracking-wide flex items-center justify-center gap-1.5 ' + (isActive ? 'bg-[#2EE6C7]/15 text-[#2EE6C7] border border-[#2EE6C7]/30' : 'bg-[#0A0E10] text-[#D3DEDC] border border-[#3A464B]')}>
                          {isActive ? <><Star size={11} className="fill-[#2EE6C7]" /> ACTIVE FIELD</> : 'SET AS ACTIVE FIELD'}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}

      {/* Save-current-field prompt — names the field before it lands in the library above. */}
      {showSaveField && (
        <div className="absolute inset-0 z-30 bg-[#0A0E10]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[340px] rounded-2xl bg-[#131A1D] border border-[#2A363A] p-4">
            <p className="font-display text-[15px] font-bold tracking-wide">SAVE FIELD TO LIBRARY</p>
            <p className="text-[10.5px] text-[#7C8C8C] mt-0.5 mb-3">Save this field to reuse it next time · {(fieldRef.current.area / 1600).toFixed(2)} rai</p>
            <input autoFocus value={saveFieldName} onChange={(e) => setSaveFieldName(e.target.value)}
              placeholder="e.g. Soybean Field 1"
              className="w-full min-h-[46px] px-3 rounded-lg bg-[#0A0E10] border border-[#3A464B] text-[#D3DEDC] text-sm font-sans placeholder:text-[#5C6C6C] outline-none focus:border-[#2EE6C7]" />
            <div className="grid grid-cols-2 gap-2.5 mt-4">
              <DockBtn icon={X} label="CANCEL" tone="ghost" onClick={() => setShowSaveField(false)} />
              <DockBtn icon={Save} label="SAVE" tone="teal" disabled={!saveFieldName.trim()}
                onClick={() => { saveCurrentFieldToLibrary(saveFieldName); setShowSaveField(false); }} />
            </div>
          </div>
        </div>
      )}

      {/* Spray Settings sheet — everything the compact summary row on the
          ready screen used to show fully expanded (Tank/Rate steppers +
          swath picker), now tucked behind one tap since most visits need
          zero changes here (see loadLastSettings/saveLastSettings). */}
      {showSpraySettings && (
        <div className="absolute inset-0 z-30 bg-[#0A0E10]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[340px] rounded-2xl bg-[#131A1D] border border-[#2A363A] p-4">
            <div className="flex items-center justify-between">
              <p className="font-display text-[15px] font-bold tracking-wide">SPRAY SETTINGS</p>
              <button onClick={() => setShowSpraySettings(false)} className="text-[#7C8C8C] p-1"><X size={18} /></button>
            </div>
            <p className="text-[10.5px] text-[#7C8C8C] mt-0.5 mb-3">Tank size, application rate, and nozzle width · remembered for next time</p>
            <Glass className="px-2 py-2 flex flex-col gap-1">
              <Stepper label="Tank" value={tankCapacity} unit="L" step={1} min={1} max={60} onChange={setTankCapacity} />
              <Stepper label="Rate" value={rateLRai} unit=" L/rai" step={1} min={1} max={100} onChange={setRateLRai} />
              <Stepper label="Width" value={swath} unit="m" dec={1} step={0.1} min={0.5} max={10} onChange={(w) => { setSwath(w); resetSim(w); }} />
            </Glass>
            <div className="flex items-center justify-between px-1 mt-3 pt-3 border-t border-[#2A363A]">
              <div className="min-w-0 pr-2">
                <span className="text-[10px] tracking-[.12em] uppercase font-mono text-[#7C8C8C]">Navigation-style HUD</span>
                <p className="text-[9.5px] text-[#5C6C6C] mt-0.5 leading-snug">Google Maps–style direction banner + ETA bar while spraying</p>
              </div>
              <Switch on={navHud} onChange={setNavHud} label="" />
            </div>
            <div className="mt-4 flex justify-center">
              <div className="w-full max-w-[260px] flex"><DockBtn icon={CheckCircle2} label="DONE" tone="teal" onClick={() => setShowSpraySettings(false)} /></div>
            </div>
          </div>
        </div>
      )}

      {/* Field Setup menu — Plot/Edit, Station, Save consolidated out of the
          Ready screen's default view into one sheet (see the summary row
          above); same three actions, same handlers, just tucked away. */}
      {showFieldSetupMenu && (
        <div className="absolute inset-0 z-30 bg-[#0A0E10]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[340px] rounded-2xl bg-[#131A1D] border border-[#2A363A] p-4">
            <div className="flex items-center justify-between">
              <p className="font-display text-[15px] font-bold tracking-wide">FIELD SETUP</p>
              <button onClick={() => setShowFieldSetupMenu(false)} className="text-[#7C8C8C] p-1"><X size={18} /></button>
            </div>
            <div className="mt-3 flex flex-col gap-2">
              <Dock>
                <DockBtn icon={MapPinned} label="PLOT / EDIT" tone="ghost" onClick={() => { setShowFieldSetupMenu(false); startPlotting(); }} />
                <DockBtn icon={Droplet} label="STATION" tone="ghost" onClick={() => { setShowFieldSetupMenu(false); startStationSetup(); }} />
              </Dock>
              <Dock>
                <DockBtn icon={Save} label={activeFieldEntry ? 'SAVE NEW' : 'SAVE'} tone="ghost" big
                  onClick={() => { setShowFieldSetupMenu(false); setSaveFieldName(activeFieldEntry ? activeFieldEntry.name : ''); setShowSaveField(true); }} />
              </Dock>
            </div>
          </div>
        </div>
      )}

      {/* Tools menu — Offline Map / Mission History / Resume Saved Session
          consolidated the same way. Each row keeps its own live status text
          exactly as it showed on the Ready screen before. */}
      {showToolsMenu && (
        <div className="absolute inset-0 z-30 bg-[#0A0E10]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[340px] rounded-2xl bg-[#131A1D] border border-[#2A363A] p-4">
            <div className="flex items-center justify-between">
              <p className="font-display text-[15px] font-bold tracking-wide">TOOLS</p>
              <button onClick={() => setShowToolsMenu(false)} className="text-[#7C8C8C] p-1"><X size={18} /></button>
            </div>
            <div className="mt-3 flex flex-col gap-2">
              <button onClick={() => { setShowToolsMenu(false); setShowOfflineMap(true); refreshCacheInfo(); }}
                className="flex items-center justify-between gap-2 text-[10px] font-mono text-[#9AABAA] bg-[#0A0E10] border border-[#2A363A] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate">
                  {cacheInfo && cacheInfo.tiles > 0 ? <Wifi size={13} className="text-[#34C76F] shrink-0" /> : <CloudOff size={13} className="text-[#7C8C8C] shrink-0" />}
                  <span className="truncate">{cacheInfo && cacheInfo.tiles > 0 ? `Offline map ready · ${fmtBytes(cacheInfo.bytes)}` : 'Offline map — not downloaded'}</span>
                </span>
              </button>
              <button onClick={() => { setShowToolsMenu(false); setShowHistory(true); }}
                className="flex items-center justify-between gap-2 text-[10px] font-mono text-[#9AABAA] bg-[#0A0E10] border border-[#2A363A] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate"><History size={13} className="text-[#2EE6C7] shrink-0" />
                  <span className="truncate">{missions.length > 0 ? `${missions.length} mission${missions.length === 1 ? '' : 's'} logged` : 'No missions logged yet'}</span>
                </span>
                {missions.length > 0 && <span className="text-[#34C76F] shrink-0">{missions.reduce((a, m) => a + m.raiDec, 0).toFixed(2)} rai total →</span>}
              </button>
              <button onClick={tryResumeSession}
                className="flex items-center justify-between gap-2 text-[10px] font-mono bg-[#0A0E10] border border-[#2A363A] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate">
                  <RotateCcw size={13} className={(noSavedSessionFlash ? 'text-[#7C8C8C]' : 'text-[#FFB648]') + ' shrink-0'} />
                  <span className={'truncate ' + (noSavedSessionFlash ? 'text-[#7C8C8C]' : 'text-[#9AABAA]')}>
                    {noSavedSessionFlash ? 'No saved session found' : 'Resume saved session'}
                  </span>
                </span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Offline Map Control Bar — pre-fetch the active field's satellite
          tiles (current zoom + the 17–20 native-resolution band) into Cache
          Storage while there's still signal, so the map still renders with
          none. Whatever the deepest zoom that actually came back with real
          imagery (not Esri's "no data" placeholder — see
          ESRI_PLACEHOLDER_MAX_BYTES) becomes this field's zoomCeilingRef the
          moment the live map notices; on-screen zoom past that ceiling is
          pure digital stretch of the deepest real tile, same as online. */}
      {showOfflineMap && (
        <div className="absolute inset-0 z-30 bg-[#0A0E10]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[360px] rounded-2xl bg-[#131A1D] border border-[#2A363A] p-4">
            <div className="flex items-center justify-between">
              <p className="font-display text-[15px] font-bold tracking-wide">OFFLINE MAP</p>
              <button onClick={() => setShowOfflineMap(false)} className="text-[#7C8C8C] p-1 -mr-1"><X size={18} /></button>
            </div>
            <p className="text-[10.5px] text-[#7C8C8C] mt-0.5 mb-3">Download satellite maps for offline use · for the active field, before you lose signal</p>

            {!('caches' in window) ? (
              <p className="text-xs text-[#FFB648] leading-relaxed">This browser doesn't support offline map storage — satellite imagery will need a live connection every time.</p>
            ) : !unprojectRef.current ? (
              <p className="text-xs text-[#7C8C8C] leading-relaxed">Get a GPS fix at least once (switch to GPS mode) so the field's real-world location is known, then come back here to download.</p>
            ) : (
              <>
                <div className="rounded-xl bg-[#0A0E10] border border-[#2A363A] p-3 flex items-center gap-3">
                  {cacheInfo && cacheInfo.tiles > 0 ? <Wifi size={20} className="text-[#34C76F] shrink-0" /> : <CloudOff size={20} className="text-[#7C8C8C] shrink-0" />}
                  <div className="min-w-0">
                    <p className="text-sm font-bold truncate">{cacheInfo && cacheInfo.tiles > 0 ? 'Offline Map Ready' : 'No offline tiles cached yet'}</p>
                    <p className="text-[10px] font-mono text-[#7C8C8C] mt-0.5">{cacheInfo ? `${cacheInfo.tiles} tiles · ${fmtBytes(cacheInfo.bytes)}` : '—'}</p>
                  </div>
                </div>

                {downloadState ? (
                  downloadState.error ? (
                    <p className="text-xs text-[#FF5252] mt-3">{downloadState.error}</p>
                  ) : (
                    <div className="mt-3">
                      <div className="flex items-center justify-between text-[10px] font-mono text-[#9AABAA]">
                        <span>Downloading tiles…</span>
                        <span>{downloadState.done} / {downloadState.total}</span>
                      </div>
                      <div className="mt-1.5 h-1.5 w-full rounded-full bg-[#0A0E10] overflow-hidden">
                        <div className="h-full rounded-full bg-[#2EE6C7] transition-[width] duration-200"
                          style={{ width: (downloadState.total ? (downloadState.done / downloadState.total) * 100 : 0) + '%' }} />
                      </div>
                      <DockBtn icon={X} label="CANCEL DOWNLOAD" tone="ghost" onClick={cancelDownload} />
                    </div>
                  )
                ) : (
                  <div className="grid grid-cols-1 gap-2.5 mt-3">
                    <DockBtn icon={Download} label="DOWNLOAD FIELD MAP FOR OFFLINE USE" tone="teal" onClick={downloadFieldMapOffline} />
                    {cacheInfo && cacheInfo.tiles > 0 && (
                      <DockBtn icon={Trash2} label="CLEAR OFFLINE CACHE" tone="ghost" onClick={clearMapCache} />
                    )}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      )}

      {/* "Unfinished Mission Detected" — checked once at startup, before
          anything else is touched. Sits above every other overlay (z-40). */}
      {pendingResume && (
        <div className="absolute inset-0 z-40 bg-[#0A0E10]/92 flex items-center justify-center p-4">
          <div className="w-full max-w-[380px] rounded-2xl bg-[#131A1D] border border-[#2A363A] overflow-hidden">
            <div className="px-5 pt-5 pb-3 flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-[#FFB648]/15 flex items-center justify-center shrink-0">
                <History size={20} className="text-[#FFB648]" />
              </div>
              <div className="min-w-0">
                <p className="font-display text-[15px] font-bold tracking-wide leading-tight">UNFINISHED MISSION DETECTED</p>
                <p className="text-[10.5px] text-[#7C8C8C] mt-0.5">Unfinished mission found · saved {fmtDate(pendingResume.ts)}</p>
              </div>
            </div>
            <dl className="grid grid-cols-2 gap-px bg-[#2A363A] mt-1">
              <div className="bg-[#131A1D] p-3">
                <dt className="text-[9px] tracking-[.12em] font-mono text-[#7C8C8C]">AREA COMPLETED</dt>
                <dd className="font-mono tnum text-[18px] font-bold mt-1">{pendingResume.areaPct.toFixed(0)}%</dd>
              </div>
              <div className="bg-[#131A1D] p-3">
                <dt className="text-[9px] tracking-[.12em] font-mono text-[#7C8C8C]">TANK REMAINING</dt>
                <dd className="font-mono tnum text-[18px] font-bold mt-1">{pendingResume.tankLevel.toFixed(1)} L</dd>
              </div>
            </dl>
            <div className="p-4 flex flex-col gap-2.5">
              <DockBtn icon={Play} label="RESUME SPRAYING" tone="green" big
                onClick={() => { const raw = pendingResume.raw; setPendingResume(null); applySessionSnapshot(raw); }} />
              <DockBtn icon={Trash2} label="DISCARD & START NEW FIELD" tone="ghost"
                onClick={() => { clearActiveSession(); setPendingResume(null); }} />
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function MiniMap({ field, sim, gridCanvas, station }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const r = c.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = r.width * dpr; c.height = r.height * dpr;
    const v = computeView(c.width, c.height, field.bbox, 4);
    drawScene(c.getContext('2d'), c.width, c.height, v, field, sim, gridCanvas, station, { static: true });
  }, [field, sim, gridCanvas, station]);
  return <canvas ref={ref} className="w-full h-full" />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
