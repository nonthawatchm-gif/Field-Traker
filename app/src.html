  // That first load needs an internet connection; after the page (and its
  // library scripts) are cached by the browser, most mobile browsers will
  // reopen it from cache without a network connection. If a library fails
  // to load — no signal, first-time offline open, CDN unreachable — show a
  // plain, honest message instead of a blank screen.
  function agrasBootFail(lib) {
    var boot = document.getElementById('boot');
    if (!boot || boot.dataset.done) return;
    boot.classList.add('error');
    boot.innerHTML =
      '<div class="dot"></div>' +
      '<b>Couldn\'t load ' + lib + '</b>' +
      '<span style="max-width:280px;line-height:1.6">This app loads its libraries from the internet the first time it opens.<br/><br/>Connect to Wi‑Fi or mobile data once, then reopen this file. After that first successful load, most browsers will keep it cached for offline use.</span>';
  }
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.React || !window.ReactDOM || !window.Babel) agrasBootFail('required libraries');
    }, 8000);
  });
</script>

  const n = TILE_SIZE * Math.pow(2, z);

  const latRad = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;

/** Inverse of metersPerPixelAtZoom — the (fractional) slippy zoom whose
 *  native tile resolution best matches a given view scale (screen-px per
 *  field-metre) at a given latitude. This is what lets the tile-fetch zoom

    passes: new Uint8Array(field.GW * field.GH),
    missed: new Uint8Array(field.GW * field.GH),
    sprayedCells: 0, overlapCells: 0, epoch: 0,
    track: [{ ...route[0] }], fixes: [{ ...route[0] }],
    distance: 0, elapsed: 0, sampleAcc: 0, trackAcc: 0,
    done: route.length < 2, breakpoint: null
  };
}

function stamp(sim, field, a, b, r, passId, paint) {
  const { GW, GH, gbbox, credit, lastPass } = field.__ctx;
  const passes = sim.passes, missed = sim.missed;
  const minX = Math.min(a.x, b.x) - r, maxX = Math.max(a.x, b.x) + r;
  const minY = Math.min(a.y, b.y) - r, maxY = Math.max(a.y, b.y) + r;
  const i0 = Math.max(0, Math.floor((minX - gbbox.minX) / CELL));
  const i1 = Math.min(GW - 1, Math.ceil((maxX - gbbox.minX) / CELL));
  const j0 = Math.max(0, Math.floor((minY - gbbox.minY) / CELL));
  const j1 = Math.min(GH - 1, Math.ceil((maxY - gbbox.minY) / CELL));
  const vx = b.x - a.x, vy = b.y - a.y;
  const len2 = vx * vx + vy * vy || 1e-9;
  const r2 = r * r;
  for (let j = j0; j <= j1; j++) {
    const py = gbbox.minY + (j + 0.5) * CELL;
    for (let i = i0; i <= i1; i++) {
      const idx = j * GW + i;
      if (!credit[idx]) continue;
      const px = gbbox.minX + (i + 0.5) * CELL;
      let t = ((px - a.x) * vx + (py - a.y) * vy) / len2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = px - (a.x + t * vx), dy = py - (a.y + t * vy);
      if (dx * dx + dy * dy > r2) continue;
      const prev = lastPass[idx];
      missed[idx] = 0;
      if (prev === -1) { sim.sprayedCells++; lastPass[idx] = passId; passes[idx] = 1; paint(i, j, 1); }
      else if (prev !== passId) { sim.overlapCells++; lastPass[idx] = passId; passes[idx] = Math.min(255, passes[idx] + 1); paint(i, j, passes[idx]); }
    }
  }
}

/** Missed-spot detection (Spec §3C: "Red striped ONLY if the spray line has
 *  passed this cell and it was skipped"). Mirrors stamp()'s geometry exactly
 *  but never marks sprayedCells/overlapCells or lastPass — it only flags
 *  cells the swath's centerline crossed while un-armed (auto-paused/OOB) and
 *  that never got real spray credit. Respects the same insideRatio<0.5
 *  edge-case exemption as the rest of §3C, and a cell already actually
 *  sprayed (or already flagged) is left alone. */
function markMissed(sim, field, a, b, r, paint) {
  const { GW, GH, gbbox, credit, insideRatio, lastPass } = field.__ctx;
  const missed = sim.missed;
  const minX = Math.min(a.x, b.x) - r, maxX = Math.max(a.x, b.x) + r;
  const minY = Math.min(a.y, b.y) - r, maxY = Math.max(a.y, b.y) + r;
  const i0 = Math.max(0, Math.floor((minX - gbbox.minX) / CELL));
  const i1 = Math.min(GW - 1, Math.ceil((maxX - gbbox.minX) / CELL));
  const j0 = Math.max(0, Math.floor((minY - gbbox.minY) / CELL));
  const j1 = Math.min(GH - 1, Math.ceil((maxY - gbbox.minY) / CELL));
  const vx = b.x - a.x, vy = b.y - a.y;
  const len2 = vx * vx + vy * vy || 1e-9;
  const r2 = r * r;
  for (let j = j0; j <= j1; j++) {
    const py = gbbox.minY + (j + 0.5) * CELL;
    for (let i = i0; i <= i1; i++) {
      const idx = j * GW + i;
      if (!credit[idx] || insideRatio[idx] < 0.5) continue;
      if (lastPass[idx] !== -1 || missed[idx]) continue;
      const px = gbbox.minX + (i + 0.5) * CELL;
      let t = ((px - a.x) * vx + (py - a.y) * vy) / len2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = px - (a.x + t * vx), dy = py - (a.y + t * vy);
      if (dx * dx + dy * dy > r2) continue;
      missed[idx] = 1;
      paint(i, j, -1);
    }
  }
}

/** Sim-mode route-follower. `armed` is the live geofence + op-mode gate —
 *  false halts spraying instantly even mid-stride, but the crossed cells are
 *  still flagged as missed (Spec §3C) rather than silently skipped. */
function advance(sim, field, sdt, swath, paint, armed) {
  if (sim.done) return;
  let budget = WALK_SPEED * sdt * (1 + 0.08 * Math.sin(sim.elapsed * 0.7));
  let guard = 0;
  while (budget > 0 && !sim.done && guard++ < 128) {
    const target = sim.route[sim.wp];
    if (!target) { sim.done = true; break; }
    const d = dist(sim.pos, target);
    if (d < 1e-6) { sim.wp++; continue; }
    const step = Math.min(budget, d);
    const from = { ...sim.pos };
    sim.heading = Math.atan2(target.y - sim.pos.y, target.x - sim.pos.x);
    sim.pos = { x: sim.pos.x + (target.x - sim.pos.x) / d * step, y: sim.pos.y + (target.y - sim.pos.y) / d * step };
    if (target.spray) {
      if (armed) stamp(sim, field, from, sim.pos, swath / 2, target.passId, paint);
      else markMissed(sim, field, from, sim.pos, swath / 2, paint);
    }
    sim.trackAcc += step;
    if (sim.trackAcc >= 0.35) { sim.track.push({ ...sim.pos }); sim.trackAcc = 0; }
    budget -= step;
    if (step >= d - 1e-6) sim.wp++;
  }
  sim.sampleAcc += sdt;
  while (sim.sampleAcc >= 1) {
    sim.sampleAcc -= 1;
    const fix = { x: sim.pos.x + (Math.random() - 0.5) * 0.25, y: sim.pos.y + (Math.random() - 0.5) * 0.25 };
    sim.distance += dist(fix, sim.fixes[sim.fixes.length - 1]);
    sim.fixes.push(fix);
  }
  if (sim.done) sim.track.push({ ...sim.pos });
}

function playTone(freqs) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const now = ctx.currentTime;
    freqs.forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = f;
      const t0 = now + i * 0.18;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.16, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.16);
    });
    setTimeout(() => ctx.close(), 700);
  } catch (e) { /* audio unavailable — visual alert still fires */ }
}

/* ============================================================== *
 *  Map renderer                                                   *
 * ============================================================== */
/** Upload the persistent coverage raster to its on-screen canvas. Bug-fix
 *  note: this used to be called ONLY from the real-GPS branch of the main
 *  loop, so sim-mode spraying (and every mode besides "a new GPS fix just
 *  arrived") mutated the in-memory pixel buffer (`imgData`, which never
 *  clears except on an explicit Reset/Start New) but never blitted it to the
 *  visible canvas — coverage was computed correctly and then invisible, or
 *  visibly "lost" the moment something else redrew the frame. Fixed by
 *  flushing unconditionally, once per animation frame, from the main loop
 *  below — with a dirty-rect (chunked) upload so cost scales with how much
 *  new area was actually sprayed this frame, not with total field size. */
function flushGridDirty(gridCanvas, imgData, dirty) {
  if (!dirty) return;
  const x = dirty.minI, y = dirty.minJ;
  const w = dirty.maxI - dirty.minI + 1, h = dirty.maxJ - dirty.minJ + 1;
  gridCanvas.getContext('2d').putImageData(imgData, 0, 0, x, y, w, h);
}
/** Defensive full re-upload, run every couple of seconds regardless of dirty
 *  state — cheap relative to its cadence, and it self-heals the visible
 *  canvas from any silent pixel loss a mobile browser's memory pressure
 *  might otherwise cause (backgrounding, tab discard) without the operator
 *  having to notice or do anything about it. */
function flushGridFull(gridCanvas, imgData) { gridCanvas.getContext('2d').putImageData(imgData, 0, 0); }

/** Draws real Esri World Imagery tiles under everything else, positioned by
 *  converting the field's local-metre coordinate system to real lon/lat
 *  (via the field's GPS-anchor unprojector) and then to standard Web
 *  Mercator tile-pixel space. This is purely an additional background paint
 *  step — the coverage grid, geofence, and routing keep working in local
 *  metres exactly as before, so satellite imagery composites underneath
 *  them rather than requiring the whole engine to move into tile space.
 *  `sat.zoom` is an integer slippy zoom (tiles only exist at whole zooms);
 *  `k` below reconciles that with the view's continuous local-metre scale
 *  so imagery still lines up pixel-for-pixel with the coverage overlay. */
/** Offline-first tile fetch: check the persistent Cache Storage entry for
 *  this exact tile URL first (works with zero network — this is what makes
 *  a pre-downloaded field usable with no signal), and only hit the network
 *  on a cache miss, storing a copy for next time. Falls back to a plain
 *  network fetch when Cache Storage isn't available at all (older browsers,
 *  or a non-secure context) — same tile, just nothing persists across visits.
 *  Deliberately does NOT try to tell a real tile from Esri's "no data"
 *  placeholder here — an earlier version of this fix guessed that the
 *  placeholder must be a suspiciously small file and rejected anything
 *  under ~2KB, which was a guess this sandbox has no way to verify against
 *  the real service and evidently was wrong (nothing changed for the
 *  operator). Content-based detection replaces it below, in
 *  looksLikeNoDataTile — it inspects the DECODED image instead of betting
 *  on its file size. */
async function fetchTileBlob(url, cacheStore) {
  if (cacheStore) {
    try {
      const hit = await cacheStore.match(url);
      if (hit) return await hit.blob();
    } catch (e) { /* cache read failed — fall through to network */ }
  }
  const resp = await fetch(url, { mode: 'cors' });
  if (!resp.ok) throw new Error('tile HTTP ' + resp.status);
  const blob = await resp.blob();
  if (cacheStore) { try { await cacheStore.put(url, resp.clone()); } catch (e) { /* quota/private-mode — imagery still renders this session */ } }
  return blob;
}

/** THE actual cause of the literal "Map data not yet available" tiles the
 *  operator sees on screen: Esri's ArcGIS World_Imagery service does NOT
 *  404 a tile it has no imagery for — it returns a completely normal HTTP
 *  200 whose body is a placeholder PNG with that exact text baked into it.
 *  `resp.ok` is true, `fetch()` never throws, and the app has no way to
 *  know from the network layer alone that it just got a "sorry, nothing
 *  here" graphic instead of a photograph.
 *
 *  What DOES distinguish them reliably is the actual pixel content: real
 *  aerial/satellite imagery of farmland — crop rows, tree lines, bare soil,
 *  shadows — has substantial brightness variation across the tile. Esri's
 *  placeholder is a flat, nearly-uniform background with a little text on
 *  it; averaged down to a coarse grid, that text all but disappears and
 *  what's left reads as almost perfectly flat. This draws the DECODED
 *  image onto a tiny throwaway canvas, measures the standard deviation of
 *  pixel luminance across it, and treats a suspiciously flat result as "no
 *  data" — checked once, right when the browser finishes decoding the
 *  image, regardless of whether that image came from the network or an
 *  already-cached response, so a placeholder cached by an earlier version
 *  of this app gets caught and replaced exactly the same way a fresh one
 *  would be. (Accepted trade-off: a genuine tile that happens to be almost
 *  perfectly flat — still water with no reflections, say — could in
 *  principle also read this way; for farmland imagery that's a safe bet.) */
const NODATA_LUMINANCE_STDDEV_THRESHOLD = 8;
function looksLikeNoDataTile(img) {
  try {
    const S = 24; // coarse enough to blur thin placeholder text into the flat background it sits on
    const probe = document.createElement('canvas');
    probe.width = S; probe.height = S;
    const pctx = probe.getContext('2d', { willReadFrequently: true });
    pctx.drawImage(img, 0, 0, S, S);
    const data = pctx.getImageData(0, 0, S, S).data;
    let sum = 0, sumSq = 0;
    const n = S * S;
    for (let i = 0; i < data.length; i += 4) {
      const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      sum += lum; sumSq += lum * lum;
    }
    const mean = sum / n;
    const variance = Math.max(0, sumSq / n - mean * mean);
    return Math.sqrt(variance) < NODATA_LUMINANCE_STDDEV_THRESHOLD;
  } catch (e) {
    return false; // can't read pixels (tainted canvas, decode error) — assume it's a real tile rather than discard it
  }
}

/** Load one tile with a three-provider fallback chain: Esri first (fetched
 *  through Cache Storage, so it's the provider that actually persists
 *  offline), then Google Hybrid, then plain Google Satellite as a last
 *  resort — each tried only when the one before it errors, 404s, or turns
 *  out to be a "no data" placeholder (see looksLikeNoDataTile), since
 *  different providers' aerial mosaics have different native resolution at
 *  the same rural coordinate. Google's tile endpoint sends no CORS headers,
 *  so it can't be `fetch()`-and-cached the same way a `fetch()` there
 *  simply throws — but it CAN be drawn on a canvas as a plain cross-origin
 *  `<img>`, which is exactly what's needed to keep the map visually intact
 *  when Esri comes back empty. Those tiles just won't be available offline
 *  next time; only Esri tiles are. (Google's own placeholder, if it ever
 *  serves one, isn't pixel-checked — a cross-origin `<img>` without CORS
 *  headers taints the canvas the moment we try to read it back, so
 *  looksLikeNoDataTile can only ever run on the same-origin blob: URL the
 *  Esri path produces.) */
function loadTileEntry(entry, z, tx, ty, cacheStore) {
  const tryGoogleSat = () => {
    entry.img.onload = () => { entry.loaded = true; entry.provider = 'google-sat'; };
    entry.img.onerror = () => { entry.failed = true; };
    entry.img.src = googleTileUrl(z, tx, ty);
  };
  const tryGoogleHybrid = () => {
    entry.img.onload = () => { entry.loaded = true; entry.provider = 'google-hybrid'; };
    entry.img.onerror = tryGoogleSat;
    entry.img.src = googleHybridTileUrl(z, tx, ty);
  };
  fetchTileBlob(esriTileUrl(z, tx, ty), cacheStore).then((blob) => {
    const objUrl = URL.createObjectURL(blob);
    entry.objUrl = objUrl;
    entry.img.onload = () => {
      if (looksLikeNoDataTile(entry.img)) {
        URL.revokeObjectURL(objUrl);
        if (entry.objUrl === objUrl) entry.objUrl = null;
        tryGoogleHybrid();
        return;
      }
      entry.loaded = true; entry.provider = 'esri';
    };
    entry.img.onerror = tryGoogleHybrid;
    entry.img.src = objUrl;
  }).catch(tryGoogleHybrid);
}

/** Get-or-create the cache entry for one z/x/y tile and kick off its load
 *  if it's new — the network side of drawSatelliteTiles, split out for
 *  clarity. Once an entry is loaded or failed it never re-fetches; a
 *  "failed" entry just sits there confirming (to drawSatelliteTiles) that
 *  this exact tile doesn't exist on any provider, which is what lets the
 *  zoom-ceiling ratchet fire without repeating the same doomed request
 *  every frame. */
function ensureTileEntry(tileCache, z, tx, ty, cacheStore) {
  const key = `${z}/${tx}/${ty}`;
  let entry = tileCache.get(key);
  if (!entry) {
    if (tileCache.size > 420) { const oldest = tileCache.keys().next().value; tileCache.delete(oldest); }
    entry = { img: new Image(), loaded: false, failed: false, objUrl: null, provider: 'esri' };
    tileCache.set(key, entry);
    loadTileEntry(entry, z, tx, ty, cacheStore);
  }
  return entry;
}

function drawSatelliteTiles(ctx, w, h, v, sat) {
  const { unproject, tileCache, cacheStore, zoomCeilingRef, angle } = sat;
  const origin = unproject(0, 0);
  // Derive the DESIRED tile-fetch zoom straight from the CURRENT view scale
  // (v.s), every single frame — never from a separately-tracked counter.
  // This is the fix for "pinch-zoom in and it's still blurry": v.s changes
  // continuously under pinch, double-tap, +/- buttons and the max-zoom
  // lock alike, so deriving z directly from it means the network zoom
  // follows the ACTUAL on-screen scale exactly, no matter which gesture
  // drove it.
  //
  // zoomCeilingRef is the OTHER half of the picture: the deepest zoom this
  // field's area has actually been confirmed to have real imagery at. It
  // starts optimistic (MAX_NATIVE_ZOOM) and ratchets down, permanently for
  // this field, the first time every provider comes back empty for a tile
  // at the current ceiling — see the bottom of this function. Once that
  // happens, zooming in further NEVER asks the network for anything
  // deeper again: z stays pinned at the confirmed ceiling and the view's
  // continuous scale (v.s) just keeps growing past it, so the sharpest
  // real tile we have stretches to fill the extra screen space — i.e.
  // "zoom the picture, not the map" for anything beyond the last real
  // step, exactly like a photo viewer's digital zoom.
  const idealZoom = zoomForScale(v.s, origin.lat);
  const ceiling = zoomCeilingRef.current;
  const z = Math.max(MIN_MAP_ZOOM, Math.min(ceiling, Math.round(idealZoom)));
  const mpp = metersPerPixelAtZoom(origin.lat, z);
  const originWorld = lonLatToWorldPx(origin.lng, origin.lat, z);
  const k = v.s * mpp; // screen-px per tile-native-px at this zoom — grows past 1:1 once the view scale outpaces the confirmed ceiling (digital/stretch zoom)
  if (!(k > 0) || !isFinite(k)) return;
  const offsetX = v.ox - originWorld.x * k;
  const offsetY = v.oy - originWorld.y * k;
  const n = Math.pow(2, z);
  // Coverage rectangle to fetch/paint, in the same (pre-rotation) local
  // coordinate frame drawScene's caller has already rotated ctx into. Plain
  // [0,w]x[0,h] is only correct when the scene isn't rotated. When the
  // auto-rotate fit view IS active (angle != 0, ready/running/paused/done),
  // ctx has already been rotated by -angle about (v.ox, v.oy) before this
  // runs — so a tile rectangle sized to the raw, un-rotated canvas ends up
  // as a ROTATED rectangle on the actual physical screen, leaving the
  // corners outside it unpainted (the "half satellite, half black,
  // diagonal seam" artifact). Fix: cover the bounding box of the physical
  // canvas's four corners mapped INTO that local frame — pivot + R(angle)
  // applied to (corner - pivot), the inverse of the ctx.rotate(-angle) the
  // caller applied — instead of the raw 0..w / 0..h rectangle, so the tile
  // mosaic is drawn large enough to still fully cover the physical screen
  // once the ctx rotation is applied on top of it.
  let sx0 = 0, sx1 = w, sy0 = 0, sy1 = h;
  if (angle) {
    const cosA = Math.cos(angle), sinA = Math.sin(angle);
    sx0 = Infinity; sx1 = -Infinity; sy0 = Infinity; sy1 = -Infinity;
    [[0, 0], [w, 0], [0, h], [w, h]].forEach(([cx, cy]) => {
      const dx = cx - v.ox, dy = cy - v.oy;
      const rx = v.ox + dx * cosA - dy * sinA;
      const ry = v.oy + dx * sinA + dy * cosA;
      if (rx < sx0) sx0 = rx; if (rx > sx1) sx1 = rx;
      if (ry < sy0) sy0 = ry; if (ry > sy1) sy1 = ry;
    });
  }
  const wpx0 = (sx0 - offsetX) / k, wpx1 = (sx1 - offsetX) / k;
  const wpy0 = (sy0 - offsetY) / k, wpy1 = (sy1 - offsetY) / k;
  const tx0 = Math.max(0, Math.floor(Math.min(wpx0, wpx1) / TILE_SIZE) - 1);
  const tx1 = Math.min(n - 1, Math.floor(Math.max(wpx0, wpx1) / TILE_SIZE) + 1);
  const ty0 = Math.max(0, Math.floor(Math.min(wpy0, wpy1) / TILE_SIZE) - 1);
  const ty1 = Math.min(n - 1, Math.floor(Math.max(wpy0, wpy1) / TILE_SIZE) + 1);
  const size = TILE_SIZE * k;
  // Crisp-scaling requirement: bicubic-quality smoothing when we DO have to
  // stretch a tile (past the confirmed ceiling) looks meaningfully better
  // than the canvas default. Scoped with save/restore so it never leaks
  // into the coverage-grid draw elsewhere, which deliberately wants
  // imageSmoothingEnabled = false for crisp cells.
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  let sawConfirmedMissingAtCeiling = false;
  for (let ty = ty0; ty <= ty1; ty++) {
    for (let tx = tx0; tx <= tx1; tx++) {
      const entry = ensureTileEntry(tileCache, z, tx, ty, cacheStore);
      if (entry.loaded) {
        const sxScreen = offsetX + tx * TILE_SIZE * k, syScreen = offsetY + ty * TILE_SIZE * k;
        try { ctx.drawImage(entry.img, sxScreen, syScreen, size + 0.6, size + 0.6); }
        catch (e) { /* draw failure — leave tile blank this frame */ }
      } else if (entry.failed && z === ceiling) {
        // every provider came back empty for a tile AT the current ceiling —
        // that's confirmation this area doesn't go this deep; ratchet down
        // below, so the very next frame (same v.s) targets one zoom
        // shallower, which is almost always already cached from zooming
        // in through it a moment ago and self-heals instantly.
        sawConfirmedMissingAtCeiling = true;
      }
    }
  }
  ctx.restore();
  if (sawConfirmedMissingAtCeiling && ceiling > MIN_MAP_ZOOM) {
    zoomCeilingRef.current = ceiling - 1;
  }
}

function drawScene(ctx, w, h, v, field, sim, gridCanvas, station, opts = {}) {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0A0E10';
  ctx.fillRect(0, 0, w, h);

  // Screen-fit auto-rotation (computeFitView): rotate the whole drawn scene
  // about the view's own pivot (v.ox, v.oy) so a field plotted at any angle
  // still fills the screen instead of always sitting north-up. Every draw
  // call below keeps using the plain, un-rotated X_()/Y_() field coordinates
  // — this single transform is what makes them land correctly rotated.
  // v.angle is only ever set on the non-interactive auto-fit view (ready /
  // running / paused / done); boundary/station plotting views never carry
  // it, so this is a no-op there and tap-coordinate math stays untouched.
  const hasRotation = !!v.angle;
  if (hasRotation) {
    ctx.save();
    ctx.translate(v.ox, v.oy);
    ctx.rotate(-v.angle);
    ctx.translate(-v.ox, -v.oy);
  }

  if (opts.satellite) {
    drawSatelliteTiles(ctx, w, h, v, { ...opts.satellite, angle: v.angle });
  } else {
    const gb = opts.frame || field.bbox;
    const step = 5;
    for (let x = Math.floor((gb.minX - 4) / step) * step; x <= gb.maxX + 4; x += step) {
      ctx.strokeStyle = Math.round(x) % (step * 2) === 0 ? 'rgba(46,230,199,.09)' : 'rgba(46,230,199,.035)';
      ctx.beginPath(); ctx.moveTo(X_(v, x), 0); ctx.lineTo(X_(v, x), h); ctx.stroke();
    }
    for (let y = Math.floor((gb.minY - 4) / step) * step; y <= gb.maxY + 4; y += step) {
      ctx.strokeStyle = Math.round(y) % (step * 2) === 0 ? 'rgba(46,230,199,.09)' : 'rgba(46,230,199,.035)';
      ctx.beginPath(); ctx.moveTo(0, Y_(v, y)); ctx.lineTo(w, Y_(v, y)); ctx.stroke();
    }
  }

  if (opts.plotting) {
    const pts = opts.drafting;
    if (pts && pts.length) {
      ctx.strokeStyle = '#2EE6C7'; ctx.lineWidth = 1.75; ctx.setLineDash([6, 5]);
      ctx.beginPath();
      pts.forEach((p, i) => (i === 0 ? ctx.moveTo(X_(v, p.x), Y_(v, p.y)) : ctx.lineTo(X_(v, p.x), Y_(v, p.y))));
      if (pts.length > 2) ctx.lineTo(X_(v, pts[0].x), Y_(v, pts[0].y));
      ctx.stroke(); ctx.setLineDash([]);
      pts.forEach((p, i) => {
        ctx.fillStyle = i === 0 ? '#FFB648' : '#2EE6C7';
        ctx.beginPath(); ctx.arc(X_(v, p.x), Y_(v, p.y), i === 0 ? 5 : 4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#0A0E10'; ctx.lineWidth = 1.5; ctx.stroke();
      });
    }
    if (opts.live) {
      const lx = X_(v, opts.live.x), ly = Y_(v, opts.live.y);
      ctx.fillStyle = 'rgba(46,230,199,.18)'; ctx.beginPath(); ctx.arc(lx, ly, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2EE6C7'; ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2); ctx.fill();
    }
    return;
  }

  if (gridCanvas) {
    ctx.save(); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(gridCanvas, X_(v, field.gbbox.minX), Y_(v, field.gbbox.minY), field.GW * CELL * v.s, field.GH * CELL * v.s);
    ctx.restore();
  }
  ctx.save();
  ctx.strokeStyle = opts.oob ? 'rgba(255,82,82,.9)' : 'rgba(211,222,220,.8)';
  ctx.lineWidth = opts.oob ? 2.25 : 1.75;
  ctx.beginPath();
  field.poly.forEach((p, i) => (i === 0 ? ctx.moveTo(X_(v, p.x), Y_(v, p.y)) : ctx.lineTo(X_(v, p.x), Y_(v, p.y))));
  ctx.closePath(); ctx.stroke();
  ctx.restore();

  const f = sim.fixes;
  if (f.length > 1) {
    ctx.strokeStyle = 'rgba(211,222,220,.4)'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(X_(v, f[0].x), Y_(v, f[0].y));
    for (let i = 1; i < f.length; i++) ctx.lineTo(X_(v, f[i].x), Y_(v, f[i].y));
    ctx.stroke();
  }

  if (opts.navLine) {
    const { from, to, color } = opts.navLine;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = 1.75; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(X_(v, from.x), Y_(v, from.y)); ctx.lineTo(X_(v, to.x), Y_(v, to.y)); ctx.stroke();
    ctx.restore();
  }

  if (station && !opts.hideStation) {
    const sx = X_(v, station.x), sy = Y_(v, station.y);
    ctx.save();
    ctx.fillStyle = 'rgba(46,230,199,.16)'; ctx.beginPath(); ctx.arc(sx, sy, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2EE6C7'; ctx.beginPath(); ctx.arc(sx, sy, 7.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#06231D';
    ctx.beginPath(); ctx.moveTo(sx, sy - 4);
    ctx.quadraticCurveTo(sx - 3.4, sy + 1, sx, sy + 4.2);
    ctx.quadraticCurveTo(sx + 3.4, sy + 1, sx, sy - 4); ctx.fill();
    ctx.strokeStyle = '#0A0E10'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(sx, sy, 7.5, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  if (sim.breakpoint) {
    const bx = X_(v, sim.breakpoint.x), by = Y_(v, sim.breakpoint.y);
    ctx.save(); ctx.translate(bx, by - 9);
    ctx.fillStyle = '#FFB648';
    ctx.beginPath(); ctx.moveTo(0, 11); ctx.quadraticCurveTo(-7, 2, -7, -3); ctx.arc(0, -3, 7, Math.PI, 0);
    ctx.quadraticCurveTo(7, 2, 0, 11); ctx.fill();
    ctx.fillStyle = '#0A0E10'; ctx.beginPath(); ctx.arc(0, -3, 2.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  if (!opts.static) {
    const px = X_(v, sim.pos.x), py = Y_(v, sim.pos.y);
    const col = opts.oob ? '#FF5252' : '#2EE6C7';
    ctx.fillStyle = opts.oob ? 'rgba(255,82,82,.18)' : 'rgba(46,230,199,.14)';
    ctx.beginPath(); ctx.arc(px, py, (opts.oob ? 4 : 3) * v.s, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(px, py); ctx.rotate(sim.heading);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, 6.5); ctx.lineTo(-3, 0); ctx.lineTo(-6, -6.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#0A0E10'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, 2.6, 0, Math.PI * 2); ctx.stroke();
  }

  if (opts.accuracyRadius) {
    const px = X_(v, sim.pos.x), py = Y_(v, sim.pos.y);
    ctx.strokeStyle = 'rgba(46,230,199,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, opts.accuracyRadius * v.s, 0, Math.PI * 2); ctx.stroke();
  }

  if (hasRotation) ctx.restore();
}

  const devTapsRef = useRef({ n: 0, t: 0 });

  const secretDevTap = () => {
    const d = devTapsRef.current, now = Date.now();

      d.n = 0;
      const next = !devMode;

  const [swath, setSwath] = useState(() => { const s = loadLastSettings(); return s && s.swath ? s.swath : 2.5; });

  const [resumeFlash, setResumeFlash] = useState(false);
  const [missions, setMissions] = useState(() => loadHistory());
  const [showHistory, setShowHistory] = useState(false);
  const [selectedMissionId, setSelectedMissionId] = useState(null);

  const [showToolsMenu, setShowToolsMenu] = useState(false);           // Offline map / History / Resume — same consolidation

  const unprojectRef = useRef(null);       // paired with projectorRef — local metres -> real lat/lng
  const panRef = useRef(null);             // { x, y, s } local-metre view-centre + scale override while free-panning; null = auto-fit

  const zoomCeilingRef = useRef(MAX_NATIVE_ZOOM); // this field's confirmed deepest fetchable zoom — ratchets down in drawSatelliteTiles, reset to optimistic whenever the active field changes (see resetField/loadFieldFromLibrary)
  const mapCacheRef = useRef(null);        // the open Cache Storage object ('agras-map-tiles-v1') once available; null = unsupported
  const activePointersRef = useRef(new Map()); // pointerId -> {x,y} — live touch points, for two-finger pinch detection
  const pinchRef = useRef(null);           // { startDist, startS, centerField } — active two-finger pinch gesture
  const lastTapRef = useRef({ t: 0 });     // last single-tap time, for double-tap-to-zoom detection
  const downloadAbortRef = useRef(false);  // set true to cancel an in-flight "Download Field Map" prefetch
  const gpsExtraRef = useRef({ speed: null, heading: null, altitude: null }); // latest raw coords beyond lat/lng/accuracy
  const autosaveTimerRef = useRef(null);
  const speedEmaRef = useRef(0);           // smoothed live walking speed, m/s — feeds the Pace/Flow-Rate widget
  const prevPosForSpeedRef = useRef(null);
  const restoredRef = useRef(false);       // true once a resumed session has been applied — gates the startup check

  const phaseRef = useRef(phase); phaseRef.current = phase;
  const srcModeRef = useRef(srcMode); srcModeRef.current = srcMode;
  const multRef = useRef(mult); multRef.current = mult;
  const autoWalkRef = useRef(autoWalk); autoWalkRef.current = autoWalk;

  const opModeStateRef = useRef(opMode); opModeStateRef.current = opMode;

  /** Open (or create) the persistent offline tile store once. Cache Storage
   *  needs a secure context (https, or localhost) — it's simply absent on a
   *  plain http:// page or some file:// setups, so this is feature-detected
   *  everywhere it's used: satellite imagery always works online exactly as
   *  before, this only adds an offline fallback where the platform allows it. */
  useEffect(() => {
    if (!('caches' in window)) return;
    caches.open(MAP_TILE_CACHE_NAME).then((c) => { mapCacheRef.current = c; }).catch(() => {});
  }, []);

    const style = document.createElement('style');

      .font-display{font-family:'Archivo',ui-sans-serif,system-ui,sans-serif!important;}

  }, []);

   *  `state`: -1 = missed (red hatch, Spec §3C), 1 = optimal (light green),
   *  2+ = overlap (dark green/amber, opacity rising with the pass count —
   *  "Opacity increases with passes" per the spec's GridCell visual rule). */

      // resolution the rest of the raster paints at.
      const alt = (i + j) % 2 === 0;

   *  window; wind is deliberately left out of that stamp so it keeps
   *  resetting on every load, per spec. */
  const toggleChecklistItem = (key) => {
    setChecklist((c) => {

    setChecklist((c) => { const next = { ...c, [key]: value }; saveChecklist(next); return next; });
  };

   *  the Ready screen, and only once the field has a real-world anchor
   *  (originLatLngRef — set from a saved field, a resumed session, or a
   *  live GPS fix). SIM-mode fields with no GPS anchor simply show no live
   *  reading; the manual Wind-checked toggle still works exactly as before.

    // in the background, rather than waiting for a manual Offline Map tap.

  }, [initGrid]);

  const resetSim = useCallback((w) => {
    const field = fieldRef.current;

   *  name; load swaps fieldRef/stationRef to a saved entry and re-runs
   *  resetSim (station is set first — resetSim never touches stationRef). */
  const saveCurrentFieldToLibrary = (name) => {
    const trimmed = (name || '').trim();

  const touchFieldLastSprayed = (id) => {
    if (!id) return;

   *  summary (date, area %, tank litres) the pending-resume modal shows;
   *  the full snapshot is only ever applied once the operator explicitly

   *  to show brief "nothing to resume" feedback instead of doing nothing. */

  }, []);

   *  load it right away so the ready screen opens with a field, station,
   *  and this device's remembered tank/rate/swath already in place. Runs
   *  once, after the field library has loaded; if a pending-resume modal
   *  is about to show (checked above), this still runs harmlessly
   *  underneath it — Resume, if tapped, overwrites this with the saved
   *  session's own field anyway. */
  useEffect(() => {
    const last = loadLastSettings();
    if (!last || !last.activeFieldId) return;

    if (entry) loadFieldFromLibrary(entry);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /** The other end of the remember-my-settings loop above: persist tank

   *  change, so the NEXT app open (the effect above) has something to
   *  restore. */
  useEffect(() => {
    saveLastSettings({ tankCapacity, rateLRai, swath, activeFieldId, navHud });
  }, [tankCapacity, rateLRai, swath, activeFieldId, navHud]);

  /** Auto-save every 5 seconds while a mission is live (running or paused) —
   *  on top of the key-event saves at tank-empty, out-of-bounds, and
   *  Save & Pause below. Torn down the instant the mission leaves that
   *  window so it never fires during boundary plotting or the ready screen. */
  useEffect(() => {
    if (phase !== 'running' && phase !== 'paused') return;

   *  mid-mission never loses more than a few seconds of progress. */

     so we never re-prompt on our own: a single watchPosition subscription

     we don't sit stuck — the Permissions API lets us notice the moment the
     person flips the OS/browser toggle back to Allow (in another tab, the

  /* switching into GPS mode with a boundary that isn't real-world anchored: re-map it first */
  useEffect(() => {
    if (srcMode === 'gps' && !fieldRef.current.gpsAnchored && phaseRef.current !== 'boundary') {

    }
  }, [srcMode]);

  useEffect(() => {

          freeDyRef.current = 0;
        }

  const driveTo = (target, onDone) => {
    const sim = simRef.current;
    const d = dist(sim.pos, target);

    // each frame below (not baked in here) so a mid-walk speed change (or a
    // walk that starts already at 20x/60x) takes effect immediately, exactly
    // like the main route-follower's advance() already does.
    manualPathRef.current = { legs: [{ to: { ...target }, dur: Math.max(700, d * 450) }], idx: 0, prog: 0, from: { ...sim.pos }, onDone: onDone || (() => {}) };

        // every frame (no rotation, no follow-me/GPS re-centering — those
