  function agrasBootFail(lib) {

  }
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.React || !window.ReactDOM || !window.Babel) agrasBootFail('required libraries');
    }, 8000);
  });
</script>

  const R = 6371000, toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;

 *  cheap substitute for full spherical geometry once a field is this small,
 *  and it lets every polygon/coverage routine below stay plain Euclidean. */

  const mPerDegLat = 110540;

                                      // first time every provider comes back empty at the current ceiling — once

                                      // field and switches to pure digital zoom (stretching the deepest real tile

function lonLatToWorldPx(lon, lat, z) {
  const n = TILE_SIZE * Math.pow(2, z);
  const x = (lon + 180) / 360 * n;
  const latRad = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;

}

  const farSaves = globalBest ? Math.round(variants[pick].empty - globalBest.empty) : 0;
  return { variants, idx: pick, best: pick, farSaves };
}

 *  refill breakpoint) and walking straight back down the row you just sprayed

 *  long enough to be movement rather than GPS jitter. Gentle curves — following
 *  an irregular field edge — are absorbed by the EMA and never split a lane; a

 *  sprayed (or already flagged) is left alone. */

  let guard = 0;
  while (budget > 0 && !sim.done && guard++ < 128) {

    if (!target) { sim.done = true; break; }
    const d = dist(sim.pos, target);
    if (d < 1e-6) { sim.wp++; continue; }
    const step = Math.min(budget, d);
    const from = { ...sim.pos };
    sim.heading = Math.atan2(target.y - sim.pos.y, target.x - sim.pos.x);
    sim.pos = { x: sim.pos.x + (target.x - sim.pos.x) / d * step, y: sim.pos.y + (target.y - sim.pos.y) / d * step };

    sim.fixes.push(fix);
  }

    const pts = [];
    R.segs.forEach((sg) => { pts.push(sg.a, sg.b); });
    ctx.save();
    ctx.globalAlpha = R.faint ? 0.45 : 1;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const line = () => { ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(X_(v, p.x), Y_(v, p.y)) : ctx.moveTo(X_(v, p.x), Y_(v, p.y)))); ctx.stroke(); };
    const gap = (R.swath || 5) * v.s;               // on-screen lane spacing, px
    const lw = Math.max(1.2 * k, Math.min(3 * k, gap * 0.3));
    ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = lw * 2; line();
    ctx.strokeStyle = '#1E6FD9'; ctx.lineWidth = lw; line();
    // direction chevrons every ~40 m of lane
    ctx.fillStyle = '#FFFFFF';
    if (gap >= 16 * k) R.segs.forEach((sg) => {
      const L = dist(sg.a, sg.b); if (L < 12) return;
      const n = Math.max(1, Math.floor(L / 40));
      for (let i = 1; i <= n; i++) {
        const t = i / (n + 1), px = sg.a.x + (sg.b.x - sg.a.x) * t, py = sg.a.y + (sg.b.y - sg.a.y) * t;
        const sx = X_(v, px), sy = Y_(v, py), ex = X_(v, sg.b.x), ey = Y_(v, sg.b.y);
        const ang = Math.atan2(ey - sy, ex - sx);
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
        ctx.beginPath(); ctx.moveTo(4.5 * k, 0); ctx.lineTo(-3 * k, 3.5 * k); ctx.lineTo(-3 * k, -3.5 * k); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    });
    // START: an arrow pointing down the first lane; END: a dot (the owner's drawing)
    const s0 = R.segs[0], e0 = R.segs[R.segs.length - 1].b;
    ctx.fillStyle = '#1E6FD9'; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5 * k;
    {
      const sx = X_(v, s0.a.x), sy = Y_(v, s0.a.y), ang = Math.atan2(Y_(v, s0.b.y) - sy, X_(v, s0.b.x) - sx);
      ctx.save(); ctx.translate(sx, sy); ctx.rotate(ang);
      ctx.beginPath(); ctx.moveTo(11 * k, 0); ctx.lineTo(-5 * k, 8 * k); ctx.lineTo(-5 * k, -8 * k); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.beginPath(); ctx.arc(X_(v, e0.x), Y_(v, e0.y), 8 * k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // numbered tank markers: one that would overlap an earlier one slides
    // along its own lane (forward or back) to the nearest free spot
    const rr = 9 * k, placed = [];
    R.tanks.forEach((p, i) => {
      const sg = R.segs[p.seg];
      const free = (q) => placed.every((o) => Math.hypot(o.x - X_(v, q.x), o.y - Y_(v, q.y)) >= rr * 2.2);
      let q = p;
      if (sg && !free(q)) {
        const L = dist(sg.a, sg.b) || 1, ux = (sg.b.x - sg.a.x) / L, uy = (sg.b.y - sg.a.y) / L;
        const t0 = dist(sg.a, p), stepM = (rr * 1.1) / v.s;         // half a marker, in metres
        for (let n = 1; n <= 40; n++) {
          const t = t0 + (n % 2 ? 1 : -1) * Math.ceil(n / 2) * stepM;
          if (t < 0 || t > L) continue;
          const c = { x: sg.a.x + ux * t, y: sg.a.y + uy * t };
          if (free(c)) { q = c; break; }
        }
      }
      const x = X_(v, q.x), y = Y_(v, q.y);
      placed.push({ x, y });
      ctx.fillStyle = '#FFFFFF'; ctx.strokeStyle = '#14201C'; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.arc(x, y, rr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#14201C'; ctx.font = `bold ${10 * k}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.save(); ctx.translate(x, y); ctx.rotate(v.angle || 0);   // undo the map rotation so the number stands upright
      ctx.fillText(String(i + 1), 0, 0.5 * k); ctx.restore();
    });
    ctx.restore();
  }

  // Home screen: where spraying stopped last time (a target ring) and the
  // operator (a blue dot), so it is obvious where to walk to carry on.
  if (opts.lastStop) {
    const k = Math.min(2, window.devicePixelRatio || 1);
    const lx = X_(v, opts.lastStop.x), ly = Y_(v, opts.lastStop.y);
    ctx.save();
    ctx.lineWidth = 3 * k; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    ctx.beginPath(); ctx.arc(lx, ly, 11 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2.5 * k; ctx.strokeStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(lx, ly, 11 * k, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#8A4B06'; ctx.beginPath(); ctx.arc(lx, ly, 5 * k, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // Crop checks: a teardrop pin per photo (tip on the spot), coloured by what
  // was found, kept upright however the map is turned.
  if (opts.checks) {
    const k = Math.min(2, window.devicePixelRatio || 1);
    opts.checks.forEach((c) => {
      ctx.save(); ctx.translate(X_(v, c.x), Y_(v, c.y)); ctx.rotate(v.angle || 0);
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-3 * k, -5 * k, -9 * k, -9 * k, -9 * k, -15 * k);
      ctx.arc(0, -15 * k, 9 * k, Math.PI, 0);
      ctx.bezierCurveTo(9 * k, -9 * k, 3 * k, -5 * k, 0, 0);
      ctx.closePath();
      ctx.lineJoin = 'round'; ctx.lineWidth = 4 * k; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.stroke();
      ctx.fillStyle = c.color; ctx.fill();
      ctx.lineWidth = 2 * k; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
      ctx.fillStyle = '#FFFFFF'; ctx.font = `bold ${11 * k}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(c.glyph, 0, -14.5 * k);
      ctx.restore();
    });
  }
  if (opts.you) {
    const k = Math.min(2, window.devicePixelRatio || 1);
    const yx = X_(v, opts.you.x), yy = Y_(v, opts.you.y);
    ctx.save();
    ctx.fillStyle = 'rgba(66,153,255,.25)'; ctx.beginPath(); ctx.arc(yx, yy, 13 * k, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1E6FD9'; ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2.5 * k;
    ctx.beginPath(); ctx.arc(yx, yy, 7 * k, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // Refill station: a map pin (tip on the spot) with a water drop, sized for
  // the screen — the old 7 px dot was hard to find on satellite imagery.
  // Refill station: a white house with a dark water drop (the owner's
  // drawing), kept upright however the map is turned, with a dark outline so
  // it reads on light and dark imagery alike.
  if (station && !opts.hideStation) {
    const k = opts.thumb ? 0.7 : Math.min(2, window.devicePixelRatio || 1);
    const sx = X_(v, station.x), sy = Y_(v, station.y);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(v.angle || 0);
    const house = () => {
      ctx.beginPath();
      ctx.moveTo(0, -13 * k);                 // roof peak
      ctx.lineTo(13 * k, -1 * k);             // right eave
      ctx.lineTo(9.5 * k, -1 * k);
      ctx.lineTo(9.5 * k, 9 * k);
      ctx.quadraticCurveTo(9.5 * k, 11 * k, 7.5 * k, 11 * k);
      ctx.lineTo(-7.5 * k, 11 * k);
      ctx.quadraticCurveTo(-9.5 * k, 11 * k, -9.5 * k, 9 * k);
      ctx.lineTo(-9.5 * k, -1 * k);
      ctx.lineTo(-13 * k, -1 * k);            // left eave
      ctx.closePath();
    };
    ctx.lineJoin = 'round';
    house(); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 3.5 * k; ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.fill();
    // water drop
    ctx.fillStyle = '#1E1E1E';
    ctx.beginPath(); ctx.moveTo(0, -5 * k);
    ctx.bezierCurveTo(1.2 * k, -1.5 * k, 4.6 * k, 2 * k, 4.6 * k, 5 * k);
    ctx.bezierCurveTo(4.6 * k, 7.8 * k, 2.4 * k, 9.2 * k, 0, 9.2 * k);
    ctx.bezierCurveTo(-2.4 * k, 9.2 * k, -4.6 * k, 7.8 * k, -4.6 * k, 5 * k);
    ctx.bezierCurveTo(-4.6 * k, 2 * k, -1.2 * k, -1.5 * k, 0, -5 * k);
    ctx.fill();
    ctx.restore();
  }

  if (!opts.static) {
    const px = X_(v, sim.pos.x), py = Y_(v, sim.pos.y);
    const col = opts.oob ? '#A5201A' : '#0C6B48';
    ctx.fillStyle = opts.oob ? 'rgba(255,82,82,.18)' : 'rgba(10,82,56,.18)';
    ctx.beginPath(); ctx.arc(px, py, (opts.oob ? 4 : 3) * v.s, 0, Math.PI * 2); ctx.fill();
    // a navigation arrow sized for the screen: dark halo, white outline, so
    // it stands out on any imagery (the old 10 px arrow disappeared)
    const km = Math.min(2, window.devicePixelRatio || 1);
    ctx.save(); ctx.translate(px, py); ctx.rotate(sim.heading);
    ctx.beginPath(); ctx.moveTo(15 * km, 0); ctx.lineTo(-9 * km, 10 * km); ctx.lineTo(-4 * km, 0); ctx.lineTo(-9 * km, -10 * km); ctx.closePath();
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 6 * km; ctx.stroke();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3 * km; ctx.stroke();
    ctx.fillStyle = col; ctx.fill();
    ctx.restore();
  }

  if (opts.accuracyRadius) {
    const px = X_(v, sim.pos.x), py = Y_(v, sim.pos.y);
    ctx.strokeStyle = 'rgba(10,82,56,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(px, py, opts.accuracyRadius * v.s, 0, Math.PI * 2); ctx.stroke();
  }

  if (hasRotation) ctx.restore();
}

/* ============================================================== *
 *  App                                                             *
 * ============================================================== */
function App() {
  const [phase, setPhase] = useState('ready');       // boundary | station | ready | running | paused | done
  const [opMode, setOpMode] = useState('spray');      // spray | toStation (TANK EMPTY tapped: recording off until REFILLED · START SPRAYING)
  const [devMode, setDevMode] = useState(() => {
    if (IS_PROD) return false;   // the field app has no dev mode (and so no SIM) at all
    try { const v = localStorage.getItem('agras_dev'); return v === '1' || (IS_TEST_APP && v !== '0'); } catch (e) { return IS_TEST_APP; }
  });
  const devTapsRef = useRef({ n: 0, t: 0 });
  const freeRectRef = useRef({ top: 0, h: 0 }); // the map area not covered by the HUD cards / dock (canvas px)
  const freeDyRef = useRef(0); // px offset of the free map zone's centre from the canvas centre (ready/running screens)
  const gridVersionRef = useRef(0);
  const [camMode, setCamModeState] = useState('follow');   // spraying camera: 'follow' (heading-up, chase view) | 'fit' (whole field) | 'free' (user panned)
  const camModeRef = useRef('follow');
  const setCamMode = (m) => { camModeRef.current = m; setCamModeState(m); if (m !== 'free') lastSigRef.current = ''; };
  const [showStats, setShowStats] = useState(false);
  const [devPanelOpen, setDevPanelOpen] = useState(false); // dev/SIM controls stay folded away unless opened
  const navHeadingRef = useRef(null);
  const navScaleRef = useRef(0);          // px per metre in follow mode (0 = auto)
  const gestureRef = useRef(null);
  const tankAreasRef = useRef([]);         // m² sprayed with each COMPLETED tank (operator taps TANK EMPTY)
  const tankOpenRef = useRef(true);        // a tank is currently in use (false between TANK EMPTY and the refill)
  const coverageBaseRef = useRef({ sprayed: 0, overlap: 0 }); // cells already sprayed when this mission began (restored from the field's saved coverage)
  // TANK EMPTY and REFILLED · START SPRAYING occupy the same spot on the dock,
  // so a double tap on one would land its second tap on the other and undo it
  // (and close a phantom zero-area tank). Either switch ignores the other for 2 s.
  const modeSwitchAtRef = useRef(0);
  const unrecordedRef = useRef({ walked: 0, startDist: 0, lastAlert: 0 }); // walking in the field while the refill trip has spraying switched off
  const enteredFieldRef = useRef(false);   // out-of-bounds alerts only after the operator has been inside the field once
  const lastFixMsRef = useRef(0);
  const [logMsg, setLogMsg] = useState('');
  const headlessFrameRef = useRef(null); // runs one simulation frame without painting (screen-off GPS fixes)
  const lastSigRef = useRef(''); // static-redraw guard; cleared whenever the canvas is wiped or the coverage grid is rebuilt
  const secretDevTap = () => {
    if (IS_PROD) return;
    const d = devTapsRef.current, now = Date.now();
    d.n = now - d.t < 1500 ? d.n + 1 : 1; d.t = now;
    if (d.n >= 7) {
      d.n = 0;
      const next = !devMode;
      setDevMode(next);
      if (!next) setSrcMode('gps');
      try { localStorage.setItem('agras_dev', next ? '1' : '0'); } catch (e) { /* ignore */ }
    }
  };
  const [srcMode, setSrcMode] = useState('gps');      // gps only (sim mode removed)
  const [gpsStatus, setGpsStatus] = useState('idle'); // idle | requesting | active | denied | unavailable | insecure
  const [gpsInfo, setGpsInfo] = useState(null);       // { lat, lng, accuracy }
  const [gpsRetryTick, setGpsRetryTick] = useState(0); // bumped to re-run GPS acquisition without a full mode toggle
  const [swath, setSwath] = useState(() => { const s = loadLastSettings(); return s && s.swath ? s.swath : 2.5; });
  // suggested route: how far lane ends and the outer lanes stay from the field edge
  const [edgeGap, setEdgeGap] = useState(() => { const s = loadLastSettings(); return s && s.edgeGap != null ? s.edgeGap : ((s && s.swath) || 2.5) / 2; });
  const edgeGapRef = useRef(edgeGap); edgeGapRef.current = edgeGap;
  const [mult, setMult] = useState(20);
  const [autoWalk, setAutoWalk] = useState(true);
  const [draft, setDraft] = useState([]);
  const [stationDraft, setStationDraft] = useState(null);
  const [oob, setOob] = useState(false);
  const [excursionActive, setExcursionActive] = useState(false);
  const [missions, setMissions] = useState(() => loadHistory());
  const [showHistory, setShowHistory] = useState(false);
  const [selectedMissionId, setSelectedMissionId] = useState(null);
  const [confirmClear, setConfirmClear] = useState(false);
  const [fieldLibrary, setFieldLibrary] = useState(() => loadFieldLibrary());
  const [showFieldLibrary, setShowFieldLibrary] = useState(false);
  const [showSaveField, setShowSaveField] = useState(false);
  const [namingNewField, setNamingNewField] = useState(false);
  const [frameTick, setFrameTick] = useState(0);      // bump to re-frame the home screen
  const [routePlan, setRoutePlan] = useState(null);   // { variants: [long, across], idx, best } from planSprayRoute
  const routePlanRef = useRef(null); routePlanRef.current = routePlan; // the rename sheet opened by itself for a just-plotted field
  const askNameAfterStationRef = useRef(false);
  const [saveFieldName, setSaveFieldName] = useState('');
  const [confirmDeleteFieldId, setConfirmDeleteFieldId] = useState(null);
  const [confirmCloseField, setConfirmCloseField] = useState(false);
  const [activeFieldId, setActiveFieldId] = useState(null); // which saved field (if any) is currently loaded
  const activeFieldIdRef = useRef(null); activeFieldIdRef.current = activeFieldId;
  const fieldLibraryRef = useRef(fieldLibrary); fieldLibraryRef.current = fieldLibrary;
  const [confirmResetCovId, setConfirmResetCovId] = useState(null);
  const [confirmResetAll, setConfirmResetAll] = useState(false);
  const [renamingFieldId, setRenamingFieldId] = useState(null);
  const [renameDraft, setRenameDraft] = useState('');
  const [tankCapacity, setTankCapacity] = useState(() => { const s = loadLastSettings(); return s && s.tankCapacity ? s.tankCapacity : DEFAULT_TANK_CAPACITY_L; });
  const [rateLRai, setRateLRai] = useState(() => { const s = loadLastSettings(); return s && s.rateLRai ? s.rateLRai : DEFAULT_RATE_L_PER_RAI; });
  const [showSpraySettings, setShowSpraySettings] = useState(false); // compact summary row -> this sheet, instead of two always-expanded panels
  const [satelliteOn, setSatelliteOn] = useState(true);    // Esri World Imagery underlay — on by default; only actually renders once a real-world geo-reference (GPS fix or a saved field's stored origin) is available
  const [followMe, setFollowMe] = useState(false);          // true: pan auto-centers on the operator; false: free pan
  const [gpsCardOpen, setGpsCardOpen] = useState(false);   // expandable raw-telemetry card
  const [chemSheet, setChemSheet] = useState(null);        // null | 'start' (first START of a round) | 'edit'
  const [chemDraft, setChemDraft] = useState([]);          // [{ name, rate, unit }] being edited
  const [reportFieldId, setReportFieldId] = useState(null); // field whose spray report is open
  const [reportMsg, setReportMsg] = useState('');
  const missionStartTsRef = useRef(null);  // when this spraying session started
  const weatherStartRef = useRef(null);    // weather read when it started
  const [showFinishChoice, setShowFinishChoice] = useState(false); // FINISH asks: whole field done (close the round) or continue later
  const finishKindRef = useRef('complete');   // how the mission now ending was finished; the SIM route-follower's auto-done counts as complete
  const [finishInfo, setFinishInfo] = useState(null); // { round, complete } for the summary screen
  const [restoredToast, setRestoredToast] = useState(false); // "unfinished mission restored" notice after an automatic restore at startup
  const resumedAtStartRef = useRef(false);
  const missionRecordIdRef = useRef(null); // history record id of the mission in progress, once it has been filed
  const [checklist, setChecklist] = useState(() => loadChecklist()); // Spec §4B preflight checklist
  const [checklistExpanded, setChecklistExpanded] = useState(false); // collapsed by default — declutters the Ready screen; tap the summary row to open
  const [sprayWeather, setSprayWeather] = useState(null);      // { windKmh, gustKmh, rainSoonProb, ... } from Open-Meteo, or null until fetched
  const [sprayWeatherStatus, setSprayWeatherStatus] = useState('idle'); // idle | loading | ok | error
  const [showFieldSetupMenu, setShowFieldSetupMenu] = useState(false); // Plot/Station/Save — was 3 always-visible buttons, now one row that opens a sheet
  const [showToolsMenu, setShowToolsMenu] = useState(false);           // Offline map / History / Resume — same consolidation
  const [showOfflineMap, setShowOfflineMap] = useState(false);
  const [downloadState, setDownloadState] = useState(null); // { done, total } while downloading; null when idle
  const [cacheInfo, setCacheInfo] = useState(null);         // { tiles, bytes } — last-measured offline cache size
  const [, setTick] = useState(0);

  const fieldRef = useRef(buildField(SAMPLE_POLY, false, 2.5));
  const simRef = useRef(makeSim(fieldRef.current, 2.5));
  const stationRef = useRef({ ...SAMPLE_STATION });
  const gridCanvasRef = useRef(null);
  const imgDataRef = useRef(null);
  const dirtyRef = useRef(null);           // { minI, maxI, minJ, maxJ } — cells painted since last flush
  const frameCountRef = useRef(0);
  const canvasRef = useRef(null);
  const wrapRef = useRef(null);
  const viewRef = useRef({ s: 1, ox: 0, oy: 0 });
  const manualPathRef = useRef(null);
  const oobRef = useRef(false);
  const opModeRef = useRef('spray');
  const prevPhaseRef = useRef('ready');
  const watchIdRef = useRef(null);
  const projectorRef = useRef(null);
  const gpsLiveRef = useRef({ lat: null, lng: null, accuracy: null, x: 0, y: 0, seq: 0 });
  const appliedSeqRef = useRef(0);
  const lastLatLngRef = useRef(null);
  useEffect(() => { lastLatLngRef.current = null; }, [phase]); // every phase change re-anchors on the next fix
  const gpsInfoThrottleRef = useRef(0);
  const tankBaselineAreaRef = useRef(0);   // cumulative spray-pass area (sqm) at last "refilled" tap
  const lowLiquidWarnedRef = useRef(false);
  const originLatLngRef = useRef(null);    // { lat, lng } of the GPS anchor — paired with projectorRef/unprojectRef
  const unprojectRef = useRef(null);       // paired with projectorRef — local metres -> real lat/lng
  const panRef = useRef(null);             // { x, y, s } local-metre view-centre + scale override while free-panning; null = auto-fit
  const dragRef = useRef(null);            // { id, startClientX, startClientY, startPan, moved } — active single-finger drag gesture
  const tileCacheRef = useRef(new Map());  // "z/x/y" -> { img, loaded, failed, objUrl }
  const zoomCeilingRef = useRef(MAX_NATIVE_ZOOM); // this field's confirmed deepest fetchable zoom — ratchets down in drawSatelliteTiles, reset to optimistic whenever the active field changes (see resetField/loadFieldFromLibrary)
  const mapCacheRef = useRef(null);        // the open Cache Storage object ('agras-map-tiles-v1') once available; null = unsupported
  const activePointersRef = useRef(new Map()); // pointerId -> {x,y} — live touch points, for two-finger pinch detection
  const pinchRef = useRef(null);           // { startDist, startS, centerField } — active two-finger pinch gesture
  const lastTapRef = useRef({ t: 0 });     // last single-tap time, for double-tap-to-zoom detection
  const downloadAbortRef = useRef(false);  // set true to cancel an in-flight "Download Field Map" prefetch
  const gpsExtraRef = useRef({ speed: null, heading: null, altitude: null }); // latest raw coords beyond lat/lng/accuracy
  const autosaveTimerRef = useRef(null);
  const saveSessionRef = useRef(null);     // the current saveSessionNow, for the main loop (created once)
  const lastSessionSaveRef = useRef(0);    // Date.now() of the last session save
  const speedEmaRef = useRef(0);           // smoothed live walking speed, m/s — feeds the Pace/Flow-Rate widget
  const prevPosForSpeedRef = useRef(null);
  const restoredRef = useRef(false);       // true once a resumed session has been applied — gates the startup check

  const phaseRef = useRef(phase); phaseRef.current = phase;
  const srcModeRef = useRef(srcMode); srcModeRef.current = srcMode;
  const multRef = useRef(mult); multRef.current = mult;
  const autoWalkRef = useRef(autoWalk); autoWalkRef.current = autoWalk;
  const swathRef = useRef(swath); swathRef.current = swath;
  const draftRef = useRef(draft); draftRef.current = draft;
  const stationDraftRef = useRef(stationDraft); stationDraftRef.current = stationDraft;
  const satelliteOnRef = useRef(satelliteOn); satelliteOnRef.current = satelliteOn;
  const followMeRef = useRef(followMe); followMeRef.current = followMe;
  const tankCapacityRef = useRef(tankCapacity); tankCapacityRef.current = tankCapacity;
  const rateLRaiRef = useRef(rateLRai); rateLRaiRef.current = rateLRai;
  const opModeStateRef = useRef(opMode); opModeStateRef.current = opMode;

  /** Open (or create) the persistent offline tile store once. Cache Storage
   *  needs a secure context (https, or localhost) — it's simply absent on a
   *  plain http:// page or some file:// setups, so this is feature-detected
   *  everywhere it's used: satellite imagery always works online exactly as
   *  before, this only adds an offline fallback where the platform allows it. */
  useEffect(() => {
    if (!('caches' in window)) return;
    caches.open(MAP_TILE_CACHE_NAME).then((c) => { mapCacheRef.current = c; }).catch(() => {});
  }, []);

  /* inject the type system once — a bare component owns no <head> of its own */
  useEffect(() => {
    if (document.getElementById('agras-tracker-fonts')) return;
    const link = document.createElement('link');
    link.id = 'agras-tracker-fonts'; link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap';
    document.head.appendChild(link);
    const style = document.createElement('style');
    style.id = 'agras-tracker-type';
    style.textContent = `
      .font-display{font-family:'Bai Jamjuree','IBM Plex Sans Thai',ui-sans-serif,system-ui,sans-serif!important;}
      .font-mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace!important;}
      .font-sans{font-family:'IBM Plex Sans Thai',ui-sans-serif,system-ui,sans-serif!important;}
      .tnum{font-variant-numeric:tabular-nums;}
      @keyframes oob-pulse{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,60,60,0)}50%{box-shadow:inset 0 0 46px 12px rgba(255,60,60,.6)}}
      .oob-border{animation:oob-pulse 1.1s ease-in-out infinite;}
      @keyframes green-flash{0%{opacity:.55}100%{opacity:0}}
      .green-flash{animation:green-flash 2.1s ease-out forwards;background:radial-gradient(circle,rgba(10,82,56,.45),transparent 70%);}
      @media (prefers-reduced-motion: reduce){
        .oob-border{animation:none;box-shadow:inset 0 0 0 4px rgba(255,60,60,.7)!important;}
        .green-flash{animation:none;opacity:0;}
      }
    `;
    document.head.appendChild(style);
  }, []);

  const initGrid = useCallback((field) => {
    // free the previous raster's backing store now rather than whenever the
    // GC gets round to it (up to ~4 MB for a big field, on every reset/load)
    const prev = gridCanvasRef.current;
    if (prev) { prev.width = 0; prev.height = 0; }
    const gc = document.createElement('canvas');
    gc.width = field.GW; gc.height = field.GH; lastSigRef.current = '';
    const ctx = gc.getContext('2d');
    const img = ctx.createImageData(field.GW, field.GH);
    gridCanvasRef.current = gc; imgDataRef.current = img;
    dirtyRef.current = null; frameCountRef.current = 0;
    field.__ctx = {
      GW: field.GW, GH: field.GH, gbbox: field.gbbox,
      inside: field.inside, credit: field.credit, insideRatio: field.insideRatio,
      lastPass: simRef.current.lastPass,
    };
  }, []);
  useEffect(() => { initGrid(fieldRef.current); }, []);

  /** Mutates the persistent coverage buffer only — never touches the visible
   *  canvas directly (see flushGridDirty/flushGridFull above for why). Marks
   *  the touched cell range so the main loop can upload just that chunk.
   *  `state`: -1 = missed (red hatch, Spec §3C), 1 = optimal (light green),
   *  2+ = overlap (dark green/amber, opacity rising with the pass count —
   *  "Opacity increases with passes" per the spec's GridCell visual rule). */
  const paintCell = useCallback((i, j, state) => {
    const img = imgDataRef.current, gw = fieldRef.current.GW;
    const idx = (j * gw + i) * 4;
    const outside = state >= 1 && fieldRef.current.inside && !fieldRef.current.inside[j * gw + i];
    if (outside) {
      // spray that landed past the boundary (the edge-tolerance band): grey,
      // so it reads as over the line rather than as field coverage
      img.data[idx] = 150; img.data[idx + 1] = 160; img.data[idx + 2] = 160; img.data[idx + 3] = 150;
    } else if (state === -1) {
      // red hatch: alternate cell-granularity checker so the missed band
      // reads as a stripe rather than a flat fill, at the same 1px-per-cell
      // resolution the rest of the raster paints at.
      const alt = (i + j) % 2 === 0;
      img.data[idx] = 255; img.data[idx + 1] = 82; img.data[idx + 2] = 82; img.data[idx + 3] = alt ? 190 : 70;
    } else if (state === 1) {
      img.data[idx] = 52; img.data[idx + 1] = 199; img.data[idx + 2] = 111; img.data[idx + 3] = 195;
    } else {
      const depth = Math.min(Math.max(0, state - 2), 5);
      img.data[idx] = 255; img.data[idx + 1] = 182; img.data[idx + 2] = 72; img.data[idx + 3] = Math.min(255, 190 + depth * 13);
    }
    const d = dirtyRef.current;
    if (!d) dirtyRef.current = { minI: i, maxI: i, minJ: j, maxJ: j };
    else {
      if (i < d.minI) d.minI = i; if (i > d.maxI) d.maxI = i;
      if (j < d.minJ) d.minJ = j; if (j > d.maxJ) d.maxJ = j;
    }
  }, []);

  const clearAlerts = () => { oobRef.current = false; setOob(false); };
  const resetOpMode = () => { opModeRef.current = 'spray'; setOpMode('spray'); };

  /** Pre-flight checklist — non-blocking (Spec §4B): toggling never gates
   *  START SPRAYING. Ppe/mixedRate/nozzle refresh the 4-hour checkedAt
   *  window; wind is deliberately left out of that stamp so it keeps
   *  resetting on every load, per spec. */
  const toggleChecklistItem = (key) => {
    setChecklist((c) => {
      const next = { ...c, [key]: !c[key] };
      if (key !== 'wind') next.checkedAt = Date.now();
      saveChecklist(next);
      return next;
    });
  };
  const setChecklistField = (key, value) => {
    setChecklist((c) => { const next = { ...c, [key]: value }; saveChecklist(next); return next; });
  };

  /** Live wind/rain for the pre-flight checklist (Open-Meteo). Only runs on
   *  the Ready screen, and only once the field has a real-world anchor
   *  (originLatLngRef — set from a saved field, a resumed session, or a
   *  live GPS fix). SIM-mode fields with no GPS anchor simply show no live
   *  reading; the manual Wind-checked toggle still works exactly as before.
   *  Re-runs on phase change, switching fields, and the first GPS fix
   *  landing (!!gpsInfo) — not on every gpsInfo update, so it doesn't
   *  re-fetch every 400ms while a fix is already known. */
  useEffect(() => {
    if (phase !== 'ready') return;
    const anchor = originLatLngRef.current;
    if (!anchor || anchor.lat == null) { setSprayWeather(null); setSprayWeatherStatus('idle'); return; }
    let cancelled = false;
    setSprayWeatherStatus('loading');
    fetchSprayWeather(anchor.lat, anchor.lng)
      .then((data) => { if (!cancelled) { setSprayWeather(data); setSprayWeatherStatus('ok'); } })
      .catch(() => { if (!cancelled) { setSprayWeather(null); setSprayWeatherStatus('error'); } });
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [phase, activeFieldId, !!gpsInfo]);

  const resetField = useCallback((poly, w) => {
    const field = buildField(poly, srcModeRef.current === 'gps', w);
    fieldRef.current = field;
    simRef.current = makeSim(field, w);
    stationRef.current = defaultStation(field.bbox);
    initGrid(field);
    field.__ctx.lastPass = simRef.current.lastPass;
    manualPathRef.current = null; setExcursionActive(false); resetOpMode(); clearAlerts();
    tankBaselineAreaRef.current = 0; lowLiquidWarnedRef.current = false;
    tankAreasRef.current = []; tankOpenRef.current = true; coverageBaseRef.current = { sprayed: 0, overlap: 0 };
    activeFieldIdRef.current = null;
    setActiveFieldId(null); // a freshly-plotted boundary is unsaved until the operator saves it
    zoomCeilingRef.current = MAX_NATIVE_ZOOM; // new location — give it a fresh, optimistic chance at deep zoom
    setPhase('ready');
    // Closing the boundary is effectively "saving" this plot as the active
    // field — start caching its satellite tiles for offline use right away,
    // in the background, rather than waiting for a manual Offline Map tap.
    setTimeout(autoDownloadFieldMap, 300);
  }, [initGrid]);

  /* ---- manual tank tracking: the operator taps TANK EMPTY; the app just records what each tank covered ---- */
  const totalPassAreaNow = () => { const s0 = simRef.current; return (s0.sprayedCells + s0.overlapCells) * CELL * CELL; };
  const closeTank = () => {
    if (!tankOpenRef.current) return;
    const a = Math.max(0, totalPassAreaNow() - tankBaselineAreaRef.current);
    tankAreasRef.current = [...tankAreasRef.current, a];
    tankOpenRef.current = false;
    AgrasLog.add('TANK', `tank ${tankAreasRef.current.length} emptied after ${(a / 1600).toFixed(2)} rai`);
  };
  const openTank = () => {
    closeTank();
    tankBaselineAreaRef.current = totalPassAreaNow();
    tankOpenRef.current = true;
    AgrasLog.add('TANK', `tank ${tankAreasRef.current.length + 1} started (refilled)`);
  };
  const tanksUsedCount = () => tankAreasRef.current.length + (tankOpenRef.current && totalPassAreaNow() - tankBaselineAreaRef.current > 0 ? 1 : 0);

  /* ---- per-field saved coverage ----
     EVERY write to the field library goes through updateLibrary. It applies
     the change to the ref synchronously and saves right then, so writes land
     in the order they were made. The old pattern — saveFieldLibrary() inside a
     setFieldLibrary((list) => ...) updater — runs later, during the next
     render, on whatever React had queued, and at FINISH that meant the
     "last sprayed" stamp saved a copy of the list from before the round was
     closed: the screen said round 2, the phone's storage still said round 1. */
  const updateLibrary = (fn) => {
    const next = fn(fieldLibraryRef.current);
    fieldLibraryRef.current = next;
    setFieldLibrary(next);
    if (!saveFieldLibrary(next)) AgrasLog.add('ERR', 'field library save failed (storage full?)');
  };
  /** Paint a saved field's previously-sprayed cells into a freshly built sim/grid. */
  const applyCoverage = (entry) => {
    const sim = simRef.current, f = fieldRef.current;
    coverageBaseRef.current = { sprayed: 0, overlap: 0 };
    tankBaselineAreaRef.current = 0;
    const cov = entry && entry.cov;
    if (!cov || cov.len !== f.GW * f.GH) return;
    try {
      const passes = rleDecode(cov.passes, cov.len), missed = rleDecode(cov.missed, cov.len);
      sim.passes = passes; sim.missed = missed; recountMissed(sim);
      let sprayed = 0, overlap = 0;
      for (let k = 0; k < cov.len; k++) {
        const p = passes[k], i = k % f.GW, j = (k / f.GW) | 0;
        if (p > 0) { sprayed++; overlap += p - 1; sim.lastPass[k] = -2; paintCell(i, j, p); }
        else if (missed[k]) paintCell(i, j, -1);
      }
      sim.sprayedCells = sprayed; sim.overlapCells = overlap;
      coverageBaseRef.current = { sprayed, overlap };
      tankBaselineAreaRef.current = (sprayed + overlap) * CELL * CELL;
      if (gridCanvasRef.current && imgDataRef.current) { flushGridFull(gridCanvasRef.current, imgDataRef.current); dirtyRef.current = null; gridVersionRef.current++; }
      AgrasLog.add('COVER', `restored ${sprayed} sprayed cells (${(sprayed * CELL * CELL / 1600).toFixed(2)} rai) for "${entry.name}"`);
    } catch (e) { AgrasLog.add('ERR', 'coverage restore failed: ' + (e && e.message)); }
  };
  /** Save what has been sprayed on the active field into its library entry (autosave + mission end).
   *  enc: the same arrays already run-length encoded ({ passes, missed }) by
   *  the session snapshot taken a moment before, so an autosave encodes once. */
  const persistCoverage = (id, final, enc) => {
    if (!id) return;
    const sim = simRef.current, f = fieldRef.current;
    const len = f.GW * f.GH;
    if (!sim.passes || sim.passes.length !== len) return;
    const cov = { v: 1, len, passes: enc ? enc.passes : rleEncode(sim.passes), missed: enc ? enc.missed : rleEncode(sim.missed), sprayedCells: sim.sprayedCells, overlapCells: sim.overlapCells, ts: Date.now() };
    const cb = coverageBaseRef.current;
    const tanksNow = tanksUsedCount(), elapsed = sim.elapsed, distance = sim.distance;
    updateLibrary((list) => list.map((e) => {
      if (e.id !== id) return e;
      const st = e.stats || { missions: 0, seconds: 0, distance: 0, tanks: 0 };
      const next = { ...e, cov, lastStop: sim.lastSprayPos || e.lastStop || null, settings: { swath: swathRef.current, tankCapacity: tankCapacityRef.current },
        lastSprayedTs: (sim.sprayedCells > cb.sprayed || sim.overlapCells > cb.overlap) ? Date.now() : e.lastSprayedTs };
      if (final) next.stats = { missions: st.missions + 1, seconds: st.seconds + elapsed, distance: st.distance + distance, tanks: st.tanks + tanksNow };
      return next;
    }));
    if (final) AgrasLog.add('COVER', `mission saved to field ${id}: ${(sim.sprayedCells * CELL * CELL / 1600).toFixed(2)} rai sprayed in total`);
  };

  const resetSim = useCallback((w) => {
    const field = fieldRef.current;
    simRef.current = makeSim(field, w);
    initGrid(field);
    field.__ctx.lastPass = simRef.current.lastPass;
    manualPathRef.current = null; setExcursionActive(false); resetOpMode(); clearAlerts();
    tankBaselineAreaRef.current = 0; lowLiquidWarnedRef.current = false;
    tankAreasRef.current = []; tankOpenRef.current = true;
    applyCoverage(fieldLibraryRef.current.find((e) => e.id === activeFieldIdRef.current));
    setPhase('ready');
  }, [initGrid]);

  /** Persistent Field Library — save the CURRENT active field (whatever is
   *  loaded right now, plotted or previously loaded) under an operator-given
   *  name; load swaps fieldRef/stationRef to a saved entry and re-runs
   *  resetSim (station is set first — resetSim never touches stationRef). */
  const saveCurrentFieldToLibrary = (name) => {
    const trimmed = (name || '').trim();
    if (!trimmed) return;
    const f = fieldRef.current;
    const origin = originLatLngRef.current;
    const entry = { id: Date.now(), name: trimmed, ts: Date.now(), lastSprayedTs: null, poly: f.poly, gpsAnchored: f.gpsAnchored, station: { ...stationRef.current }, areaRai: f.area / 1600, areaSqm: f.area, originLat: origin ? origin.lat : null, originLng: origin ? origin.lng : null };
    entry.settings = { swath: swathRef.current, tankCapacity: tankCapacityRef.current };
    updateLibrary((list) => [entry, ...list]);
    activeFieldIdRef.current = entry.id;
    setActiveFieldId(entry.id); // the field just saved is now the active one
    coverageBaseRef.current = { sprayed: 0, overlap: 0 };
    persistCoverage(entry.id); // keep whatever is already sprayed on it
    // Saving to the library is the other "save the plot" moment — make sure
    // its offline satellite tiles are cached too (idempotent/no-op if the
    // boundary-close prefetch above already covered it).
    setTimeout(autoDownloadFieldMap, 300);
  };
  const loadFieldFromLibrary = (entry) => {
    const w = (entry.settings && entry.settings.swath) || swath;
    if (entry.settings) {
      if (entry.settings.swath) { setSwath(entry.settings.swath); swathRef.current = entry.settings.swath; }
      if (entry.settings.tankCapacity) { setTankCapacity(entry.settings.tankCapacity); tankCapacityRef.current = entry.settings.tankCapacity; }
    }
    const field = buildField(entry.poly, entry.gpsAnchored, w);
    fieldRef.current = field;
    stationRef.current = entry.station || defaultStation(field.bbox);
    if (entry.originLat != null && entry.originLng != null) {
      // restore this field's real-world geo-reference so the satellite
      // basemap can render immediately — without this, a reloaded field has
      // no way to place itself on real tiles until a fresh GPS fix arrives.
      projectorRef.current = makeProjector(entry.originLat, entry.originLng);
      unprojectRef.current = makeUnprojector(entry.originLat, entry.originLng);
      originLatLngRef.current = { lat: entry.originLat, lng: entry.originLng };
    }
    activeFieldIdRef.current = entry.id; // must be set BEFORE resetSim so it restores this field's sprayed coverage
    resetSim(w);
    setActiveFieldId(entry.id);
    zoomCeilingRef.current = MAX_NATIVE_ZOOM; // switching fields — give the new location a fresh, optimistic chance at deep zoom
  };

  const [aiKey, setAiKey] = useState(() => { try { return localStorage.getItem(AI_KEY_STORE) || ''; } catch (e) { return ''; } });
  const [aiKeyDraft, setAiKeyDraft] = useState('');
  const [showChecks, setShowChecks] = useState(false);
  const [openCheckId, setOpenCheckId] = useState(null);
  const [checkMsg, setCheckMsg] = useState('');
  const [confirmDeleteCheck, setConfirmDeleteCheck] = useState(false);
  const [aiTick, setAiTick] = useState(0);
  const photoInputRef = useRef(null);
  const checkPosRef = useRef(null);       // where the operator stood when they tapped TAKE PHOTO

    const gl = gpsLiveRef.current;

    if (!file || !f) return;

    setCheckMsg('กำลังบันทึกรูป…');
    try {
      await storePhoto(id, await shrinkPhoto(file));
      const prev = checksRef.current.find((c) => c.fieldId === f.id);
      const rec = { id, ts: id, fieldId: f.id, fieldName: f.name, round: f.round || 1,
        lat: pos ? pos.lat : null, lng: pos ? pos.lng : null, acc: pos ? pos.acc : null,

  const askAi = (id) => { aiRetryAtRef.current = 0; patchCheck(id, { aiState: 'queued', aiError: null }); };

    (async () => {
      try {

        patchCheck(next.id, { aiState: 'done', ai, status: ai.status });
        AgrasLog.add('CHECK', `AI ${next.id}: ${ai.status} · ${ai.name} (${ai.confidence})`);
      } catch (err) {
        const m = (err && err.message) || String(err);

  useEffect(() => { if (phase === 'done' || phase === 'boundary' || phase === 'station') setRoutePlan(null); }, [phase]);
  const driveTo = (target, onDone) => {
    const sim = simRef.current;
    const d = dist(sim.pos, target);
    // duration is in "sim seconds of walking" — scaled live against multRef
    // each frame below (not baked in here) so a mid-walk speed change (or a
    // walk that starts already at 20x/60x) takes effect immediately, exactly
    // like the main route-follower's advance() already does.
    manualPathRef.current = { legs: [{ to: { ...target }, dur: Math.max(700, d * SIM_MS_PER_M) }], idx: 0, prog: 0, from: { ...sim.pos }, onDone: onDone || (() => {}) };
  };

  /* main loop */
  useEffect(() => {
    let raf, last = performance.now(), lastTickT = 0, lastStatT = 0, nHeadless = 0, nFrames = 0, lastSpeedFixT = 0;
    // `frame` is the whole per-frame simulation + (optionally) the paint. It runs from
    // requestAnimationFrame while the screen is on, and headlessly straight from each GPS fix
    // while the screen is off / the app is backgrounded (rAF and timers are suspended then).
    const frame = (t, headless) => {
      headless ? nHeadless++ : nFrames++;
      const rawDt = (t - last) / 1000;
      const dt = Math.min(document.hidden ? 5 : 0.1, rawDt); last = t;
      const sim = simRef.current, field = fieldRef.current;
      const ph = phaseRef.current, sm = srcModeRef.current;
      const missionActive = (ph === 'running' || ph === 'paused');

      // Spray time only (the owner's call): the clock runs while spraying, and
      // stops for the walk to the station (TANK EMPTY until REFILLED) and while
      // out of bounds, where nothing is painted either. Wall-clock dt, not the
      // clamped one, so it keeps counting while frames are suspended.
      const sprayingNow = ph === 'running' && opModeRef.current === 'spray' && !oobRef.current;

      if (missionActive && t - lastStatT >= 60000) {
        lastStatT = t;
        AgrasLog.add('STAT', `t=${Math.round(sim.elapsed)}s dist=${Math.round(sim.distance)}m sprayed=${Math.round((sim.sprayedCells + sim.overlapCells) * CELL * CELL)}m2 overlap=${sim.overlapCells} fixes=${sim.fixes.length} headlessFrames=${nHeadless} rafFrames=${nFrames} oob=${oobRef.current} hidden=${document.hidden}`);
        nHeadless = 0; nFrames = 0;
        logBattery('mission');
      }

      // Live pace — an exponential moving average of frame-to-frame movement,
      // mode-agnostic (sim.pos is the single source of truth either way) so
      // it reads real walking speed from GPS fixes and the sim route-follower
      // identically. Decays to 0 at rest, exactly what the Pace widget wants.
      //
      // Except in GPS mode: there the position only moves when a fix lands
      // (about once a second), so a per-frame EMA saw one ~30 m/s spike per
      // fix and near-zero in between, and the HUD read anything from ~20 to
      // ~0.2 km/h depending on when it sampled. GPS pace is measured per fix
      // in the fix branch below; here it only fades once the fixes stop.
      if (missionActive && sm === 'gps') {
        if (t - lastSpeedFixT > 3000) speedEmaRef.current *= 0.9;
      } else if (missionActive) {
        const prevP = prevPosForSpeedRef.current || sim.pos;
        const frameDist = dist(sim.pos, prevP);
        const instMs = dt > 0 ? frameDist / (dt * (sm === 'sim' ? multRef.current : 1)) : 0;

      } else {
        speedEmaRef.current = 0; lastSpeedFixT = 0;
      }
      prevPosForSpeedRef.current = sim.pos;

      // live view while walking a GPS boundary — track the operator as they go
      if (ph === 'boundary') {
        const c = canvasRef.current;
        if (c) {
          if (satelliteOnRef.current && panRef.current) {
            // satellite-assisted plotting: camera is user-driven (drag/zoom),
            // optionally re-centering on the live GPS fix in Follow-Me mode —
            // but never while an active drag gesture is in progress.
            if (followMeRef.current && sm === 'gps' && gpsLiveRef.current.lat != null && !dragRef.current) {
              panRef.current = { ...panRef.current, x: gpsLiveRef.current.x, y: gpsLiveRef.current.y };
            }
            viewRef.current = viewFromCam(panRef.current, c.width, c.height, freeDyRef.current);
          } else if (sm === 'gps') {
            viewRef.current = computeView(c.width, c.height, liveDraftBBox(gpsLiveRef.current.lat != null ? [...draftRef.current, gpsLiveRef.current] : draftRef.current), 5);
          }
        }
      } else if (ph === 'station' && !(satelliteOnRef.current && panRef.current)) {

        const pt = stationDraftRef.current;
        if (c && fr.h > 0 && pt) {
          const b0 = polyBBox(fieldRef.current.poly);
          const bb = { minX: Math.min(b0.minX, pt.x), minY: Math.min(b0.minY, pt.y), maxX: Math.max(b0.maxX, pt.x), maxY: Math.max(b0.maxY, pt.y) };

        // every frame (no rotation, no follow-me/GPS re-centering — those

      if (document.hidden && missionActive && Date.now() - lastSessionSaveRef.current >= HIDDEN_AUTOSAVE_MS && saveSessionRef.current) saveSessionRef.current();
      if (headless || document.hidden) return;

      const cv = canvasRef.current;
      if (cv) {
        let navLine = null;
        const om = opModeRef.current;
        if (ph === 'running' && om === 'toStation') navLine = { from: sim.pos, to: stationRef.current, color: 'rgba(10,82,56,.9)' };
        const lastStop = ph === 'ready' ? lastStopOfActiveField() : null;
        const rp = routePlanRef.current;
        const route = rp && (ph === 'ready' || ph === 'running' || ph === 'paused') ? { ...rp.variants[rp.idx], faint: ph !== 'ready', swath: swathRef.current } : null;
        const gl = gpsLiveRef.current;
        const you = ph === 'ready' && gl.lat != null ? { x: gl.x, y: gl.y } : null;
        const pins = ph === 'ready' ? checkPinsRef.current : null;
        if (lastStop && you) navLine = { from: you, to: lastStop, color: 'rgba(255,255,255,.9)' };

        const vv = viewRef.current, lv = gpsLiveRef.current;

        // time-animated except the station-placement ring), so a running mission repaints at
        // GPS-fix rate instead of 60 fps — a big battery saving.
        const bp = sim.breakpoint;
        const sig = ph === 'station' ? null
          : [ph, cv.width, cv.height, vv.s, vv.ox, vv.oy, vv.angle, draftRef.current.length, lv.lat, lv.lng, lv.accuracy,
             oobRef.current, om, field.area, field.poly.length, stationRef.current.x, stationRef.current.y,
             sim.pos.x, sim.pos.y, sim.heading, sim.fixes.length, sim.sprayedCells, sim.overlapCells, sim.done,
             bp ? bp.x : '', bp ? bp.y : '', gridVersionRef.current, satelliteOnRef.current, tileVersion,
             satelliteOnRef.current && zoomCeilingRef.current, lastStop ? lastStop.x + ',' + lastStop.y : '', route ? rp.idx + ':' + route.segs.length + ':' + route.faint : '', pins ? pins.key : ''].join('|');
        if (sig !== null && sig === lastSigRef.current) return;
        lastSigRef.current = sig || '';
        drawScene(cv.getContext('2d'), cv.width, cv.height, viewRef.current, field, sim, gridCanvasRef.current, stationRef.current, {
          plotting: ph === 'boundary', drafting: draftRef.current,
          live: ph === 'boundary' && sm === 'gps' && gpsLiveRef.current.lat != null ? gpsLiveRef.current : null,
          static: ph === 'ready' || ph === 'boundary',
          oob: oobRef.current, navLine, hideStation: ph === 'boundary', lastStop, you, route, checks: pins ? pins.list : null,
          accuracyRadius: sm === 'gps' && missionActive ? gpsLiveRef.current.accuracy : null,
          satellite: satelliteOnRef.current && unprojectRef.current

            : null
