                        <p className="text-[10px] font-mono text-[#55655F] truncate">
                          {fieldLibrary.length > 0 ? `${fieldLibrary.length} field${fieldLibrary.length === 1 ? '' : 's'} in library` : 'Plot a field, then tap SAVE below'}
                        </p>
                      </>

                  </div>
                  <ChevronDown size={16} className="text-[#0C6B48]/70 -rotate-90 shrink-0" />
                </button>
                <button onClick={startSpraying}
                  className="shrink-0 w-[104px] rounded-xl bg-[#0A5238] text-[#FFFFFF] shadow-[0_5px_0_#063A27] flex flex-col items-center justify-center gap-1.5 px-2 active:translate-y-px">
                  <Play size={22} strokeWidth={2.6} className="fill-current" />
                  <span className="font-display font-extrabold text-[11px] tracking-wide leading-tight text-center">START SPRAYING</span>
                </button>
              </div>

            </div>
          )}
          {(phase === 'running' || phase === 'paused') && (
            <Dock>
              {opMode === 'spray'
                ? <DockBtn icon={Fuel} label="TANK EMPTY" tone="amber" onClick={tankEmpty} disabled={!!manualPathRef.current} />

              <DockBtn icon={running ? Save : Play} label={running ? 'SAVE & PAUSE' : 'RESUME'} tone="teal"
                onClick={() => { if (running) saveSessionNow(); setPhase(running ? 'paused' : 'running'); }} />
              {/* Spec §4A Rule 3: End Mission must NOT be reachable from the
                  live running screen — only once the operator has already
                  paused, to prevent an accidental mid-spray termination. */}
              {phase === 'paused' && <DockBtn icon={Square} label="FINISH" tone="red" onClick={() => setShowFinishChoice(true)} />}
            </Dock>
          )}
        </div>
      </div>

      {chemSheet && (() => {
        const e = activeFieldEntry;
        const memory = loadChemicalMemory().filter((m) => !chemDraft.some((c) => c.name.trim() === m.name));
        const setRow = (i, k, v) => setChemDraft((d) => d.map((c, j) => (j === i ? { ...c, [k]: v } : c)));
        const close = () => setChemSheet(null);
        return (
          <div className="absolute inset-0 z-40 bg-[#F4F1E7]/92 flex items-center justify-center p-4">

              <p className="font-display text-[15px] font-bold tracking-wide">CHEMICALS · ROUND {(e && e.round) || 1}</p>

                  <div key={i} className="flex gap-1.5 items-center">

                    <input value={c.rate} onChange={(ev) => setRow(i, 'rate', ev.target.value)} placeholder="อัตรา" inputMode="decimal" aria-label="Rate per tank"
                      className="w-[56px] min-h-[42px] px-2 rounded-lg bg-[#F4F1E7] border border-[#E2DCC9] text-[12px] font-mono text-[#14201C] placeholder:text-[#4A564F]" />
                    <select value={c.unit} onChange={(ev) => setRow(i, 'unit', ev.target.value)} aria-label="Unit"
                      className="w-[82px] min-h-[42px] px-1.5 rounded-lg bg-[#F4F1E7] border border-[#E2DCC9] text-[12px] text-[#24322C]">
                      {CHEM_UNITS.map((u) => <option key={u} value={u}>{u}/ถัง</option>)}
                    </select>
                    <button onClick={() => setChemDraft((d) => d.filter((_, j) => j !== i))} aria-label="Remove chemical" className="w-9 min-h-[42px] flex items-center justify-center text-[#55655F]"><X size={16} /></button>
                  </div>
                ))}
                <button onClick={() => setChemDraft((d) => [...d, { name: '', rate: '', unit: 'cc' }])}
                  className="min-h-[40px] rounded-lg border border-dashed border-[#C6C0AC] text-[11px] font-mono text-[#55655F] flex items-center justify-center gap-1.5">
                  <Plus size={13} /> ADD CHEMICAL

                <div className="mt-3">

                  <div className="flex flex-wrap gap-1.5">
                    {memory.slice(0, 10).map((m) => (

                    <DockBtn icon={X} label="SKIP" tone="ghost" onClick={() => { saveChemicals([]); close(); reallyStartSpraying(); }} />

                ) : (
                  <>

                    <DockBtn icon={X} label="CANCEL" tone="ghost" onClick={close} />
                  </>
                )}
              </div>
            </div>
          </div>

      })()}

      {showChecks && activeFieldEntry && (() => {
        const f = activeFieldEntry;
        const c = openCheckId != null ? checks.find((x) => x.id === openCheckId) : null;
        const chip = 'px-2.5 py-1 rounded-full text-[12px] font-semibold border ';
        const box = 'mt-3 rounded-xl border border-[#E2DCC9] bg-[#FFFFFF] p-3';
        const label = 'text-[9.5px] tracking-[.14em] uppercase font-mono text-[#55655F] font-bold';
        return (
          <div className="absolute inset-0 z-40 bg-[#F4F1E7] flex flex-col">
            <input ref={photoInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onCheckPhoto} data-check-input />
            <div className="flex items-center justify-between gap-2 px-4 pt-4 pb-3 border-b border-[#E2DCC9]" style={{ paddingTop: 'max(16px, env(safe-area-inset-top))' }}>
              <div className="min-w-0 flex items-center gap-2">
                {c && <button onClick={() => { setOpenCheckId(null); setConfirmDeleteCheck(false); }} aria-label="Back to checks" className="text-[#55655F] p-1 -ml-1"><ChevronLeft size={20} /></button>}
                <div className="min-w-0">
                  <p className="font-display text-[15px] font-bold tracking-wide">CROP CHECK</p>
                  <p className="text-[11px] text-[#55655F] truncate">{f.name} · ครั้งที่ {f.round || 1}</p>
                </div>
              </div>
              <button onClick={() => { setShowChecks(false); setOpenCheckId(null); }} aria-label="Close checks" className="text-[#55655F] p-2"><X size={20} /></button>
            </div>
            {checkMsg && <p className="px-4 pt-2 text-[11px] font-mono text-[#8A5A00]">{checkMsg}</p>}
            {!c ? (
              <div className="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-2">
                {fieldChecks.length === 0 && (
                  <p className="text-[12px] text-[#55655F] text-center mt-8 leading-relaxed">ยังไม่มีการตรวจในรอบนี้<br />เดินไปที่ต้นที่ดูแปลก ๆ แล้วกดถ่ายรูป<br />แอปจะปักหมุดตรงที่คุณยืน</p>
                )}
                {fieldChecks.map((x) => (
                  <button key={x.id} data-check-row onClick={() => { setOpenCheckId(x.id); setConfirmDeleteCheck(false); }}
                    className={'flex items-center gap-3 rounded-xl border p-2.5 text-left ' + (checkWaiting(x) ? 'border-[#E8890C] bg-[#FDF3E3]' : 'border-[#E2DCC9] bg-[#FFFFFF]')}>
                    <CheckPhoto id={x.id} className="w-12 h-12 rounded-lg shrink-0" />
                    <span className="min-w-0 flex-1">
                      <span className="block text-[13px] font-semibold text-[#14201C] truncate">{checkWaiting(x) ? (x.aiState === 'running' ? 'AI กำลังดูรูป…' : 'รอสัญญาณเน็ต') : checkTitle(x)}</span>
                      <span className="block text-[10px] font-mono truncate" style={{ color: checkColor(x) }}>
                        {checkWaiting(x) ? 'WAITING FOR AI' : (CHECK_STATUS_TH[x.status] || '')} · {thTime(x.ts)} · {x.crop}{x.lat == null ? ' · no GPS' : ''}
                      </span>

                    <span className="text-[#55655F]">›</span>
                  </button>
                ))}
              </div>
            ) : (
              <div className="flex-1 overflow-y-auto px-4 py-3">
                <CheckPhoto id={c.id} className="w-full aspect-[4/3] rounded-xl" />
                <p className="mt-3 text-[10px] font-mono font-bold tracking-[.14em]" style={{ color: checkColor(c) }}>
                  {checkWaiting(c) ? 'WAITING FOR AI' : (c.status === 'healthy' ? 'HEALTHY' : c.status === 'unsure' ? 'UNSURE' : 'NEEDS ACTION')} · {c.crop}
                </p>
                <p className="font-display text-[19px] font-bold leading-tight text-[#14201C]">{checkTitle(c)}</p>
                <p className="text-[10.5px] font-mono text-[#55655F] mt-0.5">{thDateTime(c.ts)}{c.lat != null ? ` · GPS ±${Math.round(c.acc || 0)} m` : ' · ไม่มีตำแหน่ง GPS'}</p>
                {c.ai && c.ai.confidence && <p className="text-[12px] text-[#55655F] mt-1">AI มั่นใจ: <b className="text-[#14201C]">{CHECK_CONF_TH[c.ai.confidence]}</b></p>}

                <p className={label + ' mt-4'}>พืช</p>
                <div className="mt-1.5 flex flex-wrap gap-1.5">
                  {CHECK_CROPS.map((k) => (
                    <button key={k} onClick={() => patchCheck(c.id, { crop: k })}
                      className={chip + (c.crop === k ? 'bg-[#0C6B48] border-[#0C6B48] text-[#FFFFFF]' : 'bg-[#FFFFFF] border-[#C6C0AC] text-[#24322C]')}>{k}</button>
                  ))}
                </div>

                {c.aiState === 'running' && <div className="mt-3 rounded-xl border border-[#E8890C] bg-[#FDF3E3] p-3 text-[12.5px]">AI กำลังดูรูป…</div>}
                {c.aiState === 'queued' && (
                  <div className="mt-3 rounded-xl border border-[#E8890C] bg-[#FDF3E3] p-3 text-[12.5px] leading-relaxed">
                    รอสัญญาณเน็ต — AI จะดูให้เองเมื่อมีเน็ต{c.aiError ? <span className="block text-[11px] text-[#8A5A00] mt-0.5">{c.aiError}</span> : null}
                  </div>
                )}
                {c.aiState === 'error' && (
                  <div className="mt-3 rounded-xl border border-[#A5201A]/50 bg-[#FBECEA] p-3 text-[12.5px] leading-relaxed">
                    {c.aiError || 'AI ดูรูปไม่สำเร็จ'}
                  </div>
                )}
                {c.ai && (
                  <>
                    {c.ai.seen && <div className={box.replace('bg-[#FFFFFF]', 'bg-[#F9F7F0]')}><p className={label}>ที่เห็นในรูป</p><p className="text-[13px] mt-1 leading-relaxed">{c.ai.seen}</p></div>}
                    {c.ai.actives.length > 0 && (
                      <div className={box}>
                        <p className={label}>สารสำคัญที่ใช้ได้</p>
                        <div className="mt-2 flex flex-wrap gap-1.5">
                          {c.ai.actives.map((a, i) => <span key={i} className="px-2.5 py-1 rounded-full bg-[#E3F1E9] text-[#0A5238] text-[12px] font-semibold">{a}</span>)}
                        </div>
                        <p className="text-[11px] text-[#8A5A00] mt-2">⚠ อ่านฉลากก่อนใช้ทุกครั้ง · ผลจาก AI อาจผิดได้</p>
                      </div>
                    )}
                    {c.ai.todo.length > 0 && <div className={box}><p className={label}>ควรทำ</p>{c.ai.todo.map((t, i) => <p key={i} className="text-[13px] mt-1 leading-relaxed">• {t}</p>)}</div>}
                  </>
                )}
                {!c.ai && !checkWaiting(c) && (
                  <>
                    <p className={label + ' mt-4'}>ที่พบ</p>
                    <div className="mt-1.5 flex flex-wrap gap-1.5">
                      {['problem', 'unsure', 'healthy'].map((k) => (
                        <button key={k} onClick={() => patchCheck(c.id, { status: k })}
                          className={chip + (c.status === k ? 'text-[#FFFFFF]' : 'bg-[#FFFFFF] border-[#C6C0AC] text-[#24322C]')}
                          style={c.status === k ? { background: checkColor({ status: k }), borderColor: checkColor({ status: k }) } : null}>{CHECK_STATUS_TH[k]}</button>
                      ))}
                    </div>
                  </>
                )}

                <p className={label + ' mt-4'}>โน้ต</p>
                <textarea key={c.id} defaultValue={c.note} rows={2} placeholder="เช่น เจอเป็นหย่อม ๆ ฝั่งติดคลอง (ไม่บังคับ)"
                  onBlur={(e) => { if (e.target.value !== c.note) patchCheck(c.id, { note: e.target.value.trim() }); }}
                  className="mt-1.5 w-full rounded-lg border border-[#C6C0AC] bg-[#FFFFFF] px-3 py-2 text-[13px]" />

                {!c.ai && !checkWaiting(c) && (

                    : <p className="mt-3 text-[11px] text-[#55655F] leading-relaxed">อยากให้ AI ช่วยดูรูป: ใส่ Anthropic API key ในหน้าตั้งค่า (SETTINGS → AI crop check)</p>
                )}

                <div className="mt-4 mb-2 flex gap-2">
                  <button onClick={() => (confirmDeleteCheck ? deleteCheck(c.id) : setConfirmDeleteCheck(true))}

                    {confirmDeleteCheck ? 'TAP AGAIN TO DELETE' : 'DELETE'}
                  </button>
                  <button onClick={() => { setOpenCheckId(null); setConfirmDeleteCheck(false); }} className="flex-[2] min-h-[44px] rounded-xl bg-[#0A5238] text-[#FFFFFF] text-[12px] font-mono font-bold">DONE</button>
                </div>

            {!c && (
              <div className="px-4 pt-2 pb-4 border-t border-[#E2DCC9] bg-[#FFFFFF]" style={{ paddingBottom: 'max(16px, env(safe-area-inset-bottom))' }}>
                <button onClick={takeCheckPhoto} className="w-full min-h-[50px] rounded-xl bg-[#0A5238] text-[#FFFFFF] text-[13px] font-mono font-bold tracking-[.06em] flex items-center justify-center gap-2">
                  <Camera size={18} /> TAKE PHOTO HERE
                </button>
                <p className="mt-1.5 text-[10px] font-mono text-[#55655F] text-center">
                  {gpsInfo ? `pinned where you stand · GPS ±${Math.round(gpsInfo.accuracy || 0)} m` : 'no GPS yet — the photo is kept without a pin'}{aiKey ? ' · AI on' : ''}
                </p>
              </div>
            )}
          </div>
        );
      })()}

      {reportFieldId != null && (() => {
        const f = fieldLibrary.find((x) => x.id === reportFieldId);
        if (!f) return null;
        const rounds = buildFieldReport(f, missions, checks);
        const share = () => {
          const text = fieldReportText(f, rounds);
          const SH = nativePlugin('Share');
          const done = (m) => setReportMsg(m);
          if (SH) Promise.resolve(SH.share({ title: `รายงานการฉีดพ่น · ${f.name}`, text, dialogTitle: 'ส่งรายงาน' })).then(() => done('')).catch(() => done(''));
          else if (navigator.share) navigator.share({ title: f.name, text }).catch(() => {});
          else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => done('คัดลอกรายงานแล้ว')).catch(() => done('คัดลอกไม่สำเร็จ'));
          AgrasLog.add('REPORT', `shared report for field ${f.id} (${rounds.length} rounds)`);
        };
        return (
          <div className="absolute inset-0 z-40 bg-[#F4F1E7] flex flex-col">
            <div className="flex items-center justify-between gap-2 px-4 pt-4 pb-3 border-b border-[#E2DCC9]" style={{ paddingTop: 'max(16px, env(safe-area-inset-top))' }}>
              <div className="min-w-0">
                <p className="font-display text-[15px] font-bold tracking-wide">SPRAY REPORT</p>
                <p className="text-[11px] text-[#55655F] truncate">{f.name} · {(f.areaRai || 0).toFixed(2)} ไร่</p>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button onClick={share} className="min-h-[38px] px-3 rounded-lg bg-[#0C6B48] text-[#FFFFFF] text-[11px] font-bold font-mono">SHARE</button>
                <button onClick={() => setReportFieldId(null)} aria-label="Close report" className="text-[#55655F] p-2"><X size={20} /></button>
              </div>
            </div>
            {reportMsg && <p className="px-4 pt-2 text-[11px] font-mono text-[#0A5238]">{reportMsg}</p>}
            <div className="flex-1 overflow-y-auto px-4 py-3 flex flex-col gap-3">
              {rounds.length === 0 && <p className="text-[12px] text-[#55655F] text-center mt-8">ยังไม่มีการฉีดพ่นในแปลงนี้</p>}
              {rounds.map((r) => (
                <div key={r.n} className={'rounded-xl border p-3.5 ' + (r.done ? 'border-[#E2DCC9] bg-[#FFFFFF]' : 'border-[#0C6B48]/40 bg-[#E3F1E9]/60')}>
                  <div className="flex items-center justify-between">
                    <p className="font-display text-[15px] font-bold">ครั้งที่ {r.n}</p>
                    <span className={'text-[10px] font-mono font-bold px-2 py-0.5 rounded-full ' + (r.done ? 'text-[#0A5238] border border-[#0A5238]/40' : 'text-[#8A4B06] border border-[#8A4B06]/40')}>{r.done ? 'พ่นเสร็จแล้ว' : 'ยังไม่เสร็จ'}</span>
                  </div>
                  <dl className="mt-2 grid grid-cols-[88px_1fr] gap-y-1 text-[11.5px]">
                    <dt className="text-[#55655F]">เริ่มพ่น</dt><dd className="text-[#14201C]">{thDateTime(r.start)}</dd>
                    <dt className="text-[#55655F]">พ่นเสร็จ</dt><dd className="text-[#14201C]">{r.done ? thDateTime(r.end) : '—'}</dd>
                    <dt className="text-[#55655F]">พื้นที่ที่พ่น</dt><dd className="text-[#14201C]">{(r.rai || 0).toFixed(2)} ไร่</dd>
                    <dt className="text-[#55655F]">สารที่ใช้</dt>
                    <dd className="text-[#14201C]">{r.chemicals && r.chemicals.length ? r.chemicals.map((c, i) => <span key={i} className="block">• {chemLine(c)}</span>) : <span className="text-[#4A564F]">ไม่ได้ระบุ</span>}</dd>
                  </dl>
                  {r.sessions.length > 0 && (
                    <div className="mt-2.5 pt-2.5 border-t border-[#E2DCC9]">
                      <p className="text-[10px] text-[#55655F] mb-1">สภาพอากาศแต่ละรอบที่พ่น</p>
                      {r.sessions.map((x, i) => (
                        <p key={i} className="text-[11px] text-[#24322C] leading-relaxed">
                          <span className="font-medium text-[#14201C]">{thDate(x.start)} {thTime(x.start)}–{thTime(x.end)}</span>{x.operator ? ` · ${x.operator}` : ''}<br />
                          <span className="text-[#55655F]">{weatherLine(x.weather, x.note)}</span>
                        </p>
                      ))}
                    </div>
                  )}
                  {r.checks && r.checks.length > 0 && (
                    <div className="mt-2.5 pt-2.5 border-t border-[#E2DCC9]">
                      <p className="text-[10px] text-[#55655F] mb-1">ตรวจสุขภาพพืช</p>
                      {r.checks.map((c) => (
                        <div key={c.id} className="flex gap-2 items-start mb-1.5">
                          <CheckPhoto id={c.id} className="w-10 h-10 rounded-md shrink-0" />
                          <p className="text-[11px] leading-snug min-w-0">
                            <span className="font-medium text-[#14201C]">{thDate(c.ts)} {thTime(c.ts)} · {checkTitle(c)}</span><br />
                            <span className="text-[#55655F]">{checkDetail(c)}</span>
                          </p>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>
        );
      })()}

      {showFinishChoice && phase === 'paused' && (() => {
        const e = activeFieldId ? fieldLibrary.find((f) => f.id === activeFieldId) : null;
        const round = (e && e.round) || 1;
        const choose = (kind) => { finishKindRef.current = kind; setShowFinishChoice(false); finishMission(); };
        return (
          <div className="absolute inset-0 z-30 bg-[#F4F1E7]/90 flex items-center justify-center p-4">
            <div className="w-full max-w-[360px] rounded-2xl bg-[#FFFFFF] border border-[#E2DCC9] p-4">
              <p className="font-display text-[15px] font-bold tracking-wide">FINISH · ROUND {round}</p>
              <p className="text-[10.5px] text-[#55655F] mt-0.5">{e ? e.name : 'This field'} · {coveragePct.toFixed(0)}% sprayed this round</p>
              <div className="mt-4 flex flex-col gap-2.5">
                <DockBtn icon={CheckCircle2} label={`FIELD DONE · CLOSE ROUND ${round}`} tone="green" big onClick={() => choose('complete')} />
                <p className="text-[10px] text-[#55655F] -mt-1 px-1">Next time this field starts round {round + 1} on an empty map.</p>
                <DockBtn icon={Save} label="NOT DONE · CONTINUE LATER" tone="teal" big onClick={() => choose('partial')} />
                <p className="text-[10px] text-[#55655F] -mt-1 px-1">Round {round} stays open; its sprayed area is kept for next time.</p>
                <DockBtn icon={X} label="CANCEL" tone="ghost" onClick={() => setShowFinishChoice(false)} />
              </div>
            </div>
          </div>

      })()}

      {phase === 'done' && (
        <div className="absolute inset-0 z-20 bg-[#F4F1E7]/80 flex items-center justify-center p-4">
          <div className="w-full max-w-[380px] rounded-2xl bg-[#FFFFFF] border border-[#E2DCC9] overflow-hidden max-h-[92vh] overflow-y-auto">
            <div className="flex items-start justify-between px-4 pt-4 pb-2">
              <div>
                <p className="font-display text-[16px] font-bold tracking-wide">MISSION SUMMARY</p>
                <p className="text-[10.5px] text-[#55655F]">
                  {finishInfo ? (finishInfo.complete ? `Round ${finishInfo.round} · field done` : `Round ${finishInfo.round} · continue later`) : 'Spray mission complete'}
                </p>
              </div>

              <div className="h-[160px] rounded-xl overflow-hidden bg-[#F4F1E7] border border-[#E2DCC9]">
                <MiniMap field={field} sim={sim} gridCanvas={gridCanvasRef.current} station={stationRef.current} />
              </div>
            </div>
            <dl className="grid grid-cols-2 gap-px bg-[#E2DCC9] mt-2">
              {[
                ['SPRAY TIME', fmtTime(sim.elapsed), `pace ${speedMs.toFixed(2)} m/s`],
                ['DISTANCE', `${sim.distance.toFixed(0)} m`, `swath ${swath.toFixed(1)} m`],
                ['AREA SPRAYED', `${mRai.rai}-${mRai.ngan}-${mRai.wa} rai`, `${mRaiDec.toFixed(2)} rai · ${mArea.toFixed(0)} m²${cbase.sprayed > 0 ? ` · field ${coveragePct.toFixed(0)}% done` : ''}`],
                // Spec §4D "Metrics Rule": physical quantities, not bare percentages.
                ['OVERLAPPED', `${mOverlapRai.toFixed(2)} rai`, overlapSub],
                ['MISSED SPOTS', `${missedRai.toFixed(2)} rai`, missedCellsCount > 0 ? 'flagged red on the map' : 'none flagged'],
                ['TANKS USED', `${tanksUsed}`, `${tankCapacity}L tank${avgTankRai != null ? ` · avg ${avgTankRai.toFixed(2)} rai/tank` : ''}`]
              ].map(([label, val, sub]) => (
                <div key={label} className="bg-[#FFFFFF] p-3">
                  <dt className="text-[9px] tracking-[.12em] font-mono text-[#55655F]">{label}</dt>
                  <dd className="font-mono tnum text-[16px] font-bold mt-1 leading-snug">{val}</dd>
                  <p className="text-[9.5px] text-[#55655F] mt-1">{sub}</p>
                </div>
              ))}
            </dl>
            <div className="p-3 flex flex-col gap-2.5">
              <p className="flex items-center justify-center gap-1.5 text-[10.5px] font-mono text-[#0A5238]">
                <Check size={13} /> Saved to mission history
              </p>
              <DockBtn icon={RotateCcw} label="START NEW" tone="teal" onClick={goHomeFromSummary} />
            </div>
          </div>
        </div>
      )}

      {showHistory && (() => {
        const selected = missions.find((m) => m.id === selectedMissionId) || null;
        const totalRai = missions.reduce((a, m) => a + m.raiDec, 0);
        const totalDist = missions.reduce((a, m) => a + m.distance, 0);
        return (
          <div className="absolute inset-0 z-20 bg-[#F4F1E7] flex flex-col">
            <div className="shrink-0 flex items-center justify-between px-4 py-3.5 border-b border-[#E2DCC9]"
                 style={{ paddingTop: 'max(14px, env(safe-area-inset-top))' }}>
              <div className="flex items-center gap-2.5 min-w-0">
                {selected ? (
                  <button onClick={() => setSelectedMissionId(null)} className="text-[#0C6B48] p-1 -ml-1"><ChevronLeft size={20} /></button>
                ) : <History size={17} className="text-[#0C6B48]" />}
                <div className="min-w-0">
                  <p className="font-display text-[15px] font-bold tracking-wide truncate">{selected ? fmtDate(selected.ts) : 'MISSION HISTORY'}</p>
                  {!selected && <p className="text-[9.5px] text-[#55655F] font-mono">Mission history · {missions.length} logged · {totalRai.toFixed(2)} rai all-time</p>}
                </div>
              </div>
              <button onClick={() => { setShowHistory(false); setSelectedMissionId(null); setConfirmClear(false); }} className="text-[#55655F] p-1 shrink-0"><X size={20} /></button>
            </div>

            <div className="flex-1 overflow-y-auto px-4 py-3">
              {!selected && missions.length === 0 && (
                <div className="h-full flex flex-col items-center justify-center text-center gap-2 pb-16">
                  <History size={28} className="text-[#C6C0AC]" />
                  <p className="text-[12.5px] text-[#55655F]">No missions saved yet.</p>
                  <p className="text-[10.5px] text-[#4A564F] max-w-[220px]">Finish a spraying run and tap Save Session to log it here.</p>
                </div>
              )}

              {!selected && missions.length > 0 && (
                <div className="flex flex-col gap-2.5">
                  {missions.map((m) => (
                    <button key={m.id} onClick={() => setSelectedMissionId(m.id)}
                      className="flex gap-3 items-stretch bg-[#FFFFFF] border border-[#E2DCC9] rounded-xl overflow-hidden text-left">
                      <div className="w-[104px] shrink-0 bg-[#F4F1E7]">
                        {m.thumb ? <img src={m.thumb} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center"><MapPinned size={16} className="text-[#C6C0AC]" /></div>}
                      </div>
                      <div className="flex-1 min-w-0 py-2.5 pr-3 flex flex-col justify-between">
                        <div>
                          <p className="font-mono text-[10px] text-[#55655F] truncate">{fmtDate(m.ts)}{m.round ? ` · ${m.fieldName ? m.fieldName + ' · ' : ''}round ${m.round}${m.complete ? ' ✓' : ' · open'}` : ''}</p>
                          <p className="font-mono tnum text-[15px] font-bold text-[#0A5238] mt-0.5">{m.rai}-{m.ngan}-{m.wa} rai</p>
                        </div>
                        <div className="flex items-center gap-3 text-[9.5px] font-mono text-[#55655F] mt-1">
                          <span>{m.distance.toFixed(0)} m</span>
                          <span>{fmtTime(m.elapsed)}</span>
                          <span className={m.overlapRate > 15 ? 'text-[#8A4B06]' : ''}>{m.overlapRate.toFixed(0)}% overlap</span>
                        </div>
                      </div>
                    </button>
                  ))}
                </div>
              )}

              {selected && (
                <div className="flex flex-col gap-3">
                  <div className="h-[190px] rounded-xl overflow-hidden bg-[#F4F1E7] border border-[#E2DCC9]">
                    {selected.thumb ? <img src={selected.thumb} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full flex items-center justify-center text-[#C6C0AC] text-[11px]">No coverage image saved</div>}
                  </div>
                  <dl className="grid grid-cols-2 gap-px bg-[#E2DCC9] rounded-xl overflow-hidden">
                    {[
                      ['SPRAY TIME', fmtTime(selected.elapsed), `field ${selected.fieldRai.toFixed(2)} rai`],
                      ['DISTANCE', `${selected.distance.toFixed(0)} m`, `swath ${selected.swath.toFixed(1)} m`],
                      ['AREA SPRAYED', `${selected.rai}-${selected.ngan}-${selected.wa} rai`, `${selected.raiDec.toFixed(2)} rai · ${selected.areaSprayed.toFixed(0)} m²`],
                      ['OVERLAPPED', `${(selected.overlapRai ?? 0).toFixed(2)} rai`, `${(selected.overlapRate ?? 0).toFixed(0)}% of sprayed area`],
                      ['MISSED SPOTS', `${(selected.missedRai ?? 0).toFixed(2)} rai`, selected.tanks != null ? `${selected.tanks} tank${selected.tanks === 1 ? '' : 's'} used` : `${selected.litres.toFixed(1)} L used total`]
                    ].map(([label, val, sub]) => (
                      <div key={label} className="bg-[#FFFFFF] p-3">
                        <dt className="text-[9px] tracking-[.12em] font-mono text-[#55655F]">{label}</dt>
                        <dd className="font-mono tnum text-[16px] font-bold mt-1 leading-snug">{val}</dd>
                        <p className="text-[9.5px] text-[#55655F] mt-1">{sub}</p>
                      </div>
                    ))}
                  </dl>
                  {/* Compliance log (Spec §5: PPE, user, weather). Older
                      history entries saved before this existed simply have
                      no checklist object, so the section is skipped rather
                      than showing false "unchecked" state. */}
                  {selected.checklist && (
                    <div className="rounded-xl border border-[#E2DCC9] bg-[#FFFFFF] p-3">
                      <p className="text-[9px] tracking-[.12em] font-mono text-[#55655F] mb-2">COMPLIANCE LOG</p>
                      <div className="flex flex-wrap gap-1.5 mb-2">
                        {[['ppe', 'PPE'], ['mixedRate', 'Mix rate'], ['nozzle', 'Nozzle'], ['wind', 'Wind']].map(([k, label]) => (
                          <span key={k} className={'text-[10px] font-mono px-2 py-1 rounded-full border ' + (selected.checklist[k] ? 'border-[#0C6B48]/50 text-[#0C6B48]' : 'border-[#E2DCC9] text-[#4A564F]')}>
                            {selected.checklist[k] ? '✓ ' : '— '}{label}
                          </span>
                        ))}
                      </div>
                      <p className="text-[10.5px] font-mono text-[#55655F]">
                        Operator: {selected.operator ? selected.operator : '—'} · Weather: {selected.weather ? selected.weather : '—'}
                      </p>
                      {selected.weatherApi && (
                        <p className="text-[10.5px] font-mono text-[#4A564F] mt-1">
                          Live reading: {selected.weatherApi.windKmh != null ? `${Math.round(selected.weatherApi.windKmh)} km/h wind` : 'wind —'}
                          {selected.weatherApi.rainSoonProb != null ? `, ${Math.round(selected.weatherApi.rainSoonProb)}% rain (3h)` : ''}
                          {' '}(Open-Meteo)
                        </p>
                      )}
                    </div>
                  )}
                </div>
              )}
            </div>

            {!selected && missions.length > 0 && (
              <div className="shrink-0 p-3 border-t border-[#E2DCC9] flex flex-col gap-2" style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
                <p className="text-center text-[9.5px] font-mono text-[#4A564F]">{totalDist.toFixed(0)} m walked all-time</p>
                <div className="grid grid-cols-2 gap-2.5">
                  <DockBtn icon={Download} label="EXPORT CSV" tone="ghost" onClick={exportHistoryCSV} />
                  <DockBtn icon={Trash2} label={confirmClear ? 'TAP TO CONFIRM' : 'CLEAR HISTORY'} tone={confirmClear ? 'red' : 'dim'} onClick={clearHistory} />
                </div>
              </div>
            )}
          </div>
        );
      })()}

      {/* Field Selector Modal — the Field Library, a full-screen list of
          named saved boundaries+stations, distinct from Mission History. */}
      {showFieldLibrary && (
        <div className="absolute inset-0 z-20 bg-[#F4F1E7] flex flex-col">
          <div className="shrink-0 flex items-center justify-between px-4 py-3.5 border-b border-[#E2DCC9]"
               style={{ paddingTop: 'max(14px, env(safe-area-inset-top))' }}>
            <div className="flex items-center gap-2.5 min-w-0">
              <MapPinned size={17} className="text-[#0C6B48] shrink-0" />
              <div className="min-w-0">
                <p className="font-display text-[15px] font-bold tracking-wide truncate">FIELD LIBRARY</p>
                <p className="text-[9.5px] text-[#55655F] font-mono">Saved field library · {fieldLibrary.length} saved</p>
              </div>
            </div>
            <button onClick={() => { setShowFieldLibrary(false); setConfirmDeleteFieldId(null); }} className="text-[#55655F] p-1 shrink-0"><X size={20} /></button>
          </div>
          <div className="shrink-0 px-4 pt-3 flex">
            <DockBtn icon={Plus} label="ADD FIELD" tone="teal" onClick={() => { setShowFieldLibrary(false); setConfirmDeleteFieldId(null); startPlotting(null); }} />
          </div>
          <div className="flex-1 overflow-y-auto px-4 py-3">
            {fieldLibrary.length === 0 ? (
              <div className="h-full flex flex-col items-center justify-center gap-2 text-center px-6">
                <MapPinned size={28} className="text-[#C6C0AC]" />
                <p className="text-sm text-[#55655F]">No fields saved yet</p>
                <p className="text-xs text-[#4A564F]">Plot or load a field, then tap SAVE from the ready screen to keep it here.</p>
              </div>
            ) : (
              <div className="flex flex-col gap-2">
                {fieldLibrary.map((f) => {
                  const r = toRai(f.areaSqm != null ? f.areaSqm : f.areaRai * 1600);
                  const isActive = f.id === activeFieldId;
                  const isRenaming = renamingFieldId === f.id;
                  return (
                    <div key={f.id} className={'rounded-xl bg-[#FFFFFF] border p-3 flex flex-col gap-2 ' + (isActive ? 'border-[#0C6B48]' : 'border-[#E2DCC9]')}>
                      <div className="flex items-center gap-2.5">
                        {isRenaming ? (
                          <div className="flex-1 min-w-0 flex items-center gap-1.5">
                            <input autoFocus value={renameDraft} onChange={(e) => setRenameDraft(e.target.value)}
                              onKeyDown={(e) => { if (e.key === 'Enter') renameFieldInLibrary(f.id, renameDraft); if (e.key === 'Escape') setRenamingFieldId(null); }}
                              className="flex-1 min-w-0 min-h-[38px] px-2.5 rounded-lg bg-[#F4F1E7] border border-[#0C6B48] text-[#24322C] text-sm font-sans outline-none" />
                            <button onClick={() => renameFieldInLibrary(f.id, renameDraft)} className="shrink-0 min-h-[38px] px-2.5 rounded-lg bg-[#0C6B48] text-[#FFFFFF] flex items-center justify-center"><Check size={15} /></button>
                          </div>
                        ) : (
                          <button onClick={() => { loadFieldFromLibrary(f); setShowFieldLibrary(false); }} className="flex-1 min-w-0 text-left">
                            <span className="flex items-center gap-1.5">
                              {isActive && <Star size={11} className="text-[#0C6B48] fill-[#0C6B48] shrink-0" />}
                              <p className="font-display text-sm font-bold truncate">{f.name}</p>
                            </span>
                            <p className="text-[10px] font-mono text-[#55655F] mt-0.5 truncate">
                              {r.rai}-{r.ngan}-{r.wa} rai · {f.lastSprayedTs ? `sprayed ${fmtDate(f.lastSprayedTs)}` : `created ${fmtDate(f.ts)}`}{f.gpsAnchored ? ' · GPS-anchored' : ''}
                            </p>
                            {f.cov ? (
                              <p className="text-[10px] font-mono text-[#0A5238] mt-0.5 truncate">
                                round {f.round || 1} · sprayed {Math.min(100, (f.cov.sprayedCells * CELL * CELL) / (f.areaSqm != null ? f.areaSqm : f.areaRai * 1600) * 100).toFixed(0)}% · {(f.cov.sprayedCells * CELL * CELL / 1600).toFixed(2)} rai{f.stats ? ` · ${f.stats.missions} mission${f.stats.missions === 1 ? '' : 's'}` : ''}
                              </p>
                            ) : <p className="text-[10px] font-mono text-[#4A564F] mt-0.5">round {f.round || 1} · not started{(f.rounds && f.rounds.length) ? ` · ${f.rounds.length} round${f.rounds.length === 1 ? '' : 's'} done` : ''}</p>}
                          </button>
                        )}
                        {!isRenaming && (
                          <button onClick={() => { setRenamingFieldId(f.id); setRenameDraft(f.name); }}
                            className="shrink-0 min-h-[38px] px-2.5 rounded-lg flex items-center justify-center text-[#55655F]">
                            <Pencil size={14} />
                          </button>
                        )}
                        <button onClick={() => (confirmDeleteFieldId === f.id ? deleteFieldFromLibrary(f.id) : setConfirmDeleteFieldId(f.id))}
                          className={'shrink-0 min-h-[38px] px-2.5 rounded-lg flex items-center justify-center ' + (confirmDeleteFieldId === f.id ? 'bg-[#A5201A] text-[#FFFFFF]' : 'text-[#55655F]')}>
                          {confirmDeleteFieldId === f.id ? <span className="text-[9px] font-mono font-bold px-0.5">CONFIRM</span> : <Trash2 size={15} />}
                        </button>
                      </div>
                      {!isRenaming && (
                        <button onClick={() => { loadFieldFromLibrary(f); setShowFieldLibrary(false); }}
                          disabled={isActive}
                          className={'min-h-[36px] rounded-lg text-[9.5px] font-mono font-bold tracking-wide flex items-center justify-center gap-1.5 ' + (isActive ? 'bg-[#0C6B48]/15 text-[#0C6B48] border border-[#0C6B48]/30' : 'bg-[#F4F1E7] text-[#24322C] border border-[#C6C0AC]')}>
                          {isActive ? <><Star size={11} className="fill-[#0C6B48]" /> ACTIVE FIELD</> : 'SET AS ACTIVE FIELD'}
                        </button>
                      )}
                      {!isRenaming && (
                        <button onClick={() => { setReportMsg(''); setReportFieldId(f.id); }}
                          className="min-h-[36px] rounded-lg text-[9.5px] font-mono font-bold tracking-wide flex items-center justify-center gap-1.5 bg-[#F4F1E7] text-[#0C6B48] border border-[#0C6B48]/40">
                          <History size={12} /> REPORT
                        </button>
                      )}
                      {!isRenaming && f.cov && (
                        <button onClick={() => { if (confirmResetCovId === f.id) resetFieldCoverage(f.id); else { setConfirmResetCovId(f.id); setTimeout(() => setConfirmResetCovId((c) => (c === f.id ? null : c)), 5000); } }}
                          className={'min-h-[34px] rounded-lg text-[9.5px] font-mono font-bold tracking-wide border ' + (confirmResetCovId === f.id ? 'bg-[#8A4B06] text-[#FFFFFF] border-[#8A4B06]' : 'border-[#C6C0AC] text-[#55655F]')}>
                          {confirmResetCovId === f.id ? 'TAP AGAIN — CLEAR SPRAYED AREA' : 'RESET SPRAYED AREA'}
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
          <div className="shrink-0 px-4 pt-2" style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
            <button onClick={() => { if (confirmResetAll) resetAllSavedData(); else { setConfirmResetAll(true); setTimeout(() => setConfirmResetAll(false), 6000); } }}
              className={'w-full min-h-[46px] rounded-xl text-[10.5px] font-mono font-bold tracking-wide border ' + (confirmResetAll ? 'bg-[#A5201A] text-[#FFFFFF] border-[#A5201A]' : 'border-[#A5201A]/50 text-[#A5201A]')}>
              {confirmResetAll ? 'TAP AGAIN — ERASE ALL FIELDS, SPRAYED AREAS & HISTORY' : 'RESET ALL SAVED DATA'}
            </button>
          </div>
        </div>
      )}

      {/* Save-current-field prompt — names the field before it lands in the library above. */}
      {showSaveField && (
        <div className="absolute inset-0 z-30 bg-[#F4F1E7]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[340px] rounded-2xl bg-[#FFFFFF] border border-[#E2DCC9] p-4">
            <p className="font-display text-[15px] font-bold tracking-wide">{namingNewField ? 'NAME THIS FIELD' : 'RENAME FIELD'}</p>
            <p className="text-[10.5px] text-[#55655F] mt-0.5 mb-3">
              {namingNewField ? 'Field saved · ' : ''}{(() => { const r = toRai(fieldRef.current.area); return `${r.rai}-${r.ngan}-${r.wa} rai`; })()}{namingNewField ? ' · SKIP keeps the date name' : ''}
            </p>
            <input autoFocus={!namingNewField} value={saveFieldName} onChange={(e) => setSaveFieldName(e.target.value)} aria-label="Field name"
              onFocus={(e) => { if (namingNewField) e.target.select(); }}
              placeholder="e.g. Soybean Field 1"
              className="w-full min-h-[46px] px-3 rounded-lg bg-[#F4F1E7] border border-[#C6C0AC] text-[#24322C] text-sm font-sans placeholder:text-[#4A564F] outline-none focus:border-[#0C6B48]" />
            <div className="grid grid-cols-2 gap-2.5 mt-4">
              <DockBtn icon={X} label={namingNewField ? 'SKIP' : 'CANCEL'} tone="ghost" onClick={() => { setShowSaveField(false); setNamingNewField(false); }} />
              <DockBtn icon={Save} label="SAVE" tone="teal" disabled={!saveFieldName.trim()}
                onClick={() => { if (activeFieldIdRef.current) renameFieldInLibrary(activeFieldIdRef.current, saveFieldName); setShowSaveField(false); setNamingNewField(false); }} />
            </div>
          </div>
        </div>
      )}

      {/* Spray Settings sheet — everything the compact summary row on the
          ready screen used to show fully expanded (Tank/Rate steppers +
          swath picker), now tucked behind one tap since most visits need
          zero changes here (see loadLastSettings/saveLastSettings). */}
      {showSpraySettings && (
        <div className="absolute inset-0 z-30 bg-[#F4F1E7]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[360px] rounded-2xl bg-[#FFFFFF] border border-[#E2DCC9] p-4 max-h-[92vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <p className="font-display text-[15px] font-bold tracking-wide">SETTINGS</p>
              <button onClick={() => setShowSpraySettings(false)} className="text-[#55655F] p-1"><X size={18} /></button>
            </div>
            <p className="text-[10.5px] text-[#55655F] mt-0.5 mb-3">Tank size and nozzle width · remembered for next time</p>
            <Glass className="px-2 py-2 flex flex-col gap-1">
              <Stepper label="Tank" value={tankCapacity} unit="L" step={1} min={1} max={60} onChange={setTankCapacity} />
              <Stepper label="Width" value={swath} unit="m" dec={1} step={0.1} min={0.5} max={10} onChange={(w) => { setSwath(w); resetSim(w); }} />
              <Stepper label="Edge gap" value={edgeGap} unit="m" dec={1} step={0.5} min={0} max={10} onChange={setEdgeGap} />
            </Glass>
            {(() => {
              const items = [
                ['ppe', 'PPE worn'],
                ['mixedRate', 'Mix rate OK'],
                ['nozzle', 'Nozzle checked'],
                ['wind', 'Wind checked'],
              ];
              const checkedCount = items.filter(([k]) => checklist[k]).length;
              const uncheckedCount = items.length - checkedCount;
              const wx = sprayWeather;
              const wxRisk = !!(wx && (wx.windWarning || wx.rainNowWarning || wx.rainSoonWarning));
              const applyWeatherReading = () => {
                if (!wx) return;
                const parts = [];
                if (wx.windKmh != null) parts.push(`Wind ${Math.round(wx.windKmh)} km/h`);
                if (wx.rainSoonProb != null) parts.push(`Rain ${Math.round(wx.rainSoonProb)}%`);
                setChecklist((c) => {
                  const next = { ...c, wind: true, weather: parts.join(', ') };
                  saveChecklist(next);
                  return next;
                });
              };
              return (
                <div className="mt-3 rounded-xl border border-[#E2DCC9] bg-[#F4F1E7]">
                  <button disabled
                    className="w-full flex items-center justify-between gap-2 px-3.5 py-3 min-h-[44px]">
                    <span className="flex items-center gap-2 min-w-0">
                      <span className="text-[9.5px] tracking-[.14em] uppercase font-mono text-[#4A564F] shrink-0">Pre-flight checklist</span>
                      <span className={'text-[10px] font-mono shrink-0 ' + (uncheckedCount > 0 ? 'text-[#55655F]' : 'text-[#0A5238]')}>{uncheckedCount > 0 ? `${uncheckedCount} item${uncheckedCount === 1 ? '' : 's'} unchecked` : 'All checked'}</span>
                      {wxRisk && <AlertTriangle size={12} className="text-[#9A560A] shrink-0" />}
                    </span>
                  </button>
                  {(
                    <div className="px-3.5 pb-3.5">
                      <div className="grid grid-cols-2 gap-1.5">
                        {items.map(([k, label]) => (
                          <button key={k} onClick={() => toggleChecklistItem(k)}
                            className={'flex items-center gap-1.5 min-h-[40px] px-2.5 rounded-lg border text-[11px] font-mono text-left ' + (checklist[k] ? 'border-[#0C6B48]/50 bg-[#0C6B48]/10 text-[#0C6B48]' : 'border-[#E2DCC9] text-[#55655F]')}>
                            {checklist[k] ? <Check size={13} className="shrink-0" /> : <span className="w-[13px] h-[13px] rounded-[3px] border border-current shrink-0" />}
                            <span className="truncate">{label}</span>
                          </button>
                        ))}
                      </div>

                      {/* Live wind/rain (Open-Meteo) — a convenience layer on top of the
                          Wind-checked toggle above, never a gate on its own. Only shows
                          once the field has a real-world GPS anchor; SIM-only fields with
                          no anchor fall back to the manual toggle + text input exactly as
                          before. */}
                      {sprayWeatherStatus === 'loading' && (
                        <div className="mt-1.5 flex items-center gap-1.5 text-[10px] font-mono text-[#55655F] px-0.5">
                          <Wind size={12} className="shrink-0 animate-pulse" /> Checking live wind/rain…
                        </div>
                      )}
                      {sprayWeatherStatus === 'error' && (
                        <div className="mt-1.5 flex items-center gap-1.5 text-[10px] font-mono text-[#4A564F] px-0.5">
                          <CloudRain size={12} className="shrink-0" /> Live wind/rain unavailable — check manually
                        </div>
                      )}
                      {sprayWeatherStatus === 'ok' && wx && (
                        <button onClick={applyWeatherReading}
                          className={'mt-1.5 w-full flex items-center gap-2 px-2.5 py-2 rounded-lg border text-left '
                            + (wxRisk ? 'border-[#9A560A]/50 bg-[#9A560A]/10' : 'border-[#E2DCC9] bg-[#F4F1E7]')}>
                          <Wind size={14} className={'shrink-0 ' + (wx.windWarning ? 'text-[#9A560A]' : 'text-[#55655F]')} />
                          <span className={'text-[11px] font-mono shrink-0 ' + (wx.windWarning ? 'text-[#9A560A]' : 'text-[#24322C]')}>
                            {wx.windKmh != null ? `${Math.round(wx.windKmh)} km/h` : '—'}
                            {wx.gustKmh != null && wx.gustKmh > (wx.windKmh || 0) + 5 ? ` (gust ${Math.round(wx.gustKmh)})` : ''}
                          </span>
                          <CloudRain size={14} className={'shrink-0 ' + ((wx.rainNowWarning || wx.rainSoonWarning) ? 'text-[#9A560A]' : 'text-[#55655F]')} />
                          <span className={'text-[11px] font-mono flex-1 min-w-0 truncate ' + ((wx.rainNowWarning || wx.rainSoonWarning) ? 'text-[#9A560A]' : 'text-[#24322C]')}>
                            {wx.rainNowWarning ? 'Raining now' : (wx.rainSoonProb != null ? `${Math.round(wx.rainSoonProb)}% next 3h` : '—')}
                          </span>
                          <span className="text-[9px] font-mono text-[#4A564F] shrink-0">TAP TO USE</span>
                        </button>
                      )}
                      {sprayWeatherStatus === 'ok' && wxRisk && (
                        <p className="mt-1 px-0.5 text-[10.5px] leading-snug text-[#9A560A]">
                          {wx.rainNowWarning ? 'Raining now: the spray will wash off.'
                            : wx.rainSoonWarning ? 'Rain likely within 3 hours: the spray may wash off.'
                            : 'Strong wind: the spray will drift.'}
                        </p>
                      )}

                      <div className="grid grid-cols-2 gap-1.5 mt-1.5">
                        <input value={checklist.operator} onChange={(e) => setChecklistField('operator', e.target.value)}
                          placeholder="Operator name" maxLength={40}
                          className="min-h-[36px] px-2.5 rounded-lg bg-[#F4F1E7] border border-[#E2DCC9] text-[11px] font-mono text-[#24322C] placeholder:text-[#4A564F]" />
                        <input value={checklist.weather} onChange={(e) => setChecklistField('weather', e.target.value)}
                          placeholder="Weather (e.g. calm, 28°C)" maxLength={40}
                          className="min-h-[36px] px-2.5 rounded-lg bg-[#F4F1E7] border border-[#E2DCC9] text-[11px] font-mono text-[#24322C] placeholder:text-[#4A564F]" />
                      </div>
                    </div>
                  )}
                </div>
              );
            })()}
            {activeFieldEntry && (
              <button onClick={() => { const m = activeFieldEntry.roundMeta || {}; setChemDraft(m.chemicals && m.chemicals.length ? m.chemicals.map((c) => ({ ...c })) : [{ name: '', rate: '', unit: 'cc' }]); setChemSheet('edit'); }}
                className="mt-3 w-full flex items-center justify-between gap-2 text-left rounded-xl border border-[#E2DCC9] bg-[#F4F1E7] px-3.5 py-2.5 min-h-[48px]">
                <span className="min-w-0">
                  <span className="block text-[9.5px] tracking-[.14em] uppercase font-mono text-[#4A564F]">Chemicals · round {activeFieldEntry.round || 1}</span>
                  <span className="block text-[11px] font-mono text-[#24322C] truncate">
                    {activeFieldEntry.roundMeta && activeFieldEntry.roundMeta.chemicals && activeFieldEntry.roundMeta.chemicals.length
                      ? activeFieldEntry.roundMeta.chemicals.map(chemLine).join(' · ') : 'ยังไม่ได้ระบุสาร — แตะเพื่อใส่'}
                  </span>
                </span>
                <Pencil size={14} className="text-[#0C6B48] shrink-0" />
              </button>
            )}
            <p className="mt-4 mb-1 text-[9.5px] tracking-[.14em] uppercase font-mono text-[#4A564F]">Field</p>
            <div className="flex flex-col gap-2">
              <Dock>
                <DockBtn icon={MapPinned} label={activeFieldEntry ? 'EDIT BOUNDARY' : 'PLOT FIELD'} tone="ghost" onClick={() => { setShowSpraySettings(false); startPlotting(activeFieldEntry ? activeFieldEntry.id : null); }} />
                <DockBtn icon={Droplet} label="STATION" tone="ghost" onClick={() => { setShowSpraySettings(false); startStationSetup(); }} />
              </Dock>
              <Dock>
                <DockBtn icon={Pencil} label="RENAME FIELD" tone="ghost" big disabled={!activeFieldEntry}
                  onClick={() => { setShowSpraySettings(false); setSaveFieldName(activeFieldEntry ? activeFieldEntry.name : ''); setShowSaveField(true); }} />
              </Dock>
            </div>
            <p className="mt-4 mb-1 text-[9.5px] tracking-[.14em] uppercase font-mono text-[#4A564F]">Tools</p>
            <div className="flex flex-col gap-2">
              <button onClick={() => { setShowSpraySettings(false); setShowOfflineMap(true); refreshCacheInfo(); }}
                className="flex items-center justify-between gap-2 text-[10px] font-mono text-[#55655F] bg-[#F4F1E7] border border-[#E2DCC9] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate">
                  {cacheInfo && cacheInfo.tiles > 0 ? <Wifi size={13} className="text-[#0A5238] shrink-0" /> : <CloudOff size={13} className="text-[#55655F] shrink-0" />}
                  <span className="truncate">{cacheInfo && cacheInfo.tiles > 0 ? `Offline map ready · ${fmtBytes(cacheInfo.bytes)}` : 'Offline map — not downloaded'}</span>
                </span>
              </button>
              <button onClick={() => { setShowSpraySettings(false); setShowHistory(true); }}
                className="flex items-center justify-between gap-2 text-[10px] font-mono text-[#55655F] bg-[#F4F1E7] border border-[#E2DCC9] rounded-lg px-3.5 min-h-[44px]">
                <span className="flex items-center gap-2 min-w-0 truncate"><History size={13} className="text-[#0C6B48] shrink-0" />
                  <span className="truncate">{missions.length > 0 ? `${missions.length} mission${missions.length === 1 ? '' : 's'} logged` : 'No missions logged yet'}</span>
                </span>
                {missions.length > 0 && <span className="text-[#0A5238] shrink-0">{missions.reduce((a, m) => a + m.raiDec, 0).toFixed(2)} rai total →</span>}
              </button>
              <div className="text-[10px] font-mono text-[#55655F] bg-[#F4F1E7] border border-[#E2DCC9] rounded-lg px-3.5 py-2.5 flex flex-col gap-1.5">
                <span className="flex items-center gap-2"><Leaf size={13} className="text-[#0C6B48] shrink-0" />
                  <span className="truncate">AI crop check · {aiKey ? `key sk-…${aiKey.slice(-4)} · this phone only` : 'no API key (photos and pins still work)'}</span>
                </span>
                <span className="flex gap-1.5">
                  <input type="password" value={aiKeyDraft} onChange={(e) => setAiKeyDraft(e.target.value)} placeholder={aiKey ? 'replace key…' : 'paste Anthropic API key (sk-ant-…)'}
                    autoComplete="off" className="flex-1 min-w-0 min-h-[36px] rounded-md border border-[#C6C0AC] bg-[#FFFFFF] px-2 text-[11px] text-[#14201C]" />
                  <button onClick={saveAiKey} aria-label="Save API key" disabled={!aiKeyDraft.trim()} className="min-h-[36px] px-2.5 rounded-md bg-[#0C6B48] text-[#FFFFFF] font-bold disabled:opacity-40">SAVE</button>
                  {aiKey && <button onClick={removeAiKey} className="min-h-[36px] px-2 rounded-md border border-[#C6C0AC] text-[#55655F]">REMOVE</button>}
                </span>
              </div>
              {!IS_PROD && <div className="flex items-center justify-between gap-2 text-[10px] font-mono text-[#55655F] bg-[#F4F1E7] border border-[#E2DCC9] rounded-lg pl-3.5 pr-1.5 min-h-[44px]">
                <span className="truncate">{logMsg || `Test log · ${AgrasLog.lines().length} lines`}</span>
                <span className="flex gap-1 shrink-0">
                  <button onClick={() => { setLogMsg('Preparing…'); shareTestLog().then(setLogMsg).catch((e) => setLogMsg('Share failed: ' + ((e && e.message) || e))); }}
                    className="min-h-[36px] px-2.5 rounded-md bg-[#0C6B48] text-[#FFFFFF] font-bold">SHARE</button>
                  <button onClick={() => { AgrasLog.clear(); setLogMsg('Log cleared'); }}
                    className="min-h-[36px] px-2 rounded-md border border-[#C6C0AC] text-[#55655F]">CLEAR</button>
                </span>
              </div>}
            </div>
            {/* DONE stays pinned to the bottom of the sheet while it scrolls */}
            <div className="sticky -bottom-4 -mx-4 -mb-4 mt-4 px-4 pt-3 pb-4 bg-[#FFFFFF] border-t border-[#E2DCC9] flex justify-center">
              <div className="w-full max-w-[260px] flex"><DockBtn icon={CheckCircle2} label="DONE" tone="teal" onClick={() => setShowSpraySettings(false)} /></div>
            </div>
          </div>
        </div>
      )}

      {/* Field Setup menu — Plot/Edit, Station, Save consolidated out of the
          Ready screen's default view into one sheet (see the summary row
          above); same three actions, same handlers, just tucked away. */}

      {/* Tools menu — Offline Map / Mission History / Resume Saved Session
          consolidated the same way. Each row keeps its own live status text
          exactly as it showed on the Ready screen before. */}
      {/* Offline Map Control Bar — pre-fetch the active field's satellite
          tiles (current zoom + the 17–20 native-resolution band) into Cache
          Storage while there's still signal, so the map still renders with
          none. Whatever the deepest zoom that actually came back with real
          imagery (not Esri's "no data" placeholder — see
          ESRI_PLACEHOLDER_MAX_BYTES) becomes this field's zoomCeilingRef the
          moment the live map notices; on-screen zoom past that ceiling is
          pure digital stretch of the deepest real tile, same as online. */}
      {showOfflineMap && (
        <div className="absolute inset-0 z-30 bg-[#F4F1E7]/90 flex items-center justify-center p-4">
          <div className="w-full max-w-[360px] rounded-2xl bg-[#FFFFFF] border border-[#E2DCC9] p-4">
            <div className="flex items-center justify-between">
              <p className="font-display text-[15px] font-bold tracking-wide">OFFLINE MAP</p>
              <button onClick={() => setShowOfflineMap(false)} className="text-[#55655F] p-1 -mr-1"><X size={18} /></button>
            </div>
            <p className="text-[10.5px] text-[#55655F] mt-0.5 mb-3">Download satellite maps for offline use · for the active field, before you lose signal</p>

            {!('caches' in window) ? (
              <p className="text-xs text-[#8A4B06] leading-relaxed">This browser doesn't support offline map storage — satellite imagery will need a live connection every time.</p>
            ) : !unprojectRef.current ? (
              <p className="text-xs text-[#55655F] leading-relaxed">Get a GPS fix at least once (switch to GPS mode) so the field's real-world location is known, then come back here to download.</p>
            ) : (
              <>
                <div className="rounded-xl bg-[#F4F1E7] border border-[#E2DCC9] p-3 flex items-center gap-3">
                  {cacheInfo && cacheInfo.tiles > 0 ? <Wifi size={20} className="text-[#0A5238] shrink-0" /> : <CloudOff size={20} className="text-[#55655F] shrink-0" />}
                  <div className="min-w-0">
                    <p className="text-sm font-bold truncate">{cacheInfo && cacheInfo.tiles > 0 ? 'Offline Map Ready' : 'No offline tiles cached yet'}</p>
                    <p className="text-[10px] font-mono text-[#55655F] mt-0.5">{cacheInfo ? `${cacheInfo.tiles} tiles · ${fmtBytes(cacheInfo.bytes)}` : '—'}</p>
                  </div>
                </div>

                {downloadState ? (
                  downloadState.error ? (
                    <p className="text-xs text-[#A5201A] mt-3">{downloadState.error}</p>
                  ) : (
                    <div className="mt-3">
                      <div className="flex items-center justify-between text-[10px] font-mono text-[#55655F]">
                        <span>Downloading tiles…</span>
                        <span>{downloadState.done} / {downloadState.total}</span>
                      </div>
                      <div className="mt-1.5 h-1.5 w-full rounded-full bg-[#F4F1E7] overflow-hidden">
                        <div className="h-full rounded-full bg-[#0C6B48] transition-[width] duration-200"
                          style={{ width: (downloadState.total ? (downloadState.done / downloadState.total) * 100 : 0) + '%' }} />
                      </div>
                      <DockBtn icon={X} label="CANCEL DOWNLOAD" tone="ghost" onClick={cancelDownload} />
                    </div>
                  )
                ) : (
                  <div className="grid grid-cols-1 gap-2.5 mt-3">
                    <DockBtn icon={Download} label="DOWNLOAD FIELD MAP FOR OFFLINE USE" tone="teal" onClick={downloadFieldMapOffline} />
                    {cacheInfo && cacheInfo.tiles > 0 && (
                      <DockBtn icon={Trash2} label="CLEAR OFFLINE CACHE" tone="ghost" onClick={clearMapCache} />
                    )}
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      )}

    </div>
  );
}

function MiniMap({ field, sim, gridCanvas, station }) {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const r = c.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = r.width * dpr; c.height = r.height * dpr;
    const v = computeView(c.width, c.height, field.bbox, 4);
    drawScene(c.getContext('2d'), c.width, c.height, v, field, sim, gridCanvas, station, { static: true, thumb: true });
  }, [field, sim, gridCanvas, station]);
  return <canvas ref={ref} className="w-full h-full" />;
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err) { AgrasLog.add('ERR', 'render crash: ' + (err && err.message)); AgrasLog.flush(); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="fixed inset-0 flex flex-col items-center justify-center gap-4 p-6 text-center bg-[#F4F1E7] text-[#24322C]">
        <p className="font-display text-lg font-bold">Something went wrong</p>
        <p className="font-mono text-[11px] text-[#55655F] max-w-[300px] break-words">{String(this.state.err && this.state.err.message || this.state.err)}</p>
        <p className="text-xs text-[#55655F] max-w-[300px]">Your mission progress was autosaved — reopening will offer to resume it.</p>
        <button onClick={() => location.reload()} className="min-h-[48px] px-6 rounded-xl bg-[#0C6B48] text-[#FFFFFF] font-semibold">Reload</button>
      </div>
    );
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
