    const step = (t) => {
      const ph = phaseRef.current;
      if ((ph === 'running' || ph === 'paused') && !dragRef.current && t - lastStepT < 30) { raf = requestAnimationFrame(step); return; }
      lastStepT = t;
      frame(t, false); raf = requestAnimationFrame(step);
    };
    headlessFrameRef.current = () => frame(performance.now(), true);
    // test/debug hook, read on demand (it used to be rebuilt every frame)
    Object.defineProperty(window, '__agrasDbg', { configurable: true,
      get: () => ({ pan: panRef.current, view: viewRef.current, ph: phaseRef.current, mode: camModeRef.current, draft: draftRef.current }) });
    raf = requestAnimationFrame(step);
    return () => { cancelAnimationFrame(raf); headlessFrameRef.current = null; };
  }, [paintCell]);

  const toFieldCoords = (clientX, clientY) => {
    const r = wrapRef.current.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const px = (clientX - r.left) * dpr, py = (clientY - r.top) * dpr;
    return screenToField(viewRef.current, px, py);
  };
  const onMapTap = (e) => {
    const pt = e.touches ? e.touches[0] : e;
    if (phase === 'boundary') setDraft((d) => [...d, toFieldCoords(pt.clientX, pt.clientY)]);
    else if (phase === 'station') setStationDraft(toFieldCoords(pt.clientX, pt.clientY));
  };

  /* Satellite-assisted boundary plotting: a drag pans the camera (panRef —
   * field-local metre centre + view scale), a plain tap does nothing (points
   * only go in via "Mark Corner" / "Add Point at Crosshair" in this mode) —
   * kept as a *separate* gesture path from the existing tap-to-place flow
   * above so ordinary Sim/GPS plotting behaves exactly as it always has. */
  const MAX_ZOOM_S = 2200;   // view-scale ceiling — screen-px per field-metre at full digital zoom (sub-metre crop rows)
  const MIN_ZOOM_S = 0.3;

  const zoomMap = (dir) => {
    if (!panRef.current) return;
    const factor = dir > 0 ? 1.3 : 1 / 1.3;
    panRef.current = { ...panRef.current, s: Math.max(MIN_ZOOM_S, Math.min(MAX_ZOOM_S, panRef.current.s * factor)) };
    // (tile-fetch zoom is no longer tracked separately here — drawSatelliteTiles
    // derives it fresh from panRef/viewRef's own scale every frame, so it can
    // never drift out of sync with whatever gesture just changed that scale)
  };
  const centerOnMyLocation = () => {
    const live = gpsLiveRef.current;
    if (live.lat == null) return;
    const s = panRef.current ? panRef.current.s : viewRef.current.s;
    panRef.current = { x: live.x, y: live.y, s, a: panRef.current ? (panRef.current.a || 0) : 0 };
  };
  /** Frame every corner placed so far in the open middle of the screen,
   *  clear of the side buttons, so none hides under the zoom controls. */
  const fitDraftInView = () => {
    const c = canvasRef.current, d = draftRef.current;
    if (!c || d.length < 2) return;
    const bb = liveDraftBBox(d, 20), fr = freeRectRef.current;
    const h = fr && fr.h > 0 ? fr.h : c.height * 0.5;
    const s = Math.max(MIN_ZOOM_S, Math.min(MAX_ZOOM_S, Math.min(c.width * 0.6 / (bb.w + 8), h * 0.75 / (bb.h + 8))));
    followMeRef.current = false;
    panRef.current = { x: (bb.minX + bb.maxX) / 2, y: (bb.minY + bb.maxY) / 2, s, a: 0 };
    setTick((n) => n + 1);
  };
  const addPointAtCrosshair = () => {
    const wrap = wrapRef.current;
    if (!wrap) return;
    const r = wrap.getBoundingClientRect();
    setDraft((d) => [...d, toFieldCoords(r.left + r.width / 2, r.top + r.height / 2 + freeDyRef.current / Math.min(2, window.devicePixelRatio || 1))]);
  };

  /* Satellite-assisted map gestures — one finger drags to pan, two fingers
   * pinch to zoom (real two-pointer distance math, anchored to the pinch's
   * screen midpoint so the ground under your fingers stays put), and a
   * quick double-tap zooms in one step. All of it lives on top of the same
   * panRef {x,y,s} camera state the +/- buttons and Center-on-Me use, so
   * every input method drives one consistent camera. */
  // Manual pan/zoom is available on ANY phase that shows the satellite
  // basemap now, not just while plotting a boundary — pinch to zoom, one
  // finger to drag, double-tap to step in. onMapTap only ever does anything
  // on 'boundary'/'station' anyway, so falling through to it elsewhere is
  // already a safe no-op.
  /* Google-Maps-style gestures: one finger drags the map, two fingers pinch-zoom AND rotate around their
   * midpoint (the ground under your fingers stays under your fingers), double-tap zooms in at the tap. */
  const canvasPoint = (clientX, clientY) => {
    const r = wrapRef.current.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    return { x: (clientX - r.left) * dpr, y: (clientY - r.top) * dpr };
  };
  const camDy = () => freeDyRef.current;
  const gesturesActive = () => {
    const ph = phaseRef.current;
    if (ph === 'running' || ph === 'paused') return true;
    return !!(PANNABLE_PHASES[ph] && satelliteOnRef.current && panRef.current);
  };
  const beginGesture = () => {
    const ptrs = [...activePointersRef.current.values()], c = canvasRef.current;
    if (!c || !ptrs.length) { gestureRef.current = null; dragRef.current = null; return; }
    const cam0 = panRef.current && camModeRef.current !== 'follow' && camModeRef.current !== 'fit'
      ? { ...panRef.current }
      : camFromView(viewRef.current, c.width, c.height, camDy());
    if (cam0.a == null) cam0.a = 0;
    const two = ptrs.length >= 2;
    const M = two ? { x: (ptrs[0].x + ptrs[1].x) / 2, y: (ptrs[0].y + ptrs[1].y) / 2 } : ptrs[0];
    const Mc = canvasPoint(M.x, M.y);
    gestureRef.current = {
      cam0, two, P0: screenToField(viewRef.current, Mc.x, Mc.y),
      dist0: two ? Math.max(1, Math.hypot(ptrs[1].x - ptrs[0].x, ptrs[1].y - ptrs[0].y)) : 0,
      ang0: two ? Math.atan2(ptrs[1].y - ptrs[0].y, ptrs[1].x - ptrs[0].x) : 0,
      startX: ptrs[0].x, startY: ptrs[0].y, moved: false, s0: navScaleRef.current > 0 ? navScaleRef.current : c.width / 32,
    };
    dragRef.current = gestureRef.current;
  };
  const onWrapPointerDown = (e) => {
    if (!gesturesActive()) { onMapTap(e); return; }
    try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* unsupported — gestures still work */ }
    activePointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (activePointersRef.current.size === 1) {
      const now = performance.now(), last = lastTapRef.current;
      const isDoubleTap = now - last.t < 320 && Math.hypot(e.clientX - (last.x || 0), e.clientY - (last.y || 0)) < 30;
      lastTapRef.current = { t: now, x: e.clientX, y: e.clientY };
      if (isDoubleTap && camModeRef.current !== 'follow' && (phaseRef.current !== 'running' && phaseRef.current !== 'paused' || camModeRef.current === 'free')) {
        beginGesture();
        const g = gestureRef.current, c = canvasRef.current;
        if (g && c) {
          const s2 = Math.min(MAX_ZOOM_S, g.cam0.s * 2), Mc = canvasPoint(e.clientX, e.clientY);
          const off = rotOut(Mc.x - c.width / 2, Mc.y - (c.height / 2 + camDy()), g.cam0.a);
          panRef.current = { x: g.P0.x - off.x / s2, y: g.P0.y - off.y / s2, s: s2, a: g.cam0.a };
        }
        gestureRef.current = null; dragRef.current = null; lastTapRef.current = { t: 0 };
        return;
      }
    }
    beginGesture();
  };
  const onWrapPointerMove = (e) => {
    if (!activePointersRef.current.has(e.pointerId)) return;
    activePointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const g = gestureRef.current, c = canvasRef.current;
    if (!g || !c) return;
    const ptrs = [...activePointersRef.current.values()];
    const ph = phaseRef.current, navigating = (ph === 'running' || ph === 'paused');
    // any deliberate pan/zoom takes the camera off "follow my GPS" (Google-Maps style); LocateFixed brings it back
    if (followMeRef.current && ph === 'boundary' && (g.two || Math.hypot(ptrs[0].x - g.startX, ptrs[0].y - g.startY) > 6)) setFollowMe(false);
    if (g.two && ptrs.length >= 2 && !g.logged) { g.logged = true; AgrasLog.add('GESTURE', `two-finger start dist=${Math.round(g.dist0)} phase=${ph} mode=${camModeRef.current}`); }
    if (g.two && ptrs.length >= 2) {
      const dist2 = Math.max(1, Math.hypot(ptrs[1].x - ptrs[0].x, ptrs[1].y - ptrs[0].y));
      const s = Math.max(MIN_ZOOM_S, Math.min(MAX_ZOOM_S, g.cam0.s * dist2 / g.dist0));
      g.moved = true;
      if (navigating && camModeRef.current === 'follow') { navScaleRef.current = Math.max(1, Math.min(120, g.s0 * dist2 / g.dist0)); return; } // chase view: pinch = zoom only
      if (navigating && camModeRef.current === 'fit') setCamMode('free');
      const ang = Math.atan2(ptrs[1].y - ptrs[0].y, ptrs[1].x - ptrs[0].x);
      // Rotation is deliberate: ignore small twists while pinch-zooming, and only start turning the map
      // once the fingers have twisted past ~20 degrees (then it follows smoothly from that point).
      const dAng = normAngle(ang - g.ang0);
      // Real fingers twist 20+ degrees while pinching, so: once the fingers have clearly changed distance
      // (a zoom gesture), rotation is locked out for the rest of that gesture; a real rotate needs a >30 degree
      // twist while the distance stays roughly the same.
      if (ph !== 'ready') g.rotBlocked = true; // twist-rotation only on the first (ready) screen; on the plotting/station screens it spun on two-finger taps
      if (!g.rotUnlocked && !g.rotBlocked) {
        if (Math.abs(Math.log(dist2 / g.dist0)) > 0.18) g.rotBlocked = true;
        else if (Math.abs(dAng) > 0.52) { g.rotUnlocked = true; g.angOff = dAng; }
      }
      if (g.rotUnlocked && !g.rotLogged) { g.rotLogged = true; AgrasLog.add('GESTURE', `rotation unlocked twist=${Math.round(dAng * 57.3)}deg zoom=${(dist2 / g.dist0).toFixed(2)}x`); }
      const a = g.rotUnlocked ? g.cam0.a - (dAng - g.angOff) : g.cam0.a;
      const Mc = canvasPoint((ptrs[0].x + ptrs[1].x) / 2, (ptrs[0].y + ptrs[1].y) / 2);
      const off = rotOut(Mc.x - c.width / 2, Mc.y - (c.height / 2 + camDy()), a);
      panRef.current = { x: g.P0.x - off.x / s, y: g.P0.y - off.y / s, s, a };
      return;
    }
    const p = ptrs[0];
    if (!g.moved && Math.hypot(p.x - g.startX, p.y - g.startY) > 6) g.moved = true;
    if (!g.moved) return;
    if (navigating && camModeRef.current !== 'free') setCamMode('free'); // dragging takes the camera off the operator (Re-center brings it back)
    const Mc = canvasPoint(p.x, p.y);
    const off = rotOut(Mc.x - c.width / 2, Mc.y - (c.height / 2 + camDy()), g.cam0.a);
    panRef.current = { x: g.P0.x - off.x / g.cam0.s, y: g.P0.y - off.y / g.cam0.s, s: g.cam0.s, a: g.cam0.a };
  };
  const onWrapPointerUp = (e) => {
    const g = gestureRef.current;
    const wasTap = g && !g.moved && !g.two && activePointersRef.current.size === 1;
    activePointersRef.current.delete(e.pointerId);
    if (activePointersRef.current.size === 0) {
      // snap back to north-up when the map is left almost straight (like Google Maps)
      if (panRef.current && Math.abs(normAngle(panRef.current.a || 0)) < 0.2 && phaseRef.current !== 'running' && phaseRef.current !== 'paused') panRef.current = { ...panRef.current, a: 0 };
      gestureRef.current = null; dragRef.current = null;
    }
    else beginGesture(); // a finger lifted mid-gesture: continue from the remaining one without a jump
    if (wasTap && phaseRef.current === 'station' && e.type === 'pointerup') onMapTap(e);
  };

  // Lazily hand the camera to the user the first time satellite mode is
  // switched on (seeded from whatever the auto-fit view already showed) —
  // and hand it back (auto-fit resumes) once toggled off. Covers every
  // PANNABLE_PHASES screen now, not just plotting — but ready/running/
  // paused's auto-fit view can be ROTATED (computeFitView's v.angle), so
  // the screen-center-to-field-coords seed has to undo that rotation first
  // (the inverse of drawScene's ctx.rotate(-v.angle)); boundary/station
  // views never carry an angle, so this is a no-op there, same as before.
  useEffect(() => {
    if (!satelliteOn) { panRef.current = null; return; }
    // wait a beat so the auto-fit view for the new phase exists before seeding the camera from it
    const tid = setTimeout(() => {
    if (PANNABLE_PHASES[phase] && !panRef.current) {
      const c = canvasRef.current, v = viewRef.current;
      if (c && v.s > 0) {
        const cam = camFromView(v, c.width, c.height, freeDyRef.current);
        if (phase === 'boundary' || phase === 'station') cam.a = 0; // always start plotting north-up
        panRef.current = cam;
      }
    }
    }, 150);
    return () => clearTimeout(tid);
  }, [satelliteOn, phase]);

  /** Convert the active field's local-metre bbox (padded so panning near an
   *  edge still has imagery) into the tile x/y range needed at one zoom
   *  level — the same Web Mercator math drawSatelliteTiles uses, run once
   *  up front instead of per-frame. */
  const fieldTileRange = (field, z) => {
    const bx = field.bbox, pad = 0.35;
    const padX = bx.w * pad, padY = bx.h * pad;
    const corners = [
      unprojectRef.current(bx.minX - padX, bx.minY - padY),
      unprojectRef.current(bx.minX - padX, bx.maxY + padY),
      unprojectRef.current(bx.maxX + padX, bx.minY - padY),
      unprojectRef.current(bx.maxX + padX, bx.maxY + padY),
    ];
    const worldPts = corners.map((c) => lonLatToWorldPx(c.lng, c.lat, z));
    const n = Math.pow(2, z);
    const txs = worldPts.map((p) => Math.floor(p.x / TILE_SIZE));
    const tys = worldPts.map((p) => Math.floor(p.y / TILE_SIZE));
    return {
      tx0: Math.max(0, Math.min(...txs)), tx1: Math.min(n - 1, Math.max(...txs)),
      ty0: Math.max(0, Math.min(...tys)), ty1: Math.min(n - 1, Math.max(...tys)),
    };
  };

  /** "Download Field Map for Offline Use" — pre-fetches every tile the
   *  field could need at the current zoom plus the deep-zoom band, storing
   *  each in Cache Storage so drawSatelliteTiles finds a hit with zero
   *  network once the operator is out in the field. Capped at
   *  MAX_NATIVE_ZOOM — a tile Esri doesn't have at that depth simply fails
   *  this fetch (caught below, one missing tile doesn't fail the batch);
   *  the LIVE map still shows something there — it just won't be the
   *  sharpest step once that field's own zoomCeilingRef ratchets down from
   *  the same missing-tile signal, since only Esri responses persist to
   *  Cache Storage. Bounded concurrency (6 in flight) so a few hundred tiles don't open a few
   *  hundred sockets. */
  const mapDownloadInFlightRef = useRef(false); // guards against a manual tap and an automatic post-save prefetch racing each other
  const downloadFieldMapOffline = async () => {
    if (!unprojectRef.current) return;
    if (!mapCacheRef.current) { setDownloadState({ done: 0, total: 0, error: 'Offline storage is not available on this browser/connection.' }); return; }
    if (mapDownloadInFlightRef.current) return;
    mapDownloadInFlightRef.current = true;
    try {
      downloadAbortRef.current = false;
      const field = fieldRef.current;
      // Same derivation drawSatelliteTiles uses — the current on-screen scale,
      // converted to its matching integer zoom — rather than a separately
      // tracked ref that pinch-zooming never updated (see zoomForScale).
      const originNow = unprojectRef.current(0, 0);
      const curScale = panRef.current ? panRef.current.s : viewRef.current.s;
      const curZoom = Math.max(MIN_MAP_ZOOM, Math.min(MAX_NATIVE_ZOOM, Math.round(zoomForScale(curScale, originNow.lat))));
      // shallow to deep, one zoom at a time: once a whole zoom comes back as
      // "no data" placeholders, every deeper one will too, so it is skipped
      const zooms = [...new Set([curZoom, 17, 18, MAX_NATIVE_ZOOM])].filter((z) => z >= MIN_MAP_ZOOM && z <= MAX_NATIVE_ZOOM).sort((a, b) => a - b);
      const levels = zooms.map((z) => {
        const r = fieldTileRange(field, z), jobs = [];
        for (let ty = r.ty0; ty <= r.ty1; ty++) for (let tx = r.tx0; tx <= r.tx1; tx++) jobs.push({ z, tx, ty });
        return jobs;
      });
      let total = levels.reduce((n, jobs) => n + jobs.length, 0);
      setDownloadState({ done: 0, total });
      let done = 0, lastProgressT = 0, stored = 0, empty = 0;
      for (let li = 0; li < levels.length; li++) {
        const jobs = levels[li];
        let idx = 0, real = 0, none = 0;
        const worker = async () => {
          while (idx < jobs.length) {
            if (downloadAbortRef.current) return;
            const job = jobs[idx++];
            try { if ((await cacheTile(esriTileUrl(job.z, job.tx, job.ty), mapCacheRef.current)) === 'real') real++; else none++; } catch (e) { /* one missing tile doesn't fail the download */ }
            done++;
            // a progress re-render per tile re-rendered the whole app hundreds
            // of times (it also runs in the background after a field is saved)
            const now = performance.now();
            if (done === total || now - lastProgressT > 250) { lastProgressT = now; setDownloadState({ done, total }); }
          }
        };
        await Promise.all(Array.from({ length: 6 }, worker));
        if (downloadAbortRef.current) break;
        stored += real; empty += none;
        if (real === 0 && none > 0) {
          // an older build stored the deeper placeholders too: clear them out
          for (const deeper of levels.slice(li + 1)) for (const job of deeper) await mapCacheRef.current.delete(esriTileUrl(job.z, job.tx, job.ty)).catch(() => {});
          total = done;
          setDownloadState({ done, total });
          AgrasLog.add('MAP', `no imagery at zoom ${jobs[0].z}: deeper zooms skipped`);
          break;
        }
      }
      if (!downloadAbortRef.current) {
        refreshCacheInfo();
        AgrasLog.add('MAP', `offline map downloaded: ${stored} tiles (${empty} no-data skipped)`);
        // done — leave the Offline map screen by itself, as if back was
        // pressed, after a beat so the bar is seen reaching 100 %
        setTimeout(() => { setShowOfflineMap(false); setDownloadState(null); }, 900);
      }
    } finally {
      mapDownloadInFlightRef.current = false;
    }
  };
  const cancelDownload = () => { downloadAbortRef.current = true; setDownloadState(null); };

  /** Fire-and-forget background prefetch — called the moment a field is
   *  saved (closing the boundary, and saving it into the Field Library) so
   *  the operator never has to remember to open Offline Map and tap
   *  Download themselves. Silently does nothing when there's no real-world
   *  geo-anchor yet (a field plotted in Sim mode with no GPS fix taken) or
   *  offline storage isn't supported — the manual Offline Map panel is
   *  still there to explain why and to retry later. Never overlaps a
   *  download already in flight (including one the operator started by
   *  hand — mapDownloadInFlightRef covers both), and never surfaces an
   *  error UI on its own — that's only shown when the operator opens the
   *  panel themselves. */
  const autoDownloadFieldMap = () => {
    if (!('caches' in window) || !unprojectRef.current || !mapCacheRef.current) return;
    if (mapDownloadInFlightRef.current) return;
    downloadFieldMapOffline();
  };

  /** Best-effort cache size readout — iterates every stored tile response
   *  and sums its blob size. Cheap enough for a few hundred field tiles;
   *  only ever called on demand (after a download, or a manual refresh tap). */
  const refreshCacheInfo = async () => {
    if (!mapCacheRef.current) { setCacheInfo(null); return; }
    try {
      const keys = await mapCacheRef.current.keys();
      let bytes = 0;
      for (const req of keys) {
        const res = await mapCacheRef.current.match(req);
        if (res) { const blob = await res.blob(); bytes += blob.size; }
      }
      setCacheInfo({ tiles: keys.length, bytes });
    } catch (e) { setCacheInfo(null); }
  };
  const clearMapCache = async () => {
    if (!mapCacheRef.current) return;
    try {
      const keys = await mapCacheRef.current.keys();
      await Promise.all(keys.map((k) => mapCacheRef.current.delete(k)));
      clearTileCache(tileCacheRef.current);
      setCacheInfo({ tiles: 0, bytes: 0 });
    } catch (e) { /* best-effort */ }
  };

  const autoFieldName = () => { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `แปลง ${p(d.getDate())}/${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`; };
  /** Fields are saved the moment their boundary is closed (closeBoundary);
   *  this is only the safety net for a field that somehow never was, e.g.
   *  the built-in sample field. */
  const startSpraying = () => {
    if (!activeFieldIdRef.current) saveCurrentFieldToLibrary(autoFieldName());
    const e = fieldLibraryRef.current.find((f) => f.id === activeFieldIdRef.current);
    // first START of a round: ask what is being sprayed (skippable, editable later)
    if (e && !(e.roundMeta && e.roundMeta.chemicalsAsked)) {
      // prefill with this field's previous round, else the last set entered anywhere
      const prev = (e.rounds || []).slice().reverse().find((r) => r.chemicals && r.chemicals.length);
      const last = prev ? prev.chemicals : loadLastChemicalSet();
      setChemDraft(last.length ? last.map((c) => ({ ...c })) : [{ name: '', rate: '', unit: 'cc' }]);
      setChemSheet('start');
      return;
    }
    reallyStartSpraying();
  };
  const reallyStartSpraying = () => {
    beginNewMission();
    missionStartTsRef.current = Date.now();
    weatherStartRef.current = sprayWeather ? {
      windKmh: sprayWeather.windKmh, gustKmh: sprayWeather.gustKmh, rainNowMm: sprayWeather.rainNowMm,
      rainSoonProb: sprayWeather.rainSoonProb, tempC: sprayWeather.tempC, humidity: sprayWeather.humidity, fetchedAt: sprayWeather.fetchedAt,
    } : null;
    const id = activeFieldIdRef.current;
    if (id) updateLibrary((list) => list.map((f) => (f.id === id && !(f.roundMeta && f.roundMeta.startedTs)
      ? { ...f, roundMeta: { ...(f.roundMeta || {}), startedTs: Date.now() } } : f)));
    simUsedRef.current = srcMode === 'sim';
    if (srcMode === 'sim') prepareSimWalk();
    setPhase('running');
  };
  /** SIM: walk the suggested route (the one on screen, else the planner's
   *  pick) from the refill station, skipping what is already sprayed; each
   *  tank runs out after the measured area per tank, and the walker goes to
   *  the station, mixes, walks back and carries on (see the main loop). */
  const simTankAreaRef = useRef(0);
  const simRefillRef = useRef(null);     // { stage: 'toStation'|'mixing'|'back', resumeAt: {x,y}, wp }
  const prepareSimWalk = () => {
    const sim = simRef.current, f = fieldRef.current;
    const tankArea = areaPerTank();
    const rp = routePlanRef.current;
    const plan = rp ? rp.variants[rp.idx] : (() => { const p = planSprayRoute(f.poly, swathRef.current, stationRef.current, tankArea, edgeGapRef.current); return p && p.variants[p.idx]; })();
    if (!plan) return;
    const isSprayed = sim.sprayedCells > 0 ? (p) => {
      const i = Math.floor((p.x - f.gbbox.minX) / CELL), j = Math.floor((p.y - f.gbbox.minY) / CELL);
      return i >= 0 && j >= 0 && i < f.GW && j < f.GH && sim.passes[j * f.GW + i] > 0;
    } : null;
    const start = stationRef.current || plan.segs[0].a;
    sim.route = simWaypointsFromPlan(plan, start, isSprayed);
    sim.wp = 1; sim.pos = { x: start.x, y: start.y }; sim.done = sim.route.length < 2;
    simTankAreaRef.current = tankArea;
    simRefillRef.current = null;
    AgrasLog.add('SIM', `walking the ${plan.along ? 'along' : 'across'} route: ${sim.route.length} waypoints, ${Math.round(tankArea)} m² per tank`);
  };
  /** Save the chemicals sheet onto the active field's open round. */
  const saveChemicals = (rows) => {
    const clean = rows.map((c) => ({ name: (c.name || '').trim(), rate: String(c.rate || '').trim(), unit: c.unit || 'cc' })).filter((c) => c.name);
    const id = activeFieldIdRef.current;
    if (id) updateLibrary((list) => list.map((f) => (f.id === id ? { ...f, roundMeta: { ...(f.roundMeta || {}), chemicals: clean, chemicalsAsked: true } } : f)));
    if (clean.length) rememberChemicals(clean);
    AgrasLog.add('CHEM', clean.length ? clean.map(chemLine).join('; ') : 'none entered');
  };
  const resetFieldCoverage = (id) => {
    updateLibrary((list) => list.map((e) => { if (e.id !== id) return e; const { cov, stats, lastStop, ...rest } = e; return { ...rest, lastSprayedTs: null }; }));
    setConfirmResetCovId(null);
    AgrasLog.add('RESET', 'sprayed area cleared for field ' + id);
    if (id === activeFieldIdRef.current && phaseRef.current === 'ready') resetSim(swathRef.current);
  };
  const resetAllSavedData = () => {
    [FIELD_LIBRARY_KEY, HISTORY_KEY, LAST_SETTINGS_KEY, CHECKLIST_KEY, SPRAY_WEATHER_KEY].forEach((k) => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } });
    clearActiveSession();
    fieldLibraryRef.current = []; setFieldLibrary([]); setMissions([]);
    activeFieldIdRef.current = null; setActiveFieldId(null);
    setConfirmResetAll(false); setConfirmResetCovId(null); setShowFieldLibrary(false);
    AgrasLog.add('RESET', 'all saved data erased');
    resetSim(swathRef.current);
  };
  /** editId = the saved field being redrawn (EDIT BOUNDARY), or null for a new
   *  field (ADD FIELD, or nothing saved is active yet). */
  const editingFieldIdRef = useRef(null);
  const startPlotting = (editId = null) => { editingFieldIdRef.current = editId; askNameAfterStationRef.current = false; clearActiveSession(); panRef.current = null; setDraft([]); setConfirmCloseField(false); setPhase('boundary'); };
  const undoPoint = () => { setConfirmCloseField(false); setDraft((d) => d.slice(0, -1)); };
  const closeBoundary = () => {
    if (draft.length < 3) return;
    setConfirmCloseField(false);
    panRef.current = null;
    const editing = editingFieldIdRef.current ? fieldLibraryRef.current.find((e) => e.id === editingFieldIdRef.current) : null;
    editingFieldIdRef.current = null;
    resetField(draft, swath);
    if (editing) {
      // Redrawing a saved field (the owner's call): it stays the same field —
      // name, refill station, round number and finished rounds all kept — so
      // there is no station step. Only the open round's sprayed area goes,
      // because its cells were laid out on the old boundary.
      const f = fieldRef.current, origin = originLatLngRef.current;
      stationRef.current = editing.station || stationRef.current;
      updateLibrary((list) => list.map((e) => {
        if (e.id !== editing.id) return e;
        const { cov, stats, lastStop, ...rest } = e;
        return { ...rest, poly: f.poly, gpsAnchored: f.gpsAnchored, areaRai: f.area / 1600, areaSqm: f.area,
          originLat: origin ? origin.lat : e.originLat, originLng: origin ? origin.lng : e.originLng };
      }));
      activeFieldIdRef.current = editing.id; setActiveFieldId(editing.id);
      AgrasLog.add('SAVE', `field ${editing.id} boundary redrawn (${(f.area / 1600).toFixed(2)} rai); station and rounds kept`);
      return;
    }
    // Saved to the field library right here, under an automatic name the
    // operator can change later (Field setup -> RENAME). It used to stay an
    // unsaved plot until someone tapped SAVE or START SPRAYING, so closing
    // the app in between lost the whole boundary walk.
    saveCurrentFieldToLibrary(autoFieldName());
    AgrasLog.add('SAVE', `field auto-saved on close (${(fieldRef.current.area / 1600).toFixed(2)} rai)`);
    // Next step of the owner's flow (draw field -> set refill station): go
    // straight to placing the station. CONFIRM writes it to the saved field;
    // CANCEL keeps the default spot. Either way it lands on the home screen —
    // prevPhaseRef is set by hand because `phase` is still 'boundary' here.
    prevPhaseRef.current = 'ready';
    askNameAfterStationRef.current = true;
    setStationDraft({ ...stationRef.current });
    setPhase('station');
  };
  /** After a new field's station step: offer to name it (the automatic
   *  date name stays if the operator skips). */
  const askNameIfNewField = () => {
    if (!askNameAfterStationRef.current) return;
    askNameAfterStationRef.current = false;
    const e = fieldLibraryRef.current.find((f) => f.id === activeFieldIdRef.current);
    if (!e) return;
    setSaveFieldName(e.name); setNamingNewField(true); setShowSaveField(true);
  };
  const cancelPlotting = () => { setConfirmCloseField(false); if (fieldRef.current.gpsAnchored || srcMode === 'sim') { setDraft([]); setPhase('ready'); } };
  const markCorner = () => { const live = gpsLiveRef.current; if (live.lat != null) setDraft((d) => [...d, { x: live.x, y: live.y }]); };

  const startStationSetup = () => { prevPhaseRef.current = phase; setStationDraft({ ...stationRef.current }); setPhase('station'); };
  const confirmStation = () => {
    if (stationDraft) {
      stationRef.current = stationDraft;
      // write the new station back to the saved field — before this, moving a
      // saved field's station only lasted until the field was next loaded
      const id = activeFieldIdRef.current;
      if (id) updateLibrary((list) => list.map((e) => (e.id === id ? { ...e, station: { ...stationDraft } } : e)));
    }
    leaveStationStep();
  };
  const cancelStationSetup = () => leaveStationStep();
  /** Back to where the station step was opened from; the home screen re-frames
   *  the whole field (the camera was still on the station, field half off screen). */
  const leaveStationStep = () => {
    if (prevPhaseRef.current === 'ready') panRef.current = null;
    setPhase(prevPhaseRef.current);
    askNameIfNewField();
  };

  /** Android back button / back gesture. Closes whatever is on top, one layer
   *  per press; with nothing left to close it sends the app to the background
   *  (never exits), so a mission keeps tracking and the screen comes back as it
   *  was. Rebuilt every render so it always sees current state; the native
   *  listener below just calls whatever this is. */
  const backHandlerRef = useRef(null);
  backHandlerRef.current = () => {
    if (showFinishChoice) { setShowFinishChoice(false); return 'finish-choice'; }
    if (routePlan && phase === 'ready') { setRoutePlan(null); return 'route'; }
    if (chemSheet) { setChemSheet(null); return 'chemicals'; }
    if (reportFieldId != null) { setReportFieldId(null); return 'report'; }
    if (phase === 'done') { goHomeFromSummary(); return 'summary'; }
    if (showSaveField) { setShowSaveField(false); setNamingNewField(false); return 'rename'; }
    if (confirmDeleteFieldId != null || confirmResetCovId != null || confirmResetAll) {
      setConfirmDeleteFieldId(null); setConfirmResetCovId(null); setConfirmResetAll(false); return 'confirm';
    }
    if (renamingFieldId != null) { setRenamingFieldId(null); return 'inline-rename'; }
    if (showHistory) { if (selectedMissionId != null) setSelectedMissionId(null); else setShowHistory(false); return 'history'; }
    if (showFieldLibrary) { setShowFieldLibrary(false); return 'library'; }
    if (showOfflineMap) { setShowOfflineMap(false); return 'offline-map'; }
    if (showSpraySettings) { setShowSpraySettings(false); return 'spray-settings'; }
    if (showFieldSetupMenu) { setShowFieldSetupMenu(false); return 'field-setup'; }
    if (showToolsMenu) { setShowToolsMenu(false); return 'tools'; }
    if (phase === 'station') { cancelStationSetup(); return 'station'; }
    if (phase === 'boundary' && (fieldRef.current.gpsAnchored || srcMode === 'sim')) { cancelPlotting(); return 'plotting'; }
    const A = nativePlugin('App');
    if (A && A.minimizeApp) Promise.resolve(A.minimizeApp()).catch(() => {});
    return 'minimize';
  };
  useEffect(() => {
    window.__agrasBack = () => backHandlerRef.current(); // lets the browser test harness press "back"
    const A = nativePlugin('App');
    if (!A || !A.addListener) return;
    // registering any backButton listener switches off Capacitor's default
    // (which navigates the WebView history and then closes the activity)
    const h = A.addListener('backButton', () => { AgrasLog.add('BACK', String(backHandlerRef.current())); });
    return () => { Promise.resolve(h).then((x) => x && x.remove && x.remove()).catch(() => {}); };
  }, []);
  const useMyLocationForStation = () => {
    const live = gpsLiveRef.current;
    if (live.lat == null) return;
    setStationDraft({ x: live.x, y: live.y });
    stationDraftRef.current = { x: live.x, y: live.y };
    if (panRef.current) panRef.current = { x: live.x, y: live.y, s: panRef.current.s, a: panRef.current.a || 0 }; // move the camera there
  };

  /** Session persistence — reusable snapshot writer, called from the 5s
   *  autosave tick, from key events (tank empty, out-of-bounds, app close),
   *  and from the explicit "Save & Pause" dock button. Reads everything off
   *  refs, so it's always safe to call regardless of which render defined it. */
  const saveSessionNow = () => {
    const saveT0 = performance.now();
    lastSessionSaveRef.current = Date.now();
    try {
      const snap = buildSessionSnapshot({
        field: fieldRef.current, sim: simRef.current, station: stationRef.current,
        phase: phaseRef.current, opMode: opModeRef.current, swath: swathRef.current,
        tankCapacity: tankCapacityRef.current, rateLRai: rateLRaiRef.current,
        tankBaselineArea: tankBaselineAreaRef.current, imgData: imgDataRef.current,
        originLatLng: originLatLngRef.current,
      });
      saveActiveSession(snap);
      if (phaseRef.current === 'running' || phaseRef.current === 'paused') { persistCoverage(activeFieldIdRef.current, false, { passes: snap.passes, missed: snap.missed }); AgrasLog.add('SAVE', `autosave ${Math.round(performance.now() - saveT0)}ms`); }
    } catch (e) { AgrasLog.add('ERR', 'autosave failed: ' + (e && e.message)); }
  };
  saveSessionRef.current = saveSessionNow;

  /** Restore a saved session record — see the ordering note above initGrid:
   *  sim.lastPass must be the decoded array BEFORE initGrid runs (it reads
   *  simRef.current.lastPass to seed field.__ctx), and the decoded pixel
   *  buffer is written into imgDataRef.current.data AFTER initGrid (which
   *  allocates a fresh, empty one) — then flushed to the visible canvas. */
  const applySessionSnapshot = (saved) => {
    const field = buildField(saved.poly, saved.gpsAnchored, saved.swath);
    const sim = makeSim(field, saved.swath);
    const cells = field.GW * field.GH;
    if (saved.v === 2) {
      try { sim.passes = rleDecode(saved.passes, cells); } catch (e) { /* keep fresh passes */ }
      try { sim.missed = rleDecode(saved.missed, cells); } catch (e) { /* keep fresh missed flags */ }
      // Cells sprayed before the save get the "restored" sentinel, the same
      // one applyCoverage() uses: any stamp after the resume carries an id
      // >= 0, so re-spraying them counts as overlap. The one cost is a
      // sliver of overlap where the resumed lane joins the old one.
      for (let k = 0; k < cells; k++) sim.lastPass[k] = sim.passes[k] > 0 ? -2 : -1;
    } else {
      try { sim.lastPass = new Int32Array(b64ToU8(saved.lastPass).buffer); } catch (e) { /* keep fresh lastPass */ }
      try { if (saved.passes) sim.passes = b64ToU8(saved.passes); } catch (e) { /* keep fresh passes */ }
      try { if (saved.missed) sim.missed = b64ToU8(saved.missed); } catch (e) { /* keep fresh missed flags */ }
    }
    sim.pos = saved.simPos || sim.pos;
    sim.heading = saved.simHeading || 0;
    sim.breakpoint = null; // the breakpoint return leg no longer exists
    sim.distance = saved.distance || 0;
    sim.sprayDistance = saved.sprayDistance || 0;
    sim.elapsed = saved.elapsed || 0;
    sim.sprayedCells = saved.sprayedCells || 0;
    sim.overlapCells = saved.overlapCells || 0;
    sim.epoch = saved.epoch || 0;
    sim.wp = saved.wp || 1;
    sim.fixes = [{ ...sim.pos }];
    recountMissed(sim);

    simRef.current = sim;
    fieldRef.current = field;
    initGrid(field); // reads simRef.current.lastPass — must run after the assignment above

    try {
      if (saved.v === 2) {
        if (imgDataRef.current) {
          for (let k = 0; k < cells; k++) {
            if (sim.passes[k] > 0) paintCell(k % field.GW, Math.floor(k / field.GW), sim.passes[k]);
            else if (sim.missed[k]) paintCell(k % field.GW, Math.floor(k / field.GW), -1);
          }
          flushGridFull(gridCanvasRef.current, imgDataRef.current);
        }
      } else {
        const pixelBytes = b64ToU8(saved.pixels);
        if (imgDataRef.current && imgDataRef.current.data.length === pixelBytes.length) {
          imgDataRef.current.data.set(pixelBytes);
          flushGridFull(gridCanvasRef.current, imgDataRef.current);
        }
      }
    } catch (e) { /* pixel restore failed — geometry/telemetry still resume correctly */ }

    stationRef.current = saved.station || stationRef.current;
    if (saved.originLat != null) {

      unprojectRef.current = makeUnprojector(saved.originLat, saved.originLng);

    }
    manualPathRef.current = null; setExcursionActive(false); clearAlerts();

    swathRef.current = saved.swath; setSwath(saved.swath);
    tankCapacityRef.current = saved.tankCapacity; setTankCapacity(saved.tankCapacity);
    rateLRaiRef.current = saved.rateLRai; setRateLRai(saved.rateLRai);
    tankBaselineAreaRef.current = saved.tankBaselineArea || 0;
    tankAreasRef.current = Array.isArray(saved.tankAreas) ? saved.tankAreas : []; tankOpenRef.current = saved.tankOpen !== false;
    coverageBaseRef.current = saved.covBase || { sprayed: 0, overlap: 0 };
    if (saved.fieldId != null) { activeFieldIdRef.current = saved.fieldId; setActiveFieldId(saved.fieldId); }

    lowLiquidWarnedRef.current = false;
    restoredRef.current = true;

    setPhase('paused');
    setTick((n) => n + 1);
  };

  /** TANK EMPTY — recording off, point at the station. Nothing about the
   *  refill trip depends on GPS reaching anywhere; the operator ends it with
   *  REFILLED · START SPRAYING whenever they start spraying again. */
  const tankEmpty = () => {
    if (opMode !== 'spray' || phase !== 'running') return;
    if (Date.now() - modeSwitchAtRef.current < 2000) return; // see modeSwitchAtRef
    modeSwitchAtRef.current = Date.now();
    closeTank();
    opModeRef.current = 'toStation'; setOpMode('toStation');
    unrecordedRef.current = { walked: 0, startDist: 0, lastAlert: unrecordedRef.current.lastAlert };
    reachedStationRef.current = false;
    if (srcMode === 'sim') {
      const sim = simRef.current, back = { ...sim.pos }, st = stationRef.current;
      simRefillRef.current = { resumeAt: back };
      manualPathRef.current = { legs: [
        { to: { ...st }, dur: Math.max(700, dist(back, st) * SIM_MS_PER_M) },   // walk to the tank
        { to: { ...st }, dur: SIM_MIX_MS },                                      // mix a new tank
        { to: back, dur: Math.max(700, dist(back, st) * SIM_MS_PER_M) },         // walk back to the lane
      ], idx: 0, prog: 0, from: { ...back }, onDone: () => { if (autoWalkRef.current && srcModeRef.current === 'sim') { modeSwitchAtRef.current = 0; resumeRef.current(); } } };
      AgrasLog.add('SIM', `tank out at ${back.x.toFixed(1)},${back.y.toFixed(1)}: walking to the station`);
    }

  };

   *  operator is standing. The same action from the dock button and from the
   *  tank tile during the trip. */
  const resumeSprayingNow = () => {
    if (Date.now() - modeSwitchAtRef.current < 2000) return; // see modeSwitchAtRef
    modeSwitchAtRef.current = Date.now();
    const sim = simRef.current;
    if (!tankOpenRef.current) openTank();
    manualPathRef.current = null; setExcursionActive(false);
    opModeRef.current = 'spray'; setOpMode('spray');
    sim.epoch += 1; sim.passHeading = null; sim.breakpoint = null;
    lowLiquidWarnedRef.current = false;
    unrecordedRef.current = { walked: 0, startDist: 0, lastAlert: unrecordedRef.current.lastAlert };
    AgrasLog.add('OPMODE', 'spray (REFILLED · START SPRAYING)');
    saveSessionNow();
    setTick((n) => n + 1);
  };

  const resumeRef = useRef(null); resumeRef.current = resumeSprayingNow;
  const reachedStationRef = useRef(false);   // this refill trip has reached the station (see the refill pill)
  const simUsedRef = useRef(false);          // this mission ran any SIM walking (see the srcMode effect)
  const tankEmptyRef = useRef(null); tankEmptyRef.current = tankEmpty;
  /** Tank tile button: TANK EMPTY while spraying, REFILLED during the trip. */
  const onTankTileRefill = () => {
    if (opMode === 'spray') tankEmpty();
    else resumeSprayingNow();
  };

  const simulateExcursion = () => {
    if (manualPathRef.current || phase !== 'running' || opMode !== 'spray') return;
    const sim = simRef.current, poly = fieldRef.current.poly;
    const edge = nearestEdgePoint(sim.pos, poly);
    const outside = { x: edge.proj.x + edge.nx * 4.5, y: edge.proj.y + edge.ny * 4.5 };
    const start = { ...sim.pos };
    setExcursionActive(true);
    manualPathRef.current = {
      legs: [{ to: edge.proj, dur: 900 }, { to: outside, dur: 1000 }, { to: outside, dur: 1500 }, { to: edge.proj, dur: 1000 }, { to: start, dur: 900 }],
      idx: 0, t0: performance.now(), from: { ...sim.pos }, onDone: () => setExcursionActive(false)
    };
  };

  /* The wind/weather reset that used to sit here now hangs off phase === 'done'
     (see the effect above), so the SIM route-follower's auto-done gets it too. */
  const finishMission = () => { manualPathRef.current = null; clearAlerts(); resetOpMode(); clearActiveSession(); setPhase('done'); };

  /** File the finished mission — coverage thumbnail, physical-quantity
   *  summary, and compliance record (PPE/user/weather, Spec §5) — in the
   *  persisted mission log. Called automatically on arrival at the summary;
   *  upserts by missionRecordIdRef so the same mission is never filed twice. */
  const recordMission = (mc, roundInfo) => {
    const s = simRef.current, f = fieldRef.current;
    const cbase = coverageBaseRef.current;
    const mSprayed = Math.max(0, s.sprayedCells - cbase.sprayed), mOverlap = Math.max(0, s.overlapCells - cbase.overlap);
    const areaSprayedNow = mSprayed * CELL * CELL;
    const raiNow = toRai(areaSprayedNow);
    const raiDecNow = areaSprayedNow / 1600;
    const overlapRateNow = mSprayed > 0 ? (mOverlap / mSprayed) * 100 : 0;
    // total liquid used across the whole mission (every refill included) —
    // counts overlapped cells too, since a re-pass over already-sprayed
    // ground genuinely uses chemical a second time.
    const tanksUsedNow = tanksUsedCount();
    const litresNow = tanksUsedNow * tankCapacity; // approximate: whole tanks emptied
    const missedCellsNow = s.missedCells;
    const missedRaiNow = (missedCellsNow * CELL * CELL) / 1600;
    const overlapRaiNow = (mOverlap * CELL * CELL) / 1600;

    mc = mc || checklist;

    let thumb = null;
    try {
      const off = document.createElement('canvas');
      off.width = 480; off.height = 300;
      const v = computeView(off.width, off.height, f.bbox, 4);
      drawScene(off.getContext('2d'), off.width, off.height, v, f, s, gridCanvasRef.current, stationRef.current, { static: true, thumb: true });
      thumb = off.toDataURL('image/png');
    } catch (e) { /* canvas export unavailable — record is kept without a thumbnail */ }

    if (!missionRecordIdRef.current) missionRecordIdRef.current = Date.now();
    const record = {
      id: missionRecordIdRef.current, ts: Date.now(),
      round: roundInfo ? roundInfo.round : null, complete: roundInfo ? roundInfo.complete : null, fieldName: roundInfo ? roundInfo.fieldName : null,
      fieldId: activeFieldIdRef.current, startedTs: missionStartTsRef.current, weatherStart: weatherStartRef.current,
      chemicals: (() => { const e = fieldLibraryRef.current.find((x) => x.id === activeFieldIdRef.current); return (e && e.roundMeta && e.roundMeta.chemicals) || []; })(),
      areaSprayed: areaSprayedNow, rai: raiNow.rai, ngan: raiNow.ngan, wa: raiNow.wa, raiDec: raiDecNow,
      distance: s.distance, sprayDistance: s.sprayDistance || 0, elapsed: s.elapsed, src: simUsedRef.current ? 'sim' : srcModeRef.current, overlapRate: overlapRateNow,
      overlapRai: overlapRaiNow,
      missedRai: missedRaiNow,
      litres: litresNow, tanks: tanksUsedNow, tankAreas: tankAreasRef.current, tankCapacity, swath, fieldRai: f.area / 1600, thumb,
      // Compliance log (Spec §5): PPE checklist state, operator, weather — read
      // from the snapshot taken when the mission ended, since reaching this
      // screen has already expired the wind tick and the weather note.
      checklist: { ppe: mc.ppe, mixedRate: mc.mixedRate, nozzle: mc.nozzle, wind: mc.wind, checkedAt: mc.checkedAt },
      operator: mc.operator || '', weather: mc.weather || '',
      // Live wind/rain reading from Open-Meteo at the time this mission was
      // saved, if one was fetched — a source-verified figure alongside the
      // operator's own manual weather note, not a replacement for it.
      weatherApi: sprayWeather ? {
        windKmh: sprayWeather.windKmh, gustKmh: sprayWeather.gustKmh,
        rainNowMm: sprayWeather.rainNowMm, rainSoonProb: sprayWeather.rainSoonProb,
        tempC: sprayWeather.tempC, humidity: sprayWeather.humidity, fetchedAt: sprayWeather.fetchedAt,
      } : null,
    };
    setMissions((prev) => {
      const at = prev.findIndex((m) => m.id === record.id);

    });

  };
  /** Leave the summary for the home (ready) screen — START NEW and the X. */
  const goHomeFromSummary = () => { beginNewMission(); setFinishInfo(null); resetSim(swathRef.current); };
  /** A new mission is about to start: forget the finished one's record id and checklist snapshot. */
  const beginNewMission = () => { missionRecordIdRef.current = null; missionChecklistRef.current = null; };


  const clearHistory = () => {
    if (!confirmClear) { setConfirmClear(true); setTimeout(() => setConfirmClear(false), 4000); return; }
    setMissions([]); saveHistory([]); setConfirmClear(false); setSelectedMissionId(null);
  };

  const exportHistoryCSV = () => {
    try {
      const blob = new Blob([missionsToCSV(missions)], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'agras-mission-history.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { /* download blocked by the host sandbox — data still lives in history */ }
  };

  const sim = simRef.current, field = fieldRef.current;
  __sessionExtras = { fieldId: activeFieldIdRef.current, covBase: coverageBaseRef.current, tankAreas: tankAreasRef.current, tankOpen: tankOpenRef.current, recordId: missionRecordIdRef.current, startTs: missionStartTsRef.current, weatherStart: weatherStartRef.current };
  const areaSprayed = sim.sprayedCells * CELL * CELL;
  const coveragePct = Math.min(100, (areaSprayed / field.area) * 100) || 0;
  const overlapRate = sim.sprayedCells > 0 ? (sim.overlapCells / sim.sprayedCells) * 100 : 0;
  const speedMs = sim.elapsed > 2 ? (sim.sprayDistance || sim.distance) / sim.elapsed : 0;      // lifetime average — mission summary only
  // ---- Live Speed-Based Flow Rate & Pace Engine -----------------------
  // liveSpeedMs is an EMA sampled every frame (see the main loop) so the
  // widget reacts to the operator's actual current pace, not a lifetime
  // average — a stall or a burst of speed shows up within ~1 second.
  const liveSpeedMs = speedEmaRef.current;
  const liveSpeedKmh = liveSpeedMs * 3.6;
  const paceZone = liveSpeedKmh < 0.3 ? 'stopped' : liveSpeedKmh < 2.5 ? 'slow' : liveSpeedKmh > 3.5 ? 'fast' : 'ideal';
  const paceLabel = { stopped: 'STOPPED', slow: 'TOO SLOW · OVER SPRAYING', fast: 'TOO FAST · UNDER SPRAYING', ideal: 'IDEAL PACE' }[paceZone];
  const paceColor = { stopped: '#55655F', slow: '#0B6BA8', fast: '#A5201A', ideal: '#0A5238' }[paceZone];
  // flow rate = ground area covered per minute (swath x speed) x solution
  // per square metre (rateLRai / 1600 rai-in-sqm) — the actual L/min a pump
  // set to the target application rate needs to deliver at THIS pace.
  const rai = toRai(areaSprayed);
  const raiDec = areaSprayed / 1600;
  // Mission Summary "physical quantity" metrics (Spec §4D): convert the
  // overlap and missed-spot COUNTS into Rai and a wasted-litres figure
  // instead of leaving them as bare percentages.
  const missedCellsCount = sim.missedCells;
  const missedRai = (missedCellsCount * CELL * CELL) / 1600;
  const overlapRai = (sim.overlapCells * CELL * CELL) / 1600;
  const cbase = coverageBaseRef.current; // what the field already had sprayed before this mission started
  const mSprayedCells = Math.max(0, sim.sprayedCells - cbase.sprayed), mOverlapCells = Math.max(0, sim.overlapCells - cbase.overlap);
  const mArea = mSprayedCells * CELL * CELL, mRai = toRai(mArea), mRaiDec = mArea / 1600;
  const mOverlapRai = (mOverlapCells * CELL * CELL) / 1600;
  const mOverlapRate = mSprayedCells > 0 ? (mOverlapCells / mSprayedCells) * 100 : 0;
  // the saved-library entry (if any) backing the field currently loaded —
  // drives the prominent Field Selector card on the pre-mission setup screen
  const activeFieldEntry = activeFieldId ? fieldLibrary.find((f) => f.id === activeFieldId) : null;
  const fieldChecks = activeFieldEntry ? checks.filter((c) => c.fieldId === activeFieldEntry.id && (c.round || 1) === (activeFieldEntry.round || 1)) : [];
  checkPinsRef.current = (() => {
    const pj = projectorRef.current;
    const list = pj ? fieldChecks.filter((c) => c.lat != null).map((c) => { const p = pj(c.lat, c.lng); return { x: p.x, y: p.y, color: checkColor(c), glyph: checkGlyph(c) }; }) : [];
    return list.length ? { key: list.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)},${p.glyph}${p.color}`).join(';'), list } : null;
  })();
  // whole-mission liquid total (every refill included) — counts overlap
  // passes as real re-application, same basis the live tank gauge uses below
  const totalPassArea = (sim.sprayedCells + sim.overlapCells) * CELL * CELL;
  const running = phase === 'running';
  const dStation = dist(sim.pos, stationRef.current);
  // Spec §4C: direction back to the boundary for the Auto-Pause banner arrow.
  const oobArrowDeg = oob ? bearingTo(sim.pos, nearestEdgePoint(sim.pos, field.poly).proj) : 0;
  const gpsQuality = gpsInfo ? (gpsInfo.accuracy <= 5 ? 'STRONG' : gpsInfo.accuracy <= 15 ? 'FAIR' : 'WEAK') : null;
  const gpsColor = gpsQuality === 'STRONG' ? '#0A5238' : gpsQuality === 'FAIR' ? '#8A4B06' : '#A5201A';
  const gpsColorClass = gpsQuality === 'STRONG' ? 'text-[#0A5238]' : gpsQuality === 'FAIR' ? 'text-[#8A4B06]' : 'text-[#A5201A]';


  // ---- Tank & Liquid Volume Tracker -----------------------------------
  // Tank tracking is manual: the operator taps TANK EMPTY, the app records the area each tank covered.
  const curTankArea = tankOpenRef.current ? Math.max(0, totalPassArea - tankBaselineAreaRef.current) : 0;
  const tankNumber = tankAreasRef.current.length + 1;
  const avgTankRai = tankAreasRef.current.length ? tankAreasRef.current.reduce((x, y) => x + y, 0) / tankAreasRef.current.length / 1600 : null;
  const tanksUsed = tanksUsedCount();

  // Summary sub-line for OVERLAPPED. The percentage is overlap as a share of
  // NEW ground, so a run that broke no new ground — a touch-up over a field
  // already at 100 % — has a zero denominator and used to render a flat "0% of
  // sprayed area" directly under a non-zero rai figure, which reads as a bug.
  // There, say what actually happened instead of printing a meaningless rate.
  // Litres are only ever an estimate off the measured rai-per-tank average, so
  // they stay omitted until at least one tank has actually been closed.
  const wastedLitres = avgTankRai ? mOverlapRai * tankCapacity / avgTankRai : null;
  const wastedSuffix = wastedLitres != null ? ` · ≈${wastedLitres.toFixed(1)} L wasted` : '';
  const overlapSub = mSprayedCells > 0
    ? `${mOverlapRate.toFixed(0)}% of sprayed area${wastedSuffix}`

    phase === 'boundary' ? 'PLOT BOUNDARY' :
    phase === 'station' ? 'SET REFILL STATION' :
    phase === 'ready' ? 'READY' :
    phase === 'done' ? 'COMPLETE' :
    phase === 'paused' ? 'PAUSED' :
    { spray: 'SPRAYING', toStation: 'REFILL · NOT RECORDING' }[opMode]

  }[opMode];

  // Which single hint panel — GPS acquisition, boundary help, station help —
  // occupies the top zone's one hint slot this render. They're mutually
  // exclusive by construction now (one slot, not three independently
  // absolutely-positioned siblings that used to be able to land on the

  const topHint =
    srcMode === 'gps' && gpsStatus !== 'active' ? 'gps' :

    phase === 'station' ? 'station' : null;

  return (
    <div
      className="fixed inset-0 bg-[#F4F1E7] text-[#24322C] font-sans select-none overflow-hidden"
      style={{
        paddingTop: 'env(safe-area-inset-top)',

        paddingRight: 'env(safe-area-inset-right)',

    >
      {oob && <div className="oob-border absolute inset-0 z-30 pointer-events-none" />}

      {/* Map viewport — full-bleed background layer. Everything else below is
          one flex column stacked ON TOP of it (z-10), never positioned by
          guessed pixel offsets, so no HUD element can land on the same
          coordinates as another regardless of screen height or content. */}
      <div ref={wrapRef} className="absolute inset-0"
        onPointerDown={onWrapPointerDown} onPointerMove={onWrapPointerMove} onPointerUp={onWrapPointerUp} onPointerCancel={(e) => { AgrasLog.add('GESTURE', 'pointercancel'); onWrapPointerUp(e); }}>
        {/* image-rendering here guards the canvas's own backing-bitmap-to-CSS-pixel
            scaling (relevant if a resize ever lands between a devicePixelRatio
            backing-store resize and its matching CSS size, or on browsers that
            re-touch canvas compositing on zoom/pan) — belt-and-braces alongside
            the retina-resolution backing store set in the fit() resize handler
            and the high-quality smoothing set in drawSatelliteTiles, which is
            where the actual tile sharpness is decided. Two declarations (old

            this is a real <style> rule instead. */}
        <style>{'.agras-map-canvas{image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges;}'}</style>
        <canvas ref={canvasRef} className="absolute inset-0 touch-none agras-map-canvas" />
        {(() => {
          const v = viewRef.current, dpr = Math.min(2, window.devicePixelRatio || 1), fr = freeRectRef.current;
          if (!v || !(v.s > 0) || phase === 'done') return null;
          const mPerPx = dpr / v.s, nice = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000];
          let L = nice[0]; for (const n of nice) if (n / mPerPx <= 110) L = n;
          const w = L / mPerPx;
          const top = fr.h > 0 ? (fr.top + fr.h) / dpr - 26 : 140;
          return (
            <div className="absolute left-3 pointer-events-none flex flex-col gap-0.5" style={{ top }}>
              <span className="font-mono text-[9px] font-semibold text-[#14201C]" style={{ textShadow: '0 0 3px rgba(255,255,255,.95)' }}>{L >= 1000 ? (L / 1000) + ' km' : L + ' m'}</span>
              <div style={{ width: w, height: 5, borderLeft: '2px solid #fff', borderRight: '2px solid #fff', borderBottom: '2px solid #fff', filter: 'drop-shadow(0 0 2px #000)' }} />
            </div>
          );
        })()}
        {phase === 'boundary' && satelliteOn && (
          <div className="absolute inset-x-0 flex items-center justify-center pointer-events-none" style={{ top: 0, height: '100%', transform: `translateY(${freeDyRef.current / Math.min(2, window.devicePixelRatio || 1)}px)` }}>
            <Crosshair size={36} strokeWidth={1.5} className="text-[#0C6B48]" style={{ filter: 'drop-shadow(0 0 4px rgba(0,0,0,.85))' }} />
          </div>
        )}
      </div>

      {/* overflow-y-auto here is the fallback for phones where the READY

      <div className="absolute inset-0 z-10 flex flex-col pointer-events-none overflow-y-auto">

        {/* ---------- TOP SAFE ZONE ---------- */}
        <div className="flex flex-col gap-2 p-3 shrink-0" style={{ paddingTop: 'max(12px, env(safe-area-inset-top))' }}>

          {restoredToast && (phase === 'paused' || phase === 'running') && (

            </div>

          {oob && (

                <p className="text-[9px] text-[#55655F] font-mono truncate">
                  {phase === 'boundary' ? `${draft.length} corner${draft.length === 1 ? '' : 's'}`
                    : (activeFieldId || phase === 'running' || phase === 'paused' || phase === 'done')

                </p>
              </div>
            </Glass>

            <Glass data-hud className="pointer-events-auto px-2.5 py-2 flex flex-col justify-center gap-1.5 flex-1 basis-0 min-w-0 min-h-[48px] overflow-hidden">
              {devMode && (
                <button onClick={() => setDevPanelOpen((v) => !v)} className="flex items-center justify-between w-full text-[9px] font-mono tracking-[.14em] text-[#4A564F]">
                  <span>DEV{srcMode === 'sim' ? ' · SIM' : ''}</span>
                  <ChevronDown size={11} className={'transition-transform ' + (devPanelOpen ? 'rotate-180' : '')} />
                </button>
              )}
              {devMode && devPanelOpen && <Toggle2 value={srcMode} onChange={setSrcMode} options={[{ v: 'sim', label: 'SIM' }, { v: 'gps', label: 'GPS' }]} />}
{devMode && devPanelOpen && srcMode === 'sim' && (
                <>
                  <div className="flex items-center justify-between gap-2">
                    <Switch on={autoWalk} onChange={setAutoWalk} label="AUTO-WALK" />
                    <div className="flex gap-1">
                      {[1, 20, 60].map((s) => (
                        <button key={s} onClick={() => setMult(s)}
                          className={'font-mono text-[10px] min-w-[26px] min-h-[30px] px-0.5 rounded ' + (mult === s ? 'bg-[#0C6B48] text-[#FFFFFF] font-bold' : 'text-[#55655F]')}>{s}×</button>
                      ))}
                    </div>
                  </div>
                  {phase === 'running' && (
                    <button onClick={simulateExcursion} disabled={excursionActive || opMode !== 'spray'}
                      className="w-full min-h-[30px] flex items-center justify-center gap-1 text-[9px] font-mono tracking-wide text-[#8A4B06] border border-[#E2DCC9] rounded py-1 disabled:opacity-40">
                      <AlertTriangle size={11} className="shrink-0" /> <span className="truncate">{excursionActive ? 'DEMO RUNNING…' : 'TEST OUT-OF-BOUNDS'}</span>
                    </button>
                  )}
                </>
              )}
              {srcMode === 'gps' && (
                <button onClick={() => setGpsCardOpen((v) => !v)} className="flex items-center justify-between gap-1.5 min-w-0 w-full">
                  <span className="text-[9px] font-mono text-[#55655F] truncate">
                    {gpsStatus === 'active' && gpsInfo ? `±${gpsInfo.accuracy.toFixed(1)}m` : gpsStatus === 'requesting' ? 'locating…' : gpsStatus}
                  </span>
                  <span className="flex items-center gap-1 shrink-0">
                    {gpsQuality && <span className="text-[8.5px] font-mono font-bold px-1.5 py-0.5 rounded" style={{ color: gpsColor, border: `1px solid ${gpsColor}55` }}>{gpsQuality}</span>}
                    <ChevronDown size={11} className={'text-[#55655F] transition-transform ' + (gpsCardOpen ? 'rotate-180' : '')} />
                  </span>

              {/* Ready-phase station access moved into the consolidated
                  "Field setup" menu below (less clutter up here) — kept as a

              {(!devMode || devPanelOpen) && (phase === 'running' || phase === 'paused') && (
                <button onClick={startStationSetup} className="w-full min-h-[30px] flex items-center justify-center gap-1 text-[9px] font-mono tracking-wide text-[#0C6B48] border border-[#E2DCC9] rounded py-1">
                  <Droplet size={11} /> SET STATION
                </button>
              )}
            </Glass>
          </div>

          {/* Expandable raw-telemetry card — its own row, in-flow, so it

          {srcMode === 'gps' && gpsCardOpen && (

              <div className="grid grid-cols-3 gap-x-2 gap-y-2.5">

                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#55655F]">LNG</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate">{gpsInfo ? gpsInfo.lng.toFixed(6) : '—'}</p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#55655F]">ACCURACY</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate" style={{ color: gpsColor }}>{gpsInfo ? `±${gpsInfo.accuracy.toFixed(1)}m` : '—'}</p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#55655F]">SPEED</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate">{gpsExtraRef.current.speed != null ? `${(gpsExtraRef.current.speed * 3.6).toFixed(1)} km/h` : '—'}</p>
                </div>
                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#55655F]">HEADING</p>
                  <p className="font-mono tnum text-[11px] font-bold truncate flex items-center gap-1">

                    {gpsExtraRef.current.heading != null ? `${gpsExtraRef.current.heading.toFixed(0)}°` : '—'}
                  </p>

                <div className="min-w-0">
                  <p className="text-[8px] tracking-[.1em] font-mono text-[#55655F]">ALTITUDE</p>

                </div>

          {/* One hint slot — GPS acquisition, boundary help, or station help.
              Being in-flow here (not a sibling independently pinned to the

          {topHint === 'gps' && (
            <Glass className="pointer-events-auto px-3.5 py-3 border-[#8A4B06]/40">
              <p className="font-display text-sm font-bold tracking-wide text-[#8A4B06]">
                {{ requesting: 'REQUESTING GPS ACCESS…', denied: 'LOCATION PERMISSION DENIED', unavailable: 'GPS UNAVAILABLE', insecure: 'HTTPS REQUIRED FOR GPS', idle: 'STARTING GPS…' }[gpsStatus]}
              </p>
              <p className="text-xs text-[#55655F] mt-1 leading-snug">
                {gpsStatus === 'requesting' && 'Allow location access when your browser prompts you.'}
                {gpsStatus === 'denied' && 'This page’s location permission is set to Block. Open the site settings (the icon next to the address bar) and set Location to Allow — the browser remembers that choice for this page, so you won’t be asked again.'}
                {gpsStatus === 'unavailable' && 'This device or browser can’t report a location right now.'}
                {gpsStatus === 'insecure' && 'Open this page over https:// (or localhost) — browsers block GPS on insecure origins.'}
              </p>
              <div className="mt-2 flex items-center gap-4">
                {gpsStatus === 'denied' && <button onClick={() => setGpsRetryTick((n) => n + 1)} className="min-h-[30px] text-xs font-mono text-[#8A4B06] underline">Try Again</button>}
              </div>
            </Glass>
          )}
          {topHint === 'boundary' && (
            <Glass data-hud className="pointer-events-auto px-3.5 py-3">
              <p className="font-display text-sm font-bold tracking-wide text-[#0C6B48]">MAP THE PERIMETER</p>
              <p className="text-xs text-[#55655F] mt-1 leading-snug">
                {satelliteOn
                  ? 'Drag the map so the crosshair sits on each corner, then tap Add at Crosshair.'
                  : srcMode === 'gps'
                  ? 'Walk the real edges and tap Mark Corner at each one, or tap the map.'
                  : 'Tap the field edges in order, ' + Math.max(0, 3 - draft.length) + ' more to close.'}
              </p>
              <p className="font-mono text-[10px] text-[#55655F] mt-1.5">{draft.length} point{draft.length === 1 ? '' : 's'} plotted{draft.length >= 3 ? ' · all corners in? tap CLOSE FIELD' : srcMode === 'gps' && !fieldRef.current.gpsAnchored ? ' · map a real boundary to continue' : ''}</p>
            </Glass>
          )}
          {topHint === 'station' && (
            <Glass data-hud className="pointer-events-auto px-3.5 py-3 border-[#0C6B48]/40">
              <p className="font-display text-sm font-bold tracking-wide text-[#0C6B48]">SET REFILL STATION</p>
              <p className="text-xs text-[#55655F] mt-1 leading-snug">Tap where the mix tank sits{srcMode === 'gps' ? ', or use your current position.' : '.'}</p>
            </Glass>
          )}
        </div>

        {/* ---------- FLEXIBLE MIDDLE ZONE — telemetry tiles ----------
            flex-1 absorbs whatever vertical space is left between the top
            zone and everything pinned below, on ANY screen height. min-h-0 +
            overflow-y-auto means that on a genuinely cramped screen this

        <div className="flex-1 min-h-0 flex items-start justify-between gap-2 px-3 py-2 overflow-y-auto"> 
          {/* Spec §4C "Dim all numbers" while Auto-Paused out-of-bounds. */}
          <div className={'flex flex-col gap-2 pointer-events-none transition-opacity ' + (oob ? 'opacity-35' : 'opacity-100')}>
            {(phase === 'running' || phase === 'paused') && (
              <div className="flex flex-col gap-2" style={running && !showStats ? { display: 'none' } : undefined}>
                <Tile icon={TimerIcon} label="Spray time" value={fmtTime(sim.elapsed)} />
                <Tile icon={Footprints} label="Distance" value={sim.distance.toFixed(0)} unit="m" />
                <PaceTile kmh={liveSpeedKmh} label={paceLabel} color={paceColor} />
              </div>
            )}
          </div>
          <div className={'flex flex-col gap-2 items-end pointer-events-none transition-opacity ' + (oob ? 'opacity-35' : 'opacity-100')}>
            {(phase === 'running' || phase === 'paused') && (

                <Tile icon={Crosshair} label="Coverage" value={coveragePct.toFixed(0)} unit="%" accent="text-[#0A5238]" />

            {/* Satellite toggle: available on every screen that shows the map

            {(phase === 'boundary' || phase === 'station' || phase === 'ready' || phase === 'running' || phase === 'paused') && (
              <div className="flex flex-col gap-2.5 pointer-events-auto">

                  <>

                    <MapCtrlBtn icon={ZoomOut} onClick={() => zoomMap(-1)} title="Zoom out" />

</>

                  <div className="flex flex-col items-center gap-0.5">

                  </div>

                {/* compass: only when the map has been rotated; tap = north up */}
                {panRef.current && Math.abs(panRef.current.a || 0) > 0.03 && (phase !== 'running' && phase !== 'paused' || camMode === 'free') && (
                  <MapCtrlBtn icon={(p) => <NorthArrow size={p.size} style={{ transform: `rotate(${-(panRef.current.a || 0)}rad)` }} />}
                    onClick={() => { if (panRef.current) panRef.current = { ...panRef.current, a: 0 }; setTick((n) => n + 1); }} title="North up" />
                )}
                {(phase === 'running' || phase === 'paused') && (
                  <>
                    <MapCtrlBtn icon={LocateFixed} active={camMode === 'follow'} onClick={() => { navHeadingRef.current = null; setCamMode('follow'); }} title="Re-center on me" />
                    <MapCtrlBtn icon={OverviewIcon} active={camMode === 'fit'} onClick={() => setCamMode('fit')} title="Whole field" />
                    <MapCtrlBtn icon={Gauge} active={showStats} onClick={() => setShowStats((v) => !v)} title="Show stats" />
                  </>
                )}
              </div>
            )}
          </div>
        </div>

        {/* ---------- GUIDANCE CARD — its own row, own space ----------
            A separate flex row from the area/legend row below means the two
            can never fight for the same vertical band the way two
            independently-guessed bottom offsets (104px vs 178px) used to. */}
        {/* The refill trip, kept to one slim line so it doesn't cover the map:
            the way to the station while heading there, a short note at the
            station, and nothing on the walk back to the lane (the owner: the
            big card hid the field just when they went to carry on). */}
        {phase === 'running' && guidanceCopy && (() => {
          if (dStation < 10) reachedStationRef.current = true;
          const reached = reachedStationRef.current;
          if (reached && dStation >= 15) return null;
          return (
            <div className="shrink-0 px-3 pb-2 flex justify-center">
              <div className="pointer-events-auto">
                <Glass className="px-3 py-1.5 flex items-center gap-2 border-[#0C6B48]/40">
                  {reached
                    ? <Droplet size={15} className="text-[#0C6B48] shrink-0" />
                    : <Navigation size={15} className="text-[#0C6B48] shrink-0" style={{ transform: `rotate(${bearingTo(sim.pos, stationRef.current)}deg)` }} />}
                  <span className="text-[12px] font-mono font-bold text-[#0C6B48] whitespace-nowrap">
                    {reached ? 'At the station · refill, then tap REFILLED' : `To station · ${dStation.toFixed(0)} m`}
                  </span>
                </Glass>
              </div>
            </div>
          );
        })()}

        {/* ---------- BOTTOM INFO ROW — area sprayed + legend ----------
            Its own row too: guaranteed above the dock, guaranteed below the
            guidance card, by document order rather than by coordinates. */}
        {(phase === 'running' || phase === 'paused') && (
          <div className="shrink-0 px-3 pb-2 flex items-end justify-between gap-2">
            <div className="pointer-events-auto min-w-0">
              <Glass className="px-3.5 py-2.5 max-w-[220px]">

                <div className="flex items-baseline gap-1.5 mt-0.5 min-w-0">
                  <span className="font-mono tnum text-xl font-bold text-[#24322C] leading-none shrink-0">{areaSprayed.toFixed(0)}</span>
                  <span className="text-[11px] text-[#55655F] truncate">m² of {field.area.toFixed(0)}</span>
                </div>
                <p className="font-mono tnum text-[11px] text-[#0A5238] mt-1 truncate">{rai.rai}-{rai.ngan}-{rai.wa} rai <span className="text-[#55655F]">· tank #{tankNumber}</span></p>
              </Glass>
            </div>
            <div className="pointer-events-auto shrink-0">
              <Glass className="px-3 py-2.5 flex flex-col gap-1.5">
                {/* These are the colours paintCell writes into the coverage
                    raster, not UI tokens: the raster is tuned to read over
                    satellite imagery, so the swatches track it rather than
                    the palette, or the key stops matching the map. */}
                {[['#E4DFCD', 'Unsprayed'], ['#34C76F', 'Sprayed'], ['#FFB648', 'Overlapped']].map(([c, l]) => (
                  <div key={l} className="flex items-center gap-1.5">
                    <span className="w-2.5 h-2.5 rounded-[2px] shrink-0 border border-[#14201C]/20" style={{ background: c }} />

                  </div>
                ))}
              </Glass>
            </div>
          </div>

        {/* ---------- BOTTOM DOCK — fixed safe-area strip, always last ----------

        <div data-dock className="shrink-0 pointer-events-auto p-3" style={{ paddingBottom: 'max(12px, env(safe-area-inset-bottom))' }}>
          {phase === 'boundary' && (

              <DockBtn icon={X} label="CANCEL" tone="ghost" onClick={cancelPlotting} disabled={srcMode === 'gps' && !fieldRef.current.gpsAnchored} />
              {srcMode === 'gps' && !satelliteOn && <DockBtn icon={LocateFixed} label="MARK CORNER" tone="teal" onClick={markCorner} disabled={gpsStatus !== 'active'} />}
              {satelliteOn && <DockBtn icon={Crosshair} label="ADD AT CROSSHAIR" tone="teal" onClick={addPointAtCrosshair} />}
              <DockBtn icon={Undo2} label="UNDO" tone="ghost" onClick={undoPoint} disabled={!draft.length} />
              <DockBtn icon={confirmCloseField ? AlertTriangle : CheckCircle2} label={confirmCloseField ? 'TAP TO CONFIRM' : 'CLOSE FIELD'} tone={confirmCloseField ? 'amber' : 'teal'} big disabled={draft.length < 3} onClick={closeBoundary} />
            </Dock>
          )}
          {phase === 'station' && (
            <Dock>
              <DockBtn icon={X} label="CANCEL" tone="ghost" onClick={cancelStationSetup} />
              {srcMode === 'gps' && <DockBtn icon={LocateFixed} label="MY LOCATION" tone="teal" onClick={useMyLocationForStation} disabled={gpsStatus !== 'active'} />}
              <DockBtn icon={CheckCircle2} label="CONFIRM STATION" tone="teal" big onClick={confirmStation} />
            </Dock>
          )}
          {phase === 'ready' && (
            <div className="flex flex-col gap-2">
              {routePlan && (() => {
                const r = routePlan.variants[routePlan.idx], other = routePlan.variants[1 - routePlan.idx];

                return (
                  <div className="rounded-xl bg-[#FFFFFF] border border-[#0B6BA8]/50 px-3.5 py-2.5 shadow-[0_2px_14px_rgba(20,32,28,.12)]">

                      <div className="min-w-0">
                        <p className="text-[9.5px] tracking-[.14em] uppercase font-mono text-[#0B6BA8] font-bold">
                          Suggested route · {r.along ? 'along the long side' : 'across the field'}{routePlan.idx === routePlan.best ? ' · best' : ''}
                        </p>
                        <p className="text-[12px] font-mono text-[#14201C] font-bold mt-0.5">
                          {r.lanes} lanes · {Math.round(r.sprayLen)} m · about {tanks} tank{tanks === 1 ? '' : 's'}
                        </p>
                        <p className="text-[10px] font-mono text-[#55655F] mt-0.5">
                          Walk to refill ≈ {Math.round(r.empty)} m{r.tanks.length ? ` · ① ② … = tank runs out` : ''}
                        </p>
                        {routePlan.idx === routePlan.best && routePlan.farSaves >= 30 && (
                          <p className="text-[10px] font-mono text-[#55655F] mt-0.5">Starting at the far end would save ≈ {routePlan.farSaves} m</p>
                        )}
                      </div>
                      <button onClick={() => setRoutePlan(null)} aria-label="Close route" className="text-[#55655F] p-1 shrink-0"><X size={16} /></button>
                    </div>

                      <button onClick={() => setRoutePlan((p) => ({ ...p, idx: 1 - p.idx }))}

                      </button>
                    )}
                  </div>

              })()}
              {/* Everything that isn't "pick the field" or "start" — spray settings,

              {(() => {
                const unchecked = ['ppe', 'mixedRate', 'nozzle', 'wind'].filter((k) => !checklist[k]).length;
                const wx = sprayWeather;
                // the amber dot always comes with its reason, weather first
                const reason = wx && wx.rainNowWarning ? 'Raining now'
                  : wx && wx.rainSoonWarning ? `Rain ${wx.rainSoonProb != null ? Math.round(wx.rainSoonProb) + '% ' : ''}in 3 h`
                  : wx && wx.windWarning ? `Wind ${Math.round(wx.windKmh || 0)} km/h`
                  : unchecked > 0 ? `${unchecked} check${unchecked === 1 ? '' : 's'} left` : null;
                const stop = lastStopOfActiveField(), live = gpsLiveRef.current;
                const stopDist = stop && live.lat != null ? dist(stop, { x: live.x, y: live.y }) : null;
                return (
                  <div className="flex justify-end items-center gap-2 flex-wrap">
                    {stop && (
                      <div className="mr-auto flex items-center gap-1.5 rounded-full bg-[#FFFFFF] border border-[#14201C]/30 px-3 min-h-[36px] shadow-[0_2px_14px_rgba(20,32,28,.12)] text-[11px] font-mono font-bold text-[#14201C]">

                      <button onClick={() => setShowSpraySettings(true)}
                        className="flex items-center gap-1.5 rounded-full bg-[#FFFFFF] border border-[#8A4B06]/50 px-3 min-h-[36px] shadow-[0_2px_14px_rgba(20,32,28,.12)] text-[11px] font-mono font-bold text-[#8A4B06]">
                        <AlertTriangle size={13} className="shrink-0" />{reason}
                      </button>
                    )}
                    <button onClick={() => setShowSpraySettings(true)} aria-label="Settings" className="flex flex-col items-center gap-0.5">
                      <span className="relative w-[38px] h-[38px] rounded-full bg-[#FFFFFF] border border-[#E2DCC9] shadow-[0_2px_14px_rgba(20,32,28,.12)] flex items-center justify-center text-[#0C6B48]">
                        <SlidersIcon size={24} />
                        {reason && <span className="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full bg-[#8A4B06] border-2 border-[#FFFFFF]" />}
                      </span>
                      <span className="text-[9px] font-mono font-bold tracking-[.12em] text-[#14201C] px-1.5 py-px rounded-full bg-[#FBF8EF]/95 shadow-[0_1px_4px_rgba(0,0,0,.35)]">SETTINGS</span>
                    </button>
                  </div>
                );
              })()}
              {/* Field + START on one row (the owner's layout): the field you are

              <div className="flex gap-2 items-stretch">
                <button onClick={() => setShowFieldLibrary(true)}
                  className="flex-1 min-w-0 text-left rounded-xl border border-[#0C6B48]/40 bg-gradient-to-br from-[#E3F1E9] to-[#EAF4EF] px-3.5 py-3 flex items-center gap-3">

                      <>

                        <p className="text-[10px] font-mono text-[#55655F] truncate">
                          {(() => { const r = toRai(activeFieldEntry.areaSqm != null ? activeFieldEntry.areaSqm : activeFieldEntry.areaRai * 1600); return `${r.rai}-${r.ngan}-${r.wa} rai`; })()}
                          {' · '}{activeFieldEntry.lastSprayedTs ? `sprayed ${fmtDate(activeFieldEntry.lastSprayedTs)}` : `created ${fmtDate(activeFieldEntry.ts)}`}
                        </p>
                        <p className="text-[10px] font-mono text-[#0A5238] truncate">
                          Round {activeFieldEntry.round || 1}

                          {activeFieldEntry.cov && activeFieldEntry.cov.sprayedCells > 0
                            ? ` · ${Math.min(100, (activeFieldEntry.cov.sprayedCells * CELL * CELL) / (activeFieldEntry.areaSqm != null ? activeFieldEntry.areaSqm : activeFieldEntry.areaRai * 1600) * 100).toFixed(0)}% sprayed`
                            : ' · not started'}
                          {fieldChecks.length > 0 && ` · ${fieldChecks.length} check${fieldChecks.length === 1 ? '' : 's'}`}
                        </p>
                      </>
                    ) : (
                      <>
                        <p className="font-display text-[15px] font-bold text-[#14201C] truncate">
                          {fieldLibrary.length > 0 ? 'Tap to choose a saved field' : 'No saved fields yet'}
